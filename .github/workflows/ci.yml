name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: yarn smoke:pack
      - run: yarn site:build
      - run: yarn remote:check
      - run: yarn mcpb:pack
      - run: yarn smoke:mcpb

  # The published package runs on older Node than development does; check it
  # installs and runs on the oldest Node users are likely to have.
  package-on-node-22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn mcpb:pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --version
      - run: yarn smoke:pack
      - run: yarn smoke:mcpb

  # Claude Desktop runs the bundle on macOS and Windows; check it there too.
  bundle-on-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn mcpb:pack
      - run: yarn smoke:mcpb
