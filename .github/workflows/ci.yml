name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn validate
      - run: yarn smoke:pack

  # The published package runs on older Node than development does; check it
  # installs and runs on the oldest Node users are likely to have.
  package-on-node-22:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: yarn
      - run: yarn install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --version
      # yarn 1 won't run scripts when package.json `engines` excludes this
      # Node; npm installing the tarball only warns, as it would for a user.
      - run: yarn smoke:pack
        env:
          YARN_IGNORE_ENGINES: 'true'
