name: Live check

# Hourly: a quick check of earnrate.dev and mcp.earnrate.dev (no wallets).
# Daily: the full check, with a browser and a sign-in that saves and deletes
# an anonymous wallet, plus the server's error counts. A failure opens an
# issue assigned to the repo owner, so GitHub emails them; it closes when the
# same kind of check passes again.
# The earnrate-monitor Worker (monitor/) dispatches these on time, and a quick
# check within minutes of an outage; GitHub's own schedule, often hours late,
# stays as the backup.
on:
  schedule:
    - cron: '7 * * * *' # every hour
    - cron: '30 14 * * *' # every day, 14:30 UTC
  workflow_dispatch:
    inputs:
      quick:
        description: 'Quick check only'
        type: boolean
        default: false
      reason:
        description: 'Why it was started (the monitor sets "probe failed")'
        type: string
        default: ''

run-name: ${{ inputs.reason != '' && format('Live check ({0})', inputs.reason) || 'Live check' }}

permissions:
  actions: read
  contents: read
  issues: write

# The monitor and GitHub's schedule can start the same check together; one
# waits, so they never open two issues.
concurrency:
  group: live-check-${{ github.event.schedule == '7 * * * *' || inputs.quick == true }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QUICK: ${{ github.event.schedule == '7 * * * *' || inputs.quick == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: env.QUICK != 'true'
        run: |
          yarn install --frozen-lockfile
          yarn playwright install --with-deps chromium
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          node scripts/live-check.ts --report report.md $([ "$QUICK" = true ] && echo --quick)
          code=$?
          if [ "$QUICK" != true ]; then
            last=$(gh run list --workflow live-check.yml --event workflow_dispatch --limit 5 \
              --json databaseId,createdAt --jq "[.[] | select(.databaseId != $RUN_ID)][0].createdAt // empty")
            if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt 10800 ]; then
              echo "- FAIL the earnrate-monitor Worker hasn't dispatched a check since ${last:-ever}; check its GH_DISPATCH_TOKEN" >> report.md
              code=1
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$QUICK" = true ]; then
            label=uptime; title='earnrate.dev or mcp.earnrate.dev is down'
          else
            label=live-check; title='Live check failing'
          fi
          gh label create "$label" --color D93F0B --description "Failed the $label check" 2>/dev/null || true
          number=$(gh issue list --label "$label" --state open --json number --jq '.[0].number')
          if [ "$CODE" != 0 ]; then
            if [ -n "$number" ]; then
              # Hourly failures don't comment, or an outage would email every hour.
              [ "$QUICK" = true ] || gh issue comment "$number" --body-file report.md
            else
              gh issue create --title "$title" --label "$label" --assignee "$OWNER" --body-file report.md
            fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Passing again: $(head -n 1 report.md | sed 's/^# //')"
          fi
