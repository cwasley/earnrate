<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card cheat sheet · earnrate</title>
    <meta
      name="description"
      content="Which card to use for groceries, dining, gas and the rest, sent from earnrate.dev and worked out in your browser."
    />
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="earnrate" />
    <meta property="og:title" content="Card cheat sheet · earnrate" />
    <meta
      property="og:description"
      content="Which card to use for groceries, dining, gas and the rest."
    />
    <meta property="og:image" content="https://earnrate.dev/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://earnrate.dev/og.png" />
    <meta name="theme-color" content="#9a5020" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" href="/favicon.svg?v=2" />
    <link rel="stylesheet" href="/pages.css" />
    <script type="module" src="./sheet/main.tsx"></script>
  </head>
  <body>
    <main>
      <!--earnrate:header-->
      <div id="sheet" class="app">
        <h1>Card cheat sheet</h1>
        <noscript>
          <p class="callout">
            The cheat sheet is worked out by a script in this page, so it needs
            JavaScript turned on.
          </p>
        </noscript>
        <!-- The outline of a sent cheat sheet, until the page's script
             replaces it (sheet.css). -->
        <section class="panel sheet sent-sheet sheet-frame" aria-hidden="true">
          <div class="sheet-head frame-sheet-head">
            <div>
              <span class="sheet-brand frame-line"></span>
              <span class="frame-line frame-title"></span>
              <p class="frame-line frame-short"></p>
            </div>
          </div>
          <ol class="sheet-rows">
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
            <li>
              <span class="sheet-label frame-line frame-short"></span
              ><span class="sheet-card frame-line"></span
              ><span class="sheet-rate frame-line frame-rate"></span>
            </li>
          </ol>
        </section>
        <script>
          // A sent cheat sheet is in the address: its outline shows while the
          // page's script loads. Nothing is read from this browser.
          ;(() => {
            const main = document.currentScript.parentElement.parentElement
            if (!/(^#|&)s=/.test(location.hash)) return
            main.dataset.loading = ''
            setTimeout(() => delete main.dataset.loading, 12000)
          })()
        </script>
      </div>

      <!--earnrate:footer-->
    </main>
  </body>
</html>
