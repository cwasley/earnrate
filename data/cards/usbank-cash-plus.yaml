base_rate: 1
annual_fee: 0
foreign_transaction_fee: 3
welcome_offer:
  dollars: 200
  spend: 1000
  months: 3
  note: The page says within 90 days of account opening (about 3 months). Existing and previous Cash Rewards accounts don't qualify, and it can't be combined with any other bonus offer.
