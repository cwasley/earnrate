id: usbank-cash-plus
name: U.S. Bank Cash+ Visa Signature Card
color: '#4b6e8d'
issuer: usbank
network: visa
currency: cash
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
  - https://cashplus.usbank.com/cash-plus/samplemerchants
  - https://onboarding.usbank.com/gateway/partner/credit-card/begin?locationCode=8069&offerId=WRH8D23H2R&sourceCode=88256&page=terms
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 3
welcome_offer:
  dollars: 200
  spend: 1000
  months: 3
  note: The page says within 90 days of account opening (about 3 months). Existing and previous Cash Rewards accounts don't qualify, and it can't be combined with any other bonus offer.
caps:
  - id: five-percent-combined
    amount: 2000
    period: quarter
    then_rate: 1
choices:
  - id: five-percent
    pick: 2
    period: quarter
    options:
      cell-phone: [phone]
      department-stores: [department_store]
      electronics-stores: [electronics]
      fast-food: [dining.fast_food]
      furniture-stores: [furniture]
      ground-transportation: [transit]
      gyms-fitness: [fitness]
      home-utilities: [utilities]
      movie-theaters: [movie_theaters]
      # U.S. Bank: "This category includes only the merchants listed below."
      select-clothing-stores:
        merchants:
          [
            aeropostale,
            american-eagle,
            ann-taylor,
            banana-republic,
            eddie-bauer,
            express,
            forever-21,
            gap,
            j-crew,
            jos-a-bank,
            old-navy,
            talbots,
            the-limited,
          ]
      sporting-goods: [sporting_goods]
      tv-internet-streaming: [tv_internet, streaming]
  - id: two-percent
    pick: 1
    period: quarter
    options:
      gas-ev-charging: [gas, ev_charging]
      grocery-stores: [grocery]
      restaurants: [dining]
rules:
  - id: five-percent
    match: { choice: five-percent }
    # Ground transportation leaves out parking and tolls (also cruises and
    # tickets bought through travel agencies); no other 5% option covers them.
    exclude: { mccs: [7523, 4784] }
    rate: 5
    cap: five-percent-combined
  - id: two-percent
    match: { choice: two-percent }
    # Fast food is its own 5% option, not part of Restaurants. Gas at grocery
    # stores is left in until the todo below is settled.
    exclude: { categories: [gas.superstore, dining.fast_food] }
    rate: 2
  - id: travel-center
    match: { merchants: [usbank-travel-center] }
    rate: 5
    note: Prepaid air, hotel and car reservations booked in the U.S. Bank Travel Center.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
evidence:
  - rule: base_rate
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: '1% cash back on all other eligible purchases'
  - rule: five-percent
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: '5% cash back on two categories you choose'
  - rule: two-percent
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: '2% cash back on one everyday category you choose'
  - rule: travel-center
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: '5% cash back on prepaid travel. On air, hotel'
  - rule: five-percent
    url: https://cashplus.usbank.com/cash-plus/samplemerchants
    quote: 'This category includes only the merchants listed below'
  - rule: five-percent
    url: https://cashplus.usbank.com/cash-plus/samplemerchants
    quote: 'steam ships, cruise lines, freight trains, parking meters, parking garages and toll stations'
  - rule: five-percent
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: 'Purchases over $2,000 in the 5% categories will earn 1% cash back.'
  - rule: two-percent
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: 'Gas station and electric vehicle charging station purchases at discount stores/supercenters, wholesale clubs and grocery stores/supermarkets'
  - rule: two-percent
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: 'Excludes discount stores/supercenters and wholesale clubs'
  - rule: two-percent
    url: https://cashplus.usbank.com/cash-plus/samplemerchants
    quote: "Excludes most fast food restaurants like McDonald's"
  - rule: travel-center
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: 'additional 4% cash back for every $1 in eligible Net Purchases spent on prepaid air, car and hotel reservations'
  - rule: annual_fee
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: '$0 Annual fee'
  - rule: welcome_offer
    url: https://www.usbank.com/credit-cards/cash-plus-visa-signature-credit-card.html
    quote: 'Earn a $200 rewards bonus after you spend $1,000 in eligible purchases within the first 90 days of account opening'
  - rule: foreign_transaction_fee
    url: https://onboarding.usbank.com/gateway/partner/credit-card/begin?locationCode=8069&offerId=WRH8D23H2R&sourceCode=88256&page=terms
    quote: 'Foreign Transaction 3% of each foreign transaction'
todo:
  - "Gas at grocery stores (Kroger, Hy-Vee, Meijer) is modeled at 2%, as U.S. Bank's sample merchants page says it may qualify, varying by location; the card page's footnote says 1%, so it may earn 1% at some stations."
