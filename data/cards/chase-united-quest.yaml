id: chase-united-quest
name: United Quest Card
issuer: chase
network: visa
currency: united-miles
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/united/united-quest
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65756.html
base_rate: 1
annual_fee: 350
foreign_transaction_fee: 0
welcome_offer:
  points: 80000
  spend: 4000
  months: 3
  note: 'Up to 90,000 in total: plus 500 Premier qualifying points (PQP) after the first purchase and 10,000 bonus miles after adding an authorized user in the first 3 months. Not available to current cardmembers of this card, or previous cardmembers who received a new Cardmember bonus for this card within the last 24 months.'
rules:
  - id: united
    match: { merchants: [united] }
    rate: 4
    note: Tickets, seat upgrades, Economy Plus, inflight food, drinks and Wi-Fi, bag fees and other United fees bought from United. Not United Cruises, MileagePlus X, DIRECTV or Merchandise Awards, or United tickets bought through discount travel sites or third-party packages. The advertised 10x on flights includes 6x MileagePlus flight miles, which aren't card earnings.
  - id: renowned-hotels
    match: { merchants: [renowned-hotels-chase-travel] }
    rate: 5
    note: Prepaid hotel stays booked through Renowned Hotels and Resorts for United Cardmembers on Chase Travel. Bookings through FROSCH, Valerie Wilson Travel or Frosch International Travel don't earn 5x.
  - id: travel
    match: { categories: [travel] }
    rate: 2
    note: Includes airfare, trains, cruise lines, hotels, car rentals and resorts. Chase's travel category leaves out in-flight and on-board cruise purchases, sightseeing and attractions, merchants inside hotels and airports, and sellers of gift cards, points or miles.
  - id: transit-as-travel
    match: { categories: [transit] }
    rate: 2
    note: Chase's travel category on this card includes local transit, taxis, rideshare and tolls.
  - id: dining
    match: { categories: [dining] }
    rate: 2
    note: Includes takeout and eligible delivery services.
  - id: streaming
    match:
      {
        merchants:
          [
            apple-music,
            apple-tv,
            disney-plus,
            espn,
            fubotv,
            max,
            hulu,
            netflix,
            pandora,
            paramount-plus,
            peacock,
            showtime,
            siriusxm,
            sling-tv,
            spotify,
            youtube-premium,
            youtube-tv,
            fandango-at-home,
          ],
      }
    rate: 2
    note: Only the services on Chase's select streaming list, like Netflix, Hulu, Disney+ and Spotify.
todo:
  - United Card Events from Chase also earn 4x; no merchant exists for them, so they aren't modeled.
