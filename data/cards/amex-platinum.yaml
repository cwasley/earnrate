id: amex-platinum
name: The Platinum Card from American Express
color: '#c7c9cc'
issuer: amex
network: amex
currency: MR
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/platinum/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/platinum-card/25330-10-0#offer-terms
base_rate: 1
annual_fee: 895
foreign_transaction_fee: 0
welcome_offer:
  points: 175000
  spend: 12000
  months: 6
  varies: true
  note: 'The public offer is "as high as" 175,000 points; Amex shows the exact amount (which may be lower, or no offer) after you apply and before you accept. Not available if you have or have had this Card, the Schwab or Morgan Stanley Platinum Card, or previous versions of these Cards; Amex may also decline based on your card history.'
# One cap covers flights booked directly and through Amex Travel.
caps:
  - { id: flights, amount: 500000, period: calendar_year, then_rate: 1 }
rules:
  - id: flights
    match: { categories: [travel.flights] }
    rate: 5
    cap: flights
    note: Scheduled flights booked directly with the airline or through Amex Travel. Charter and private jet flights, and flights in tours, cruises or packages, are excluded.
  - id: flights-amex-travel
    match: { merchants: [amex-travel-flights] }
    rate: 5
    cap: flights
  - id: prepaid-hotels-amex-travel
    match: { merchants: [amex-travel-hotels] }
    rate: 5
    note: Prepaid hotels only.
  - id: airbnb-amex-travel
    match: { merchants: [airbnb-amex-travel] }
    rate: 5
    note: Prepaid Airbnb stays booked through Amex Travel, with your Airbnb account linked to Amex.
  - id: prepaid-car-rental-amex-travel
    match: { merchants: [amex-travel-car-rentals] }
    rate: 2
    note: Prepaid car rentals only.
  - id: cruises-amex-travel
    match: { merchants: [amex-travel-cruises] }
    rate: 2
    note: Cruises booked and charged through AmexTravel.com or by phone with Amex Travel. Payments made directly to the cruise line don't count.
milestones:
  - id: spend-75k
    spend: 75000
    period: calendar_year
    rewards:
      - Centurion Lounge guest access for 2 guests
      - unlimited Delta Sky Club access
    note: 'Purchases by additional card members count. Both last the rest of that calendar year, all of the next and through the January 31 after. Sky Club visits still need a same-day Delta flight.'
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: lululemon
    match: { merchants: [lululemon] }
    amount: 75
    period: quarter
    enroll: true
    note: U.S. lululemon stores, lululemon.com and the lululemon app. Not outlets, lululemon Studio, Like New, warehouse or event sales, gift cards, or orders shipped outside the U.S.
  - id: uber-cash
    match: { merchants: [uber, uber-eats] }
    amount: 15
    period: month
    month_amounts: { 12: 35 }
    note: 'Uber Cash, added to your Uber account each month once the card is in it, plus an extra $20 in December. Only on U.S. rides and orders paid with an Amex card; not for a card added through Apple Pay or PayPal.'
  - id: uber-one
    match: { merchants: [uber-one] }
    amount: 120
    period: calendar_year
    note: 'Uber One membership fees, monthly or annual, charged to the card with Uber Cash turned off for them. Not free trials.'
  - id: resy
    match: { merchants: [resy] }
    amount: 100
    period: quarter
    enroll: true
    note: 'U.S. restaurants that take Resy reservations, and purchases on Resy.com, in the Resy app or through Resy Pay. Not gift cards, delivery or catering.'
  - id: digital-entertainment
    match:
      {
        merchants:
          [
            disney-plus,
            espn,
            hulu,
            new-york-times,
            paramount-plus,
            peacock,
            wall-street-journal,
            youtube-premium,
            youtube-tv,
          ],
      }
    amount: 25
    period: month
    enroll: true
    note: "Bought directly from Disney+, ESPN streaming, Hulu, The New York Times, Paramount+, Peacock, The Wall Street Journal, YouTube Premium or YouTube TV. Not through a cable bundle or another company's app store."
  - id: equinox
    match: { merchants: [equinox] }
    amount: 300
    period: calendar_year
    enroll: true
    note: 'U.S. Equinox club memberships or an Equinox+ subscription.'
  - id: oura
    match: { merchants: [oura] }
    amount: 200
    period: calendar_year
    enroll: true
    note: 'An Oura Ring bought at ouraring.com and shipped in the U.S. Not Oura memberships, chargers or other add-ons.'
  - id: walmart-plus
    match: { merchants: [walmart-plus] }
    amount: 12.95
    period: month
    note: 'One Walmart+ monthly membership fee a month, plus its tax. Not annual memberships or Plus Ups.'
  - id: clear-plus
    match: { merchants: [clear] }
    amount: 219
    period: calendar_year
    note: 'An annual CLEAR+ membership.'
  # Listed, never applied to a purchase: earnrate can't tell which
  # purchases they pay on.
  - id: airline-fee
    listed:
      name: airline fee
      on: incidental fees charged by the one airline you select
    amount: 200
    period: calendar_year
    enroll: true
    note: 'Enrolling is selecting one airline: Alaska, American, Delta, JetBlue, Southwest or United. You can change it once a year, in January. Incidental fees charged by that airline separately from the ticket. Not tickets, upgrades, miles, gift cards, duty free, award tickets or fees from partner airlines.'
  - id: hotel
    listed:
      name: hotel
      on: prepaid Fine Hotels + Resorts, The Hotel Collection and Airbnb Luxe bookings through Amex Travel
    amount: 300
    period: half_year
    note: 'New prepaid ("Pay Now") bookings through AmexTravel.com, the Amex Travel app or by phone; Airbnb Luxe only online or in the app, with your Airbnb account linked to Amex. The Hotel Collection and Airbnb Luxe need a stay of two nights or more, and Fine Hotels + Resorts does too from January 1, 2027. Not property fees or charges by the property.'
todo:
  - 'Amex''s rewards terms count eligible purchases as "purchases for goods and services minus returns and other credits" and don''t say whether that takes out benefit statement credits. Its credits are modeled as earning the card''s rate on the whole purchase, with the credit on top.'
