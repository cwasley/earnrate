id: chase-ihg-one-rewards-business
name: IHG One Rewards Business Credit Card
issuer: chase
network: mastercard
currency: ihg-points
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://creditcards.chase.com/business-credit-cards/IHG/business
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
base_rate: 3
business: true
annual_fee: 200
welcome_offer:
  points: 190000
  spend: 5000
  months: 3
  note: 'Labeled a launch offer; no end date given. Plus 10,000 points after adding an employee card in the first 3 months. The page and its offer details state no bonus-eligibility rule for this card.'
rules:
  - id: ihg-hotels
    match: { merchants: [ihg] }
    rate: 10
    note: Card points only. Chase advertises "up to 26X total" at IHG, which adds up to 10X IHG member points and 6X Platinum Elite points that IHG posts for stays booked direct; those aren't card earnings.
  - id: dining-gas-advertising
    match: { categories: [dining, gas, online_advertising] }
    rate: 5
    note: Dining includes takeout and eligible delivery services. Advertising must be bought directly from a social media site or search engine, not through an ad agency.
  - id: flights-direct-and-car-rental
    match: { categories: [travel.flights, travel.car_rental] }
    rate: 5
    note: Airline tickets bought directly from the airline, and car rentals booked directly with the rental agency. Not through travel agencies or online travel sites.
  - id: travel-through-2026
    match: { categories: [travel, transit] }
    rate: 5
    valid_to: 2026-12-31
    note: All of Chase's travel category (which includes trains, buses, taxis and rideshare, tolls and parking) until purchases post after Dec 31, 2026. After that, other travel earns the 3x base rate.
  - id: office-supply-through-2026
    match: { categories: [office_supply] }
    rate: 5
    valid_to: 2026-12-31
    note: Stores that specialize in office supplies. Purchases posting after Dec 31, 2026 earn the 3x base rate.
evidence:
  - rule: base_rate
    url: https://creditcards.chase.com/business-credit-cards/IHG/business
    quote: 'Earn 3X points per $1 spent on all other purchases.'
  - rule: ihg-hotels
    url: https://creditcards.chase.com/business-credit-cards/IHG/business
    quote: "That's 10X points with this card"
  - rule: ihg-hotels
    url: https://creditcards.chase.com/business-credit-cards/IHG/business
    quote: "You'll earn 10 points for each $1 spent on qualifying purchases made at hotels participating in IHG One Rewards"
  - rule: dining-gas-advertising
    url: https://creditcards.chase.com/business-credit-cards/IHG/business
    quote: 'gas stations; dining at restaurants including takeout and eligible delivery services; social media and search engine advertising'
  - rule: dining-gas-advertising
    url: https://www.chase.com/personal/credit-cards/rewards-category-faq
    quote: 'advertising purchases made through a third party such as an ad agency or web designer'
  - rule: flights-direct-and-car-rental
    url: https://creditcards.chase.com/business-credit-cards/IHG/business
