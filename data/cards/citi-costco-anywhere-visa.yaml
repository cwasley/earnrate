    url: https://www.citi.com/credit-cards/citi-costco-anywhere-visa-credit-card
    quote: '1% cash back on all other purchases, including non-qualifying purchases listed above'
  - rule: costco-gas
    url: https://www.citi.com/credit-cards/citi-costco-anywhere-visa-credit-card
    quote: '5% cash back on gas purchased at Costco warehouse locations worldwide'
  - rule: costco-gas
