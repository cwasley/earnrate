id: barclays-jetblue-plus
name: JetBlue Plus Card
color: '#1e3a6b'
issuer: barclays
network: mastercard # World Elite Mastercard
currency: trueblue-points
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://cards.barclaycardus.com/banking/cards/jetblue-plus-card/
  # The card page's "Terms and Conditions" link (rates, fees and Reward Rules).
  - https://www.barclaycardus.com/applycontent/TnCs.jsp?tc48255
base_rate: 1
annual_fee: 99
foreign_transaction_fee: 0
welcome_offer:
  points: 60000
  spend: 1000
  months: 3
  note: 'Within 90 days of account opening, and the $99 annual fee must also be paid in full within those 90 days (paying only the minimum each month may not cover it). Not for current or previous JetBlue Plus cardmembers; Barclays may also decline for suspected abusive or gaming activity.'
rules:
  - id: jetblue
    match: { merchants: [jetblue, jetblue-vacations, trueblue-travel] }
    rate: 6
    note: Billed by JetBlue or JetBlue Vacations as merchant of record through their own channels (jetblue.com, reservations, airport counters, jetbluevacations.com), and travel booked at truebluetravel.com. Not buying TrueBlue points, hotels or cars outside a JetBlue Vacations package, or TrueBlue Travel pay-later hotels, international car rentals, insurance and fees.
  - id: restaurants
    match: { categories: [dining] }
    rate: 2
    note: Restaurants, bars and fast food, by merchant category code. Paying with a mobile wallet, a third-party payment account or a merchant's mobile card reader may not earn the bonus.
  - id: grocery
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club] }
    rate: 2
    note: Grocery stores and supermarkets, by merchant category code. Warehouse-type stores like Target and Walmart generally don't count.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: jetblue-vacations
    match: { merchants: [jetblue-vacations] }
    amount: 100
    period: calendar_year
    min_amount: 100
    note: One $100 credit a calendar year on a JetBlue Vacations package of $100 or more (after returns and credits), booked at jetbluevacations.com or 844-JB-VACAY. It posts 6-8 weeks after the purchase.
