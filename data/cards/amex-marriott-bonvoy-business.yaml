id: amex-marriott-bonvoy-business
name: Marriott Bonvoy Business American Express Card
short_name: Marriott Bonvoy Business
color: '#3a3a3e'
issuer: amex
network: amex
currency: marriott-bonvoy
business: true
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/business/business-credit-cards/amex-marriott-bonvoy-business-credit-card/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/business/prospect/marriott-bonvoy-business-american-express-card/45094-9-0#offer-terms
base_rate: 2
annual_fee: 125
foreign_transaction_fee: 0
welcome_offer:
  points: 75000
  spend: 6000
  months: 6
  note: 'Amex: "You may not be eligible to receive a welcome offer if you have or have had this Card or the Starwood Preferred Guest® Business Credit Card from American Express or previous versions of these Cards," and may also decline based on your card history. Also not available to anyone who had a Marriott business card from Chase in the last 30 days, opened the Marriott Bonvoy Bountiful, Boundless or Bold card from Chase in the last 90 days, or got a new Card Member bonus on one of those Chase cards in the last 24 months.'
rules:
  - id: marriott-hotels
    match: { merchants: [marriott] }
    rate: 6
    note: Charged directly with participating Marriott Bonvoy hotels, standalone Marriott retail stores and Marriott online stores (including Marriott gift cards online). Marriott's own member and elite points for stays aren't card earnings.
  - id: restaurants
    match: { categories: [dining] }
    rate: 4
    note: Charged directly at restaurants worldwide; a restaurant inside a hotel, casino or event venue may code as that place instead.
  - id: us-gas
    match: { categories: [gas] }
    rate: 4
    geography: us_only
    note: Gasoline at U.S. gas stations.
  - id: us-wireless
    match: { categories: [phone] }
    rate: 4
    geography: us_only
    note: Wireless phone service bought directly from a U.S. provider. Not Google Fi.
  - id: us-shipping
    match: { categories: [shipping] }
    rate: 4
    geography: us_only
    note: Shipping bought from U.S. merchants.
milestones:
  - id: free-night-60k
    spend: 60000
    period: calendar_year
    rewards:
      - Marriott Bonvoy Free Night Award (up to 35,000 points)
    note: Basic Card Member only, though Additional Card purchases count. Deposited 8-12 weeks after you reach $60,000; expires a year after it's issued.
