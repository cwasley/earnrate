id: chase-southwest-premier
name: Southwest Rapid Rewards Premier Credit Card
issuer: chase
network: visa
currency: southwest-rapid-rewards
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/southwest/premier
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
base_rate: 1
annual_fee: 149
welcome_offer:
  points: 55000
  spend: 1500
  months: 3
  note: 'Not available to current cardmembers of any Southwest Rapid Rewards Credit Card, or previous cardmembers of any Southwest Rapid Rewards Credit Card who received a new Cardmember bonus within the last 24 months (this does not apply to business cards).'
caps:
  - id: grocery-and-dining
    amount: 8000
    period: cardmember_year
    then_rate: 1
rules:
  - id: southwest
    match: { merchants: [southwest] }
    rate: 3
    note: Purchases made directly with Southwest, including flights, inflight, Southwest gift cards and Getaways by Southwest packages. Southwest Cruises, Southwest Charters and Southwest Cargo are excluded.
  - id: grocery
    match: { categories: [grocery] }
    exclude: { merchants: [walmart, target] }
    rate: 2
    cap: grocery-and-dining
    note: Shares an $8,000 per account anniversary year cap with restaurants. Chase's grocery category excludes warehouse clubs, discount stores such as Walmart and Target, and gas at grocery stores. Delivery services count only if they code as a grocery store.
  - id: dining
    match: { categories: [dining] }
    rate: 2
    cap: grocery-and-dining
    note: Shares an $8,000 per account anniversary year cap with grocery stores.
  - id: lyft
    match: { merchants: [lyft] }
    rate: 3
    valid_to: 2027-12-31
    note: Limited-time offer on rides, bikes, scooters and Lyft memberships bought in the Lyft app. Gift cards and Lyft car rentals are excluded.
