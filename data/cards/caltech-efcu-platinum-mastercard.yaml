todo:
  - "Membership is by eligibility, not a yearly fee: Caltech, JPL and affiliate employees, Caltech students and alumni association members, and their immediate family, with a $5 minimum deposit and a one-time $5 membership fee. No Caltech EFCU page says in so many words that the card needs membership; the card page sends applicants to eBranch, the members' online banking."
  - "caltechefcu.org sits behind Cloudflare and refuses plain curl, so the source check may list its pages as unreachable. The membership eligibility page's quote was read 2026-11-04 with an ordinary web fetch, not machine-checked."
  - "For California borrowers the disclosure says the card is secured by goods bought with it and by shares held at the credit union. That doesn't change what it earns."
