id: penfed-power-cash-rewards
name: PenFed Power Cash Rewards Visa Signature Card
short_name: PenFed Power Cash
color: '#1f5c99'
# PenFed is a credit union; the 2% rate is for Honors Advantage members, who
# have a PenFed checking account or serve (or served) in the military.
issuer: penfed
network: visa
currency: cash
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.penfed.org/credit-cards/power-cash-rewards-visa
base_rate: 1.5
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  dollars: 100
  spend: 1500
  months: 3
  note: The page says within 90 days of account opening (about 3 months); one $100 statement credit per account.
rules:
  - id: honors-advantage
    match: { any: true }
    rate: 2
    requires: { membership: penfed-honors-advantage }
    note: 2% on all purchases for PenFed Honors Advantage members (a PenFed checking account, or military service); 1.5% for other members.
