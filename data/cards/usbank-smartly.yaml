todo:
  - 'The card page puts the 2.5% tier at a qualifying balance of $10,000 to $49,999; the program rules page says "Between $5,000 - $49,999.99". The tier memberships (usbank-smartly-25, -50, -100) are named by rate, so a wallet picks its tier either way; which threshold applies is unconfirmed.'
  - "Bonus exclusions aren't modeled: education, gift cards, insurance, tax, business-to-business merchants and third-party bill payment earn 2% at every tier and don't use the $10,000, but earnrate has no categories for them, so the tier rules apply to them."
  - 'Points are worth full value only as a deposit to a U.S. Bank checking, savings or money market account. The card page also lists statement credits at that value; the program rules say statement credits may be at a reduced rate, without saying what. Modeled as cash at 1¢.'
  - 'Whether the Smartly Earning Bonus also applies to Travel Center hotels and car rentals (which would make them 6.5% to 8%) is unstated: the 4 extra points are "in addition to your base earn". Modeled at 6% for every tier.'
  - 'The tier can change within a billing cycle as the 30-day average balance moves; earnrate takes the tier the wallet says.'
