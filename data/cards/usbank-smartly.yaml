id: usbank-smartly
name: U.S. Bank Smartly Visa Signature Card
short_name: U.S. Bank Smartly
color: '#16171b'
issuer: usbank
network: visa
# Earned as points, 1 point per 1% of cash back, worth full value as a
# deposit to a U.S. Bank account (see todo on statement credits).
currency: cash
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.usbank.com/credit-cards/bank-smartly-visa-signature-credit-card.html
  - https://rewards.usbank.com/benefits/card/SmartlyBenefits/program-rules
  - https://onboarding.usbank.com/gateway/partner/credit-card/begin?locationCode=8069&offerId=36672BDX52&sourceCode=87869&page=terms
base_rate: 2
annual_fee: 0
foreign_transaction_fee: 3
caps:
  # The Smartly Earning Bonus counts only the first $10,000 of eligible net
  # purchases a billing cycle; past it every tier earns the base 2%.
  - id: smartly-earning-bonus
    amount: 10000
    period: month
    then_rate: 2
rules:
  # Smartly Earning Bonus tiers, by the 30-day average balance in Bank
  # Smartly Checking and Safe Debit, with a Bank Smartly Savings account.
  - id: everything-smartly-25
    match: { any: true }
    rate: 2.5
    cap: smartly-earning-bonus
    requires: { membership: usbank-smartly-25 }
    note: 2% plus the 25% Smartly Earning Bonus (a qualifying balance from $10,000 per the card page, $5,000 per the program rules, to $49,999.99), on the first $10,000 of eligible net purchases each billing cycle. Education, gift cards, insurance, tax, business-to-business merchants and third-party bill payment earn 2% and don't count toward the $10,000.
  - id: everything-smartly-50
    match: { any: true }
    rate: 3
    cap: smartly-earning-bonus
    requires: { membership: usbank-smartly-50 }
    note: 2% plus the 50% Smartly Earning Bonus (qualifying balance $50,000 to $99,999.99), on the first $10,000 of eligible net purchases each billing cycle. Education, gift cards, insurance, tax, business-to-business merchants and third-party bill payment earn 2% and don't count toward the $10,000.
  - id: everything-smartly-100
    match: { any: true }
    rate: 4
    cap: smartly-earning-bonus
    requires: { membership: usbank-smartly-100 }
    note: 2% plus the 100% Smartly Earning Bonus (qualifying balance $100,000 or more), on the first $10,000 of eligible net purchases each billing cycle. Education, gift cards, insurance, tax, business-to-business merchants and third-party bill payment earn 2% and don't count toward the $10,000.
  - id: travel-center-hotels-car-rentals
    match:
      {
        merchants:
          [usbank-travel-center-hotels, usbank-travel-center-car-rentals],
      }
    rate: 6
    note: Prepaid hotels and car rentals booked in the U.S. Bank Travel Center with this card, 4 extra points on top of the base 2. Air isn't included.
