id: chase-ihg-one-rewards-premier-select
name: IHG One Rewards Premier Select Credit Card
short_name: IHG Premier Select
color: '#2f4f6f'
issuer: chase
network: mastercard
currency: ihg-points
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/ihg-rewards-club/premier-select
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65336.html
base_rate: 3
annual_fee: 350
foreign_transaction_fee: 0
welcome_offer:
  points: 200000
  spend: 5000
  months: 3
  note: 'Labeled a launch offer; no end date given. Plus 10,000 points after adding an authorized user in the first 3 months. No free night in the welcome offer; the yearly Anniversary Free Night is a separate perk. Chase: "available to you if you do not have this card and have not received a new Cardmember bonus for this card in the past 24 months."'
rules:
  - id: ihg-hotels
    match: { merchants: [ihg] }
    rate: 12
    note: Card points only. Chase advertises "up to 28X total" at IHG, which adds up to 10X IHG member points and 6X Platinum Elite points that IHG posts for stays booked direct; those aren't card earnings.
  - id: travel-and-dining
    match: { categories: [travel, transit, dining] }
    rate: 6
    note: Chase's whole travel category, including rideshare, trains, buses, tolls and parking. Dining includes takeout and eligible delivery services.
milestones:
  - id: spend-15k
    spend: 15000
    period: calendar_year
    points: 20000
    rewards:
      - 5 Elite Night Credits
    note: "Every purchase on the card counts, by transaction date; balance transfers, cash advances and cash-like transactions don't. Chase says to allow 6-8 weeks for it to post."
  - id: spend-25k
    spend: 25000
    period: calendar_year
    rewards:
      - Diamond Elite status
    note: Status lasts through the end of the next calendar year.
  - id: spend-40k
    spend: 40000
    period: calendar_year
    rewards:
      - a free night at IHG hotels (up to 60,000 points)
    note: 'A second free night on top of the Anniversary Free Night; use it within 12 months.'
evidence:
