id: bank-of-america-atmos-rewards-ascent
name: Atmos Rewards Ascent Visa Signature Credit Card
issuer: bank-of-america
network: visa
currency: atmos-points
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.bankofamerica.com/credit-cards/products/alaska-airlines-credit-card/
  - https://www.bankofamerica.com/credit-cards/terms-and-conditions/?campaignid=4081060&productoffercode=RS&locale=en_US
base_rate: 1
annual_fee: 95
welcome_offer:
  points: 70000
  spend: 2500
  months: 3
  note: Limited-time online offer, no end date stated; it may not be available elsewhere after leaving the page. The window is 90 days from account opening. The offer also includes a $99 Companion Fare (plus taxes and fees from $23).
rules:
  - id: alaska-and-hawaiian
    match: { merchants: [alaska-airlines, hawaiian-airlines] }
    rate: 3
    note: Card points only; points and status from flying aren't card earnings.
  - id: gas-ev-cable-streaming-transit
    match: { categories: [gas, ev_charging, tv_internet, streaming, transit] }
    exclude: { mccs: [7523] }
    rate: 2
    note: Local transit includes rideshare, trains, buses, ferries and tolls; parking isn't on Bank of America's list. Cable means cable, satellite and other pay TV or streaming; internet-only or phone bills may not count.
  - id: alaska-and-hawaiian-with-boa-account
    match: { merchants: [alaska-airlines, hawaiian-airlines] }
    rate: 3.3
    requires: { membership: bank-of-america-account }
    note: 3x plus the 10% rewards bonus for holding an eligible Bank of America account.
  - id: gas-ev-cable-streaming-transit-with-boa-account
    match: { categories: [gas, ev_charging, tv_internet, streaming, transit] }
    exclude: { mccs: [7523] }
    rate: 2.2
    requires: { membership: bank-of-america-account }
    note: 2x plus the 10% rewards bonus for holding an eligible Bank of America account.
  - id: everything-else-with-boa-account
    match: { any: true }
    rate: 1.1
    requires: { membership: bank-of-america-account }
    note: The 1x base rate plus the 10% rewards bonus for holding an eligible Bank of America account.
