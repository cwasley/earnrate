id: discover-it-chrome
name: Discover it Chrome Credit Card
short_name: Discover it Chrome
color: '#8c9196'
# Discover merged into Capital One, N.A.; the application terms are headed
# "Discover by Capital One" and served from disclosures.capitalone.com.
issuer: discover
network: discover
currency: cash
last_verified: 2026-11-22
verified_by: claude
source_urls:
  # The card page, with its FAQs in a section that opens on click.
  - https://www.discover.com/credit-cards/cash-back/chrome/
  # The card page's "See rates, rewards, fees, and other cost information"
  # (pricing and rewards FAQ); the number is the page's offer id and changes
  # when Capital One changes it.
  - https://disclosures.capitalone.com/disclosure.42603.en-US.html
  # Discover's travel-card article: the only Discover page that states the
  # foreign transaction fee (the application terms' fee table has no row).
  - https://www.discover.com/credit-cards/card-smarts/best-international-travel-credit-card/
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
caps:
  # One $1,000 quarterly cap shared by gas stations and restaurants.
  - id: gas-restaurants-quarterly
    amount: 1000
    period: quarter
    then_rate: 1
rules:
  - id: gas-stations
    match: { categories: [gas] }
    exclude: { categories: [gas.grocery_store, gas.superstore] }
    rate: 2
    geography: us_only
    cap: gas-restaurants-quarterly
    note: Stand-alone gas stations, at the pump or inside. Gas stations at supermarkets, superstores and warehouse clubs may not count. Shares a $1,000 quarterly cap with restaurants.
  - id: restaurants
    match: { categories: [dining] }
    rate: 2
    geography: us_only
    cap: gas-restaurants-quarterly
    note: Full-service restaurants, cafes, cafeterias, fast-food locations and restaurant delivery services. Restaurants inside hotels or retail stores, and bakeries, may not qualify. Shares a $1,000 quarterly cap with gas stations.
  - id: capital-one-travel
    match:
      {
        merchants:
          [
            capital-one-travel-hotels,
            capital-one-travel-vacation-rentals,
            capital-one-travel-car-rentals,
            capital-one-travel-activities,
          ],
      }
    rate: 5
    note: Hotels, vacation rentals, rental cars and activities booked through Capital One Travel only. Flights booked there, and hotel incidentals or upgrades paid outside Capital One Travel, earn the base 1%.
  - id: capital-one-entertainment
    match: { merchants: [capital-one-entertainment] }
    rate: 5
    note: Tickets bought on the Capital One Entertainment ticketing platform only. Cardholder-exclusive pre-sales, tickets bought directly from Capital One Hall or Capital One Arena, and Capital One Dining are excluded.
intro_rates:
  # Discover matches the cash back a new cardmember earns, paid after the
  # match period, so every rate counts double for those 365 days.
  - id: cashback-match
    days: 365
    multiply: 2
    note: Cashback Match, for new cardmembers. Discover matches all the cash back earned from the day the account is approved through the first 365 days, with no limit, and adds it within two billing periods after; cash back processed after the match period isn't matched.
todo:
  - Discover's 2% gas category includes "some public electric vehicle charging stations" without saying which. EV charging isn't matched; it earns the base 1% here.
  - Discover's restaurant list (full-service restaurants, cafes, cafeterias, fast food and restaurant delivery) doesn't name bars or caterers. The rule matches earnrate's restaurant category, bars included, as the Discover it Cash Back restaurant quarters do.
  - Third-party payment accounts and digital wallet transactions may not earn 2% if they don't carry a qualifying MCC. Not modeled.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
