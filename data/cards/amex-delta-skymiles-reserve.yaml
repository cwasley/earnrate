id: amex-delta-skymiles-reserve
name: Delta SkyMiles Reserve American Express Card
short_name: Delta SkyMiles Reserve
color: '#2b2d33'
issuer: amex
network: amex
currency: delta-skymiles
last_verified: 2026-11-05
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/delta-skymiles-reserve-american-express-card/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/delta-skymiles-reserve-american-express-card/25330-10-0#offer-terms
base_rate: 1
annual_fee: 650
foreign_transaction_fee: 0
welcome_offer:
  points: 125000
  spend: 5000
  months: 6
  varies: true
  note: 'The public offer is "as high as" 125,000 bonus miles; Amex shows the exact miles (which may be lower, or no offer) after you apply and before you accept. Amex: "You may not be eligible for a welcome offer if you have or have had this Card or previous versions of this Card." Amex may also decline based on your card history.'
rules:
  - id: delta
    match: { merchants: [delta, delta-vacations, delta-stays] }
    rate: 3
    note: Charged directly with Delta as merchant of record (delta.com, the Fly Delta app, phone, ticket counters), including Basic Economy fares, upgrades, seats, Sky Club membership, Delta-operated in-flight food and drinks, Delta Vacations packages and new Delta Stays bookings. Not Delta gift cards, deltashop.com, the Delta Flight Museum or in-flight Wi-Fi.
milestones:
  - id: unlimited-sky-club-75k
    spend: 75000
    period: calendar_year
    rewards:
      - Unlimited Delta Sky Club access
    note: Replaces the 15 yearly Visits for the Basic and Additional Reserve Card Members, for the rest of that calendar year, all of the next and through January 31 after it. Usually within a week of reaching the total, up to 12 weeks. Gift cards, prepaid cards and cash equivalents don't count.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: resy
    match: { merchants: [resy] }
    amount: 20
    period: month
    enroll: true
    note: 'U.S. restaurants that take Resy reservations, and purchases on Resy.com, in the Resy app or through Resy Pay.'
  - id: rideshare
    match: { merchants: [uber, lyft, curb, alto] }
    amount: 10
    period: month
    enroll: true
    note: 'U.S. rides with Uber, Lyft, Curb or Alto.'
  - id: delta-stays
    match: { merchants: [delta-stays] }
    amount: 200
    period: calendar_year
    note: 'A new prepaid hotel or vacation rental booked on Delta Stays (delta.com/stays). Not resort, property or cancellation fees.'
