id: chase-united-club-business
name: United Club Business Card
color: '#1a2130'
issuer: chase
network: visa
currency: united-miles
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/business-credit-cards/united/united-club-business
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65424.html
base_rate: 1.5
business: true
annual_fee: 695
foreign_transaction_fee: 0
welcome_offer:
  points: 90000
  spend: 5000
  months: 3
  note: 'The main tier also earns 2,000 Premier qualifying points (PQP). Up to 100,000 miles in total: plus 10,000 bonus miles after adding an employee card in the first 3 months. Not available to current cardmembers of this card, or previous cardmembers who received a new Cardmember bonus for this card within the last 24 months.'
rules:
  - id: united
    match: { merchants: [united] }
    rate: 2
    note: Tickets, seat upgrades, Economy Plus, inflight food, drinks and Wi-Fi, bag fees and other United fees bought from United. Not United Cruises, MileagePlus X, DIRECTV or Merchandise Awards, or United tickets bought through discount travel sites or third-party packages. The advertised 8x on flights includes 6x MileagePlus flight miles, which aren't card earnings.
  - id: renowned-hotels
    match: { merchants: [renowned-hotels-chase-travel] }
    rate: 5
    note: Prepaid hotel stays booked through Renowned Hotels and Resorts for United Cardmembers on Chase Travel. Bookings through FROSCH and its family of travel companies don't earn 5x.
milestones:
  - id: spend-40k
    spend: 40000
    period: calendar_year
    rewards:
      - 2 global Economy Plus seat upgrades
    note: 'For the primary cardmember, on tickets bought with the card. Chase says to allow 6-8 weeks for them to post; use them within 12 months.'
  - id: spend-50k
    spend: 50000
    period: calendar_year
    rewards:
      - United Club All Access membership
    note: 'Premier Gold status unlocks it too. It lasts the rest of that calendar year and all of the next.'
todo:
  - United Card Events from Chase also earn 2x; no merchant exists for them, so they aren't modeled.
  - "The issuer's terms don't say whether purchases a credit pays for earn rewards. Its credits are modeled as earning the card's rate on the whole purchase, with the credit on top."
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: instacart
    match: { merchants: [instacart] }
    amount: 20
    period: month
    enroll: true
    valid_to: 2027-12-31
    note: "Instacart credits, which need an active Instacart+ membership: activate Chase's complimentary one with the card. Each credit applies to one order."
  - id: rideshare
    match: { categories: [transit.rideshare] }
    amount: 12
    period: month
    enroll: true
    note: 'Rideshare rides. Opt in each year. December allows $18 (modeled at $12).'
  - id: jsx
    match: { merchants: [jsx] }
    amount: 200
    period: cardmember_year
    note: 'Flights booked directly with JSX.'
  - id: renowned-hotels-credit
    match: { merchants: [renowned-hotels-chase-travel] }
    amount: 200
    period: cardmember_year
    note: 'Hotel stays prepaid through Renowned Hotels and Resorts for United cardmembers.'
