id: chase-southwest-performance-business
name: Southwest Rapid Rewards Performance Business Credit Card
issuer: chase
network: visa
currency: southwest-rapid-rewards
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://creditcards.chase.com/southwest/performance-business-credit-card
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://creditcards.chase.com/business-credit-cards/southwest/performance-business
base_rate: 1
business: true
annual_fee: 299
welcome_offer:
  points: 80000
  spend: 5000
  months: 3
  note: 'Not available to current cardmembers of this business card, or previous cardmembers who received a new Cardmember bonus for this business card within the last 24 months.'
rules:
  - id: southwest
    match: { merchants: [southwest] }
    rate: 4
    note: Purchases made directly with Southwest, including flights, inflight, Southwest gift cards and Getaways by Southwest packages. Southwest Cruises, Southwest Charters and Southwest Cargo are excluded.
  - id: gas
    match: { categories: [gas] }
    rate: 2
  - id: dining
    match: { categories: [dining] }
    rate: 2
  - id: hotels-direct
    match: { categories: [travel.hotels] }
    rate: 2
    note: Only hotel stays booked directly with the hotel. Travel agencies, discount travel sites, vacation clubs and packages don't count, and neither do charges on the hotel premises other than the room bill.
  - id: local-transit
    match: { categories: [transit] }
    rate: 2
    note: Local transit and commuting, including rideshare, trains, buses, taxis, ferries, tolls and parking. Bike or scooter rentals and car sharing are excluded.
  - id: lyft
    match: { merchants: [lyft] }
    rate: 5
    valid_to: 2027-12-31
    note: Limited-time offer on rides, bikes, scooters and Lyft memberships bought in the Lyft app. Gift cards and Lyft car rentals are excluded.
