id: chase-united-business
name: United Business Card
color: '#1f3f77'
issuer: chase
network: visa
currency: united-miles
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/business-credit-cards/united/united-business-card
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65426.html
base_rate: 1
business: true
annual_fee: 150
foreign_transaction_fee: 0
welcome_offer:
  points: 90000
  spend: 5000
  months: 3
  note: 'The main tier also earns 2,000 Premier qualifying points (PQP). Up to 100,000 miles in total: plus 10,000 bonus miles after adding an employee card in the first 3 months. Not available to current cardmembers of this card, or previous cardmembers who received a new Cardmember bonus for this card within the last 24 months.'
rules:
  - id: united
    match: { merchants: [united] }
    rate: 2
    note: Tickets, seat upgrades, Economy Plus, inflight food, drinks and Wi-Fi, bag fees and other United fees bought from United. Not United Cruises, MileagePlus X, DIRECTV or Merchandise Awards, or United tickets bought through discount travel sites or third-party packages. The advertised 8x on flights includes 6x MileagePlus flight miles, which aren't card earnings.
  - id: gas
    match: { categories: [gas] }
    rate: 2
    note: Not truck stops, marinas, or oil and propane distributors.
  - id: dining
    match: { categories: [dining] }
    rate: 2
    note: Includes eligible delivery services.
  - id: office-supply
    match: { categories: [office_supply] }
    rate: 2
    note: Only stores that specialize in office supplies. Discount, department and electronics stores don't count.
  - id: local-transit
    match: { categories: [transit] }
    rate: 2
    note: Local transit and commuting, including rideshare, taxis, trains, buses, ferries, tolls and parking. Not airlines, car rentals, bike or scooter rentals or car sharing.
milestones:
  - id: spend-25k
    spend: 25000
    period: calendar_year
    rewards:
      - 2 continental U.S. Economy Plus seat upgrades
    note: 'For the primary cardmember, on tickets bought with the card. Chase says to allow 6-8 weeks for them to post; use them within 12 months.'
todo:
  - United Card Events from Chase also earn 2x; no merchant exists for them, so they aren't modeled.
  - "The issuer's terms don't say whether purchases a credit pays for earn rewards. Its credits are modeled as earning the card's rate on the whole purchase, with the credit on top."
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: instacart
    match: { merchants: [instacart] }
    amount: 10
    period: month
    enroll: true
    valid_to: 2027-12-31
    note: "Instacart credits, which need an active Instacart+ membership: activate Chase's complimentary one with the card."
  - id: rideshare
    match: { categories: [transit.rideshare] }
    amount: 8
    period: month
    enroll: true
    note: 'Rideshare rides. Opt in each year. December allows $12 (modeled at $8).'
  - id: jsx
    match: { merchants: [jsx] }
    amount: 100
    period: cardmember_year
    note: 'Flights booked directly with JSX.'
