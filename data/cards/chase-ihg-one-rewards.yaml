id: chase-ihg-one-rewards
name: IHG One Rewards Credit Card
issuer: chase
network: mastercard
currency: ihg-points
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/ihg-rewards-club/one-rewards
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65295.html
base_rate: 2
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 125000
  spend: 2000
  months: 3
  not_with:
    [chase-ihg-one-rewards-premier, chase-ihg-one-rewards-premier-select]
  note: 'Labeled a launch offer; no end date given. Plus 10,000 points after adding an authorized user in the first 3 months. Chase: "available to you if you do not have any personal IHG One Rewards Credit Cards and have not received a new Cardmember bonus within the last 24 months. This does not apply to Business Card Credit Card products."'
rules:
  - id: ihg-hotels
    match: { merchants: [ihg] }
    rate: 5
    note: Card points only. Chase advertises "up to 17X total" at IHG, which adds up to 10X IHG member points and 2X Silver Elite points that IHG posts for stays booked direct; those aren't card earnings.
  - id: dining-grocery-gas
    match: { categories: [dining, grocery.supermarket, gas] }
    rate: 3
    note: Dining includes takeout and eligible delivery services. Chase's grocery stores exclude warehouse clubs, discount stores, drugstores and gas at grocery-store stations; delivery services count only if they code as a grocery store.
  - id: bills-and-streaming-through-2026
    match: { categories: [utilities, tv_internet, phone, streaming] }
    rate: 3
    valid_to: 2026-12-31
    note: Utilities; internet, cable and phone; and select streaming services (Chase's list includes Netflix, Hulu, Disney+, Max, Spotify, YouTube TV and others). Purchases posting after Dec 31, 2026 earn the 2x base rate.
milestones:
  - id: spend-15k
    spend: 15000
    period: calendar_year
    points: 10000
    rewards:
      - Gold Elite status
    note: "Every purchase on the card counts, by transaction date; balance transfers, cash advances and cash-like transactions don't. Status lasts through the end of the next calendar year. Chase says to allow 6-8 weeks for it to post."
