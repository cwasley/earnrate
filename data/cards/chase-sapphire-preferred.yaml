id: chase-sapphire-preferred
name: Chase Sapphire Preferred Card
color: '#1f4f9c'
issuer: chase
network: visa
currency: UR
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/rewards-credit-cards/sapphire/preferred
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65222.html
base_rate: 1
annual_fee: 95
foreign_transaction_fee: 0
welcome_offer:
  points: 75000
  spend: 5000
  months: 3
  note: 'Chase: "This credit card is unavailable to you if you currently have this card open. The new cardmember bonus may not be available to you if you previously held this card or received a new cardmember bonus for this card." Chase may also weigh how many cards you''ve opened and closed.'
rules:
  - id: chase-travel
    match: { merchants: [chase-travel] }
    rate: 5
    note: Bookings through FROSCH or Valerie Wilson Travel by Chase Travel earn 2x instead. The first $100 of Chase Travel hotel purchases each account anniversary year is covered by the hotel credit and earns no points.
  - id: dining
    match: { categories: [dining] }
    rate: 3
    note: Includes takeout and eligible delivery services.
  - id: gas-and-ev-charging
    match: { categories: [gas, ev_charging] }
    rate: 3
  - id: vacation-homes
    match: { merchants: [airbnb, vrbo, vacasa, plum-guide, homestay-com] }
    rate: 3
    note: Only bookings made directly with these brands. A Vrbo stay billed by the property manager doesn't count; only the part Vrbo bills does.
  - id: lyft
    match: { merchants: [lyft] }
    rate: 5
    valid_to: 2027-09-30
    note: Limited-time offer on Lyft products bought in the Lyft app (rides, bikes and scooters, memberships). Not gift cards or car rentals.
  - id: peloton
    match: { merchants: [peloton] }
    rate: 5
    geography: us_only
    valid_from: 2025-04-01
    valid_to: 2027-12-31
    note: Peloton equipment and accessory purchases over $150 bought directly from Peloton, on up to $5,000 in total purchases over the whole offer. Not apparel or gift cards.
  - id: streaming
    match:
      merchants:
        [
          apple-music,
          apple-tv,
          disney-plus,
          espn,
          fubotv,
          max,
          hulu,
          netflix,
          pandora,
          paramount-plus,
          peacock,
          showtime,
          siriusxm,
          sling-tv,
          spotify,
          youtube-premium,
          youtube-tv,
          fandango-at-home,
        ]
    rate: 3
    note: Only the "top streaming services" Chase lists at chase.com/RewardsCategoryFAQs. Peacock and Showtime are on the list too.
  - id: online-grocery
    match: { categories: [grocery.online] }
    exclude: { categories: [warehouse_club], merchants: [walmart, target] }
    rate: 3
    note: Online pickup and delivery orders from grocery stores, specialty food stores and grocery delivery services, including meal kits. Not Target, Walmart, wholesale clubs, liquor stores, supermarket pharmacies, memberships or gift cards.
    named:
      not_earning: [walmart, target, costco, bjs-wholesale-club]
  - id: travel
    match: { categories: [travel] }
    rate: 2
  - id: transit-as-travel
    match: { categories: [transit] }
    rate: 2
    note: Chase's travel category includes passenger trains, buses, taxis, ferries, tolls and parking. Rideshare codes as a taxi.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: chase-travel-hotels
    match: { merchants: [chase-travel] }
    amount: 100
    period: cardmember_year
    note: 'Hotel stays bought through Chase Travel only, applied automatically.'
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
