id: amex-marriott-bonvoy-brilliant
name: Marriott Bonvoy Brilliant American Express Card
issuer: amex
network: amex
currency: marriott-bonvoy
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/marriott-bonvoy-brilliant/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/marriott-bonvoy-brilliant-card/25330-10-0#offer-terms
base_rate: 2
annual_fee: 650
foreign_transaction_fee: 0
welcome_offer:
  points: 100000
  spend: 6000
  months: 6
  note: 'No end date given. Not available if you have or have had this Card, the Starwood Preferred Guest American Express Luxury Card or previous versions; Amex may also decline based on your card history. Also not available to anyone who had a Ritz-Carlton card from J.P. Morgan in the last 30 days, opened the Marriott Bonvoy Bountiful, Boundless or Bold card from Chase in the last 90 days, or got a new cardmember or upgrade bonus on one of those Chase cards in the last 24 months.'
rules:
  - id: marriott-hotels
    match: { merchants: [marriott] }
    rate: 6
    note: Charged directly with participating Marriott Bonvoy hotels, standalone Marriott retail stores and Marriott online stores (including Marriott gift cards online). Marriott's own member and elite points for stays aren't card earnings.
  - id: restaurants
    match: { categories: [dining] }
    rate: 3
    note: Restaurants worldwide. Not nightclubs, convenience stores, grocery stores or supermarkets; a restaurant inside a hotel, casino or event venue may code as that place instead.
  - id: flights
    match: { categories: [travel.flights] }
    rate: 3
    note: Scheduled flights charged directly with the airline. Charter and private jet flights are excluded.
milestones:
  - id: earned-choice-60k
    spend: 60000
    period: calendar_year
    rewards:
      - 'Brilliant Earned Choice Award: pick five Nightly Upgrade Awards, a Free Night Award (up to 85,000 points) or 50,000 Bonvoy points'
    note: One a calendar year, picked at choice-benefit.marriott.com/brilliant by February 1 of the next year, or it defaults to the Nightly Upgrade Awards. Basic Card Member only.
