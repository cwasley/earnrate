todo:
  - The Brilliant Earned Choice Award can be 50,000 points, but it's a pick among non-point awards too, so the milestone carries no points value.
  - The $300 Brilliant Dining Credit (up to $25 a month at restaurants worldwide), the $100 property credit on two-night Ritz-Carlton or St. Regis stays, and the yearly Free Night Award (up to 85,000 points) after each renewal month aren't modeled.
  - Complimentary Platinum Elite status and 25 Elite Night Credits each year aren't modeled; they don't depend on spending.
