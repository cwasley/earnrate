  - MVC status ($600 a year at Kohl's on the card) adds free-shipping offers. Not modeled.
  - "No fixed-amount welcome offer. New cardholders get a 40% off coupon for one transaction within 30 days of credit availability, a percentage discount, so it isn't modeled as welcome_offer."
