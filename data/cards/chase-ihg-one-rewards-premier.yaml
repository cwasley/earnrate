id: chase-ihg-one-rewards-premier
name: IHG One Rewards Premier Credit Card
color: '#1f2b3a'
issuer: chase
network: mastercard
currency: ihg-points
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/ihg-rewards-club/premier
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65294.html
base_rate: 3
annual_fee: 150
foreign_transaction_fee: 0
welcome_offer:
  points: 180000
  spend: 3000
  months: 3
  not_with: [chase-ihg-one-rewards, chase-ihg-one-rewards-premier-select]
  note: 'Labeled a launch offer; no end date given. Plus 10,000 points after adding an authorized user in the first 3 months. No free night in the welcome offer; the yearly Anniversary Free Night is a separate perk. Chase: "available to you if you do not have any personal IHG One Rewards Credit Cards and have not received a new Cardmember bonus within the last 24 months. This does not apply to Business Card Credit Card products."'
rules:
  - id: ihg-hotels
    match: { merchants: [ihg] }
    rate: 10
    note: Card points only. Chase advertises "up to 24X total" at IHG, which adds up to 10X IHG member points and 4X Gold Elite points that IHG posts for stays booked direct; those aren't card earnings.
  - id: dining-grocery-gas
    match: { categories: [dining, grocery.supermarket, gas] }
    rate: 5
    note: Dining includes takeout and eligible delivery services. Chase's grocery stores exclude warehouse clubs, discount stores, drugstores and gas at grocery-store stations; delivery services count only if they code as a grocery store.
  - id: flights-direct-and-car-rental
    match: { categories: [travel.flights, travel.car_rental] }
    rate: 5
    note: Airline tickets bought directly from the airline, and car rentals booked directly with the rental agency. Not through travel agencies or online travel sites.
  - id: travel-through-2026
    match: { categories: [travel, transit] }
    rate: 5
    valid_to: 2026-12-31
    note: All of Chase's travel category (which includes trains, buses, taxis and rideshare, tolls and parking) until purchases post after Dec 31, 2026. After that, other travel earns the 3x base rate.
milestones:
  - id: spend-15k
    spend: 15000
    period: calendar_year
    points: 15000
    rewards:
      - Platinum Elite status
      - 5 Elite Night Credits
    note: "Every purchase on the card counts, by transaction date; balance transfers, cash advances and cash-like transactions don't. Status lasts through the end of the next calendar year. Chase says to allow 6-8 weeks for it to post."
  - id: spend-40k
    spend: 40000
    period: calendar_year
    rewards:
      - Diamond Elite status
    note: Status lasts through the end of the next calendar year.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: instacart
    match: { merchants: [instacart] }
    amount: 10
    period: month
    enroll: true
    valid_to: 2027-12-31
    note: "Instacart credits, which need an active Instacart+ membership: activate Chase's complimentary one with the card."
# One a year after the account anniversary, valued at its point cap.
free_nights:
  - id: anniversary-night
    points: 50000
    note: 'Each year after the account anniversary; use it within 12 months. Points from the IHG account can top it up at a hotel above the cap.'
