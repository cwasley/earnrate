    url: https://creditcards.chase.com/rewards-credit-cards/sapphire/reserve
    quote: "You'll earn 1 point for each $1 spent on all other purchases"
  - rule: chase-travel
    url: https://creditcards.chase.com/rewards-credit-cards/sapphire/reserve
    quote: "You'll earn 8 points for each $1 spent on purchases made using your card through Chase Travel"
  - rule: chase-travel
    url: https://creditcards.chase.com/rewards-credit-cards/sapphire/reserve
    quote: 'on all purchases through Chase Travel, including The Edit'
  - rule: flights-hotels-direct
    url: https://creditcards.chase.com/rewards-credit-cards/sapphire/reserve
    quote: '4 points ("4X points") on flights and hotels booked direct'
  - rule: flights-hotels-direct
    url: https://www.chase.com/personal/credit-cards/rewards-category-faq
    quote: 'This category includes only airline tickets purchased directly with airlines, including charter and private flights'
  - rule: dining
    url: https://creditcards.chase.com/rewards-credit-cards/sapphire/reserve
    quote: '3 points ("3X points") on dining at restaurants purchases'
  - rule: dining
    url: https://creditcards.chase.com/rewards-credit-cards/sapphire/reserve
    quote: 'dining at restaurants including takeout and eligible delivery services'
  - rule: lyft
    url: https://creditcards.chase.com/rewards-credit-cards/sapphire/reserve
    quote: 'earn 5x total points on Lyft rides through 9/30/2027'
  - rule: peloton
