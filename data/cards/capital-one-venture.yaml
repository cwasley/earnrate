    url: https://www.capitalone.com/credit-cards/venture/
    quote: 'Earn 5X miles on hotels, vacation rentals and rental cars booked through Capital One Travel.'
  - rule: capital-one-entertainment
    url: https://www.capitalone.com/credit-cards/venture/
    quote: 'Eligible cardholders will earn 5 miles per dollar spent on Capital One Entertainment purchases.'
  - rule: annual_fee
    url: https://www.capitalone.com/credit-cards/venture/
    quote: 'ANNUAL FEE $95 PURCHASE RATE'
  - rule: welcome_offer
    url: https://www.capitalone.com/credit-cards/venture/
    quote: 'plus earn 75,000 bonus miles once you spend $4,000 on purchases within the first 3 months'
