id: amex-delta-skymiles-gold
name: Delta SkyMiles Gold American Express Card
issuer: amex
network: amex
currency: delta-skymiles
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/delta-skymiles-gold-american-express-card/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/delta-skymiles-gold-american-express-card/25330-10-0#offer-terms
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
base_rate: 1
annual_fee: 150
first_year_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 80000
  spend: 3000
  months: 6
  valid_to: 2026-11-04
  varies: true
  not_with: [amex-delta-skymiles-platinum, amex-delta-skymiles-reserve]
  note: 'The public offer is "as high as" 80,000 bonus miles plus a $250 statement credit, both after the same $3,000 in purchases; Amex shows the exact miles (which may be lower, or no offer) after you apply and before you accept. Amex: "You may not be eligible to receive a welcome offer if you have or have had this Card, the Delta SkyMiles® Platinum American Express Card, the Delta SkyMiles® Reserve American Express Card or previous versions of these Cards." Amex may also decline based on your card history.'
rules:
  - id: restaurants
    match: { categories: [dining] }
    exclude: { merchants: [dodger-stadium, bellagio], mccs: [5813] }
    rate: 2
    note: Worldwide, including takeout; third-party delivery counts only in the U.S. Not at restaurants inside hotels, casinos or event venues, or at bars, nightclubs, cafeterias and convenience stores.
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 2
    geography: us_only
    note: Superstores, convenience stores, warehouse clubs and meal-kit delivery services are not supermarkets.
  - id: delta
    match: { merchants: [delta, delta-vacations, delta-stays] }
    rate: 2
    note: Charged directly with Delta as merchant of record (delta.com, the Fly Delta app, phone, ticket counters), including Basic Economy fares, upgrades, seats, Sky Club membership, Delta-operated in-flight food and drinks, Delta Vacations packages and new Delta Stays bookings. Not Delta gift cards, deltashop.com, the Delta Flight Museum or in-flight Wi-Fi.
milestones:
  - id: flight-credit-10k
    spend: 10000
    period: calendar_year
    rewards:
      - $200 Delta Flight Credit
    note: A Delta eCredit for Delta flights bought on delta.com or with Delta Reservations (also the airfare part of a Delta Vacations package), not bag fees, upgrades or other fees. It expires one year after it's issued. Additional Card Members' purchases count; gift cards, prepaid cards and cash equivalents don't.
