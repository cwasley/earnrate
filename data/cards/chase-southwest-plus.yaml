id: chase-southwest-plus
name: Southwest Rapid Rewards Plus Credit Card
short_name: Southwest Plus
issuer: chase
network: visa
currency: southwest-rapid-rewards
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/southwest/plus
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC64433.html
base_rate: 1
annual_fee: 99
foreign_transaction_fee: 0
welcome_offer:
  points: 80000
  spend: 1000
  months: 3
  not_with: [chase-southwest-priority, chase-southwest-premier]
  note: 'Chase labels it a limited-time offer and states no end date. Not available to current cardmembers of any Southwest Rapid Rewards Credit Card, or previous cardmembers of any Southwest Rapid Rewards Credit Card who received a new Cardmember bonus within the last 24 months (this does not apply to business cards).'
caps:
  - id: gas-and-grocery
    amount: 5000
    period: cardmember_year
    then_rate: 1
rules:
  - id: southwest
    match: { merchants: [southwest] }
    rate: 2
    note: Purchases made directly with Southwest, including flights, inflight, Southwest gift cards and Getaways by Southwest packages. Southwest Cruises, Southwest Charters and Southwest Cargo are excluded.
  - id: gas
    match: { categories: [gas] }
    rate: 2
    cap: gas-and-grocery
    note: Shares a $5,000 per account anniversary year cap with grocery stores. Not truck stops, marinas, oil and propane distributors or home heating companies.
  - id: grocery
    match: { categories: [grocery] }
    exclude: { merchants: [walmart, target] }
    rate: 2
    cap: gas-and-grocery
    note: Shares a $5,000 per account anniversary year cap with gas stations. Chase's grocery category excludes warehouse clubs, discount stores such as Walmart and Target, and gas at grocery stores. Delivery services count only if they code as a grocery store.
  - id: lyft
    match: { merchants: [lyft] }
    rate: 2
    valid_to: 2027-12-31
    note: Limited-time offer on rides, bikes, scooters, Lyft memberships and Lyft Cash bought in the Lyft app. Gift cards, Lyft car rentals, vehicle service centers and miscellaneous fees are excluded.
