    url: https://www.capitalone.com/credit-cards/quicksilver/
    quote: 'You won’t pay transaction fees when making purchases outside of the United States.'
  - rule: welcome_offer
    url: https://www.capitalone.com/credit-cards/quicksilver/
    quote: 'Earn a one-time $200 cash bonus once you spend $500 on purchases within 3 months'
  - rule: welcome_offer
    url: https://disclosures.capitalone.com/disclosure.42159.en-US.html
    quote: 'You will earn a $200 bonus if you spend at least $500 within 3 months'
