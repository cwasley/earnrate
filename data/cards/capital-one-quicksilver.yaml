id: capital-one-quicksilver
name: Capital One Quicksilver Cash Rewards Credit Card
short_name: Capital One Quicksilver
color: '#b8bcc2'
issuer: capital-one
# The card page never names the network in visible text; its embedded
# product data says MasterCard.
network: mastercard
currency: cash
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://www.capitalone.com/credit-cards/quicksilver/
  # The card page's "Important disclosures" (pricing and rewards FAQ, also
  # where "Rewards terms" leads); the number is the page's offer id and
  # changes when Capital One changes it.
  - https://disclosures.capitalone.com/disclosure.42159.en-US.html
base_rate: 1.5
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  dollars: 200
  spend: 500
  months: 3
  note: One-time cash bonus, available by applying through the card page. Existing or previous cardmembers are not eligible if they received a new cardmember bonus for this product in the past 48 months.
rules:
  - id: capital-one-travel-hotels-vacation-rentals-car-rentals
    match:
      {
        merchants:
          [
            capital-one-travel-hotels,
            capital-one-travel-vacation-rentals,
            capital-one-travel-car-rentals,
          ],
      }
    rate: 5
    note: Only when booked through Capital One Travel. Flights booked there, and hotel incidentals or upgrades paid outside Capital One Travel, earn the base 1.5%.
  - id: capital-one-entertainment
    match: { merchants: [capital-one-entertainment] }
    rate: 5
    note: Tickets bought on the Capital One Entertainment ticketing platform only. Cardholder-exclusive pre-sales and tickets bought directly from Capital One Hall or Capital One Arena are excluded.
todo:
  - Network isn't shown in the card page's visible text. Set to mastercard from the page's embedded product data (cardNetwork MasterCard); confirm against a current card or the Rates & Fees disclosure.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
evidence:
