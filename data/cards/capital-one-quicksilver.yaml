    url: https://www.capitalone.com/credit-cards/quicksilver/
    quote: 'Earn unlimited 1.5% cash back on every purchase, every day.'
  - rule: base_rate
    url: https://disclosures.capitalone.com/disclosure.42159.en-US.html
    quote: 'and 1.5% cash back on all other purchases'
  - rule: capital-one-travel-hotels-vacation-rentals-car-rentals
    url: https://www.capitalone.com/credit-cards/quicksilver/
    quote: 'Earn unlimited 5% cash back on hotels, vacation rentals and rental car bookings.'
  - rule: capital-one-travel-hotels-vacation-rentals-car-rentals
    url: https://disclosures.capitalone.com/disclosure.42159.en-US.html
    quote: 'You will earn 5% cash back on hotels, vacation rentals and rental cars booked through Capital One Travel'
  - rule: capital-one-travel-hotels-vacation-rentals-car-rentals
    url: https://disclosures.capitalone.com/disclosure.42159.en-US.html
    quote: 'will not earn the enhanced earn rate, but will receive the standard 1.5% cash back earn rate'
  - rule: capital-one-entertainment
    url: https://www.capitalone.com/credit-cards/quicksilver/
    quote: 'Eligible Quicksilver cardholders will earn 5% cash back on Capital One Entertainment purchases.'
  - rule: capital-one-entertainment
    url: https://disclosures.capitalone.com/disclosure.42159.en-US.html
    quote: 'Tickets purchased through the Capital One cardholder exclusive pre-sales'
  - rule: annual_fee
    url: https://www.capitalone.com/credit-cards/quicksilver/
    quote: 'Earn unlimited cash back with no annual, hidden or foreign transaction fees.'
  - rule: annual_fee
    url: https://disclosures.capitalone.com/disclosure.42159.en-US.html
    quote: 'Annual Fee None.'
