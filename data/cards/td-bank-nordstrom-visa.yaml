id: td-bank-nordstrom-visa
name: Nordstrom Visa Credit Card
issuer: td-bank
network: visa
currency: nordy-club
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://www.nordstrom.com/browse/nordy-club
  - https://www.nordstrom.com/browse/nordy-club/faq
  - https://www.nordstrom.com/browse/nordy-club/terms-conditions
  - https://www.nordstrom.com/becomecardmember
# Nordstrom rates are the card's own share: every Nordy Club member earns 1
# point per dollar at Nordstrom however they pay.
base_rate: 1
annual_fee: 0
welcome_offer:
  dollars: 60
  spend: 0
  months: 1
  valid_to: 2026-12-01
  note: A $60 Nordstrom Note, not a statement credit, for applying and getting approved for a new Nordstrom credit card between October 12 and December 1, 2026 (the terms say 9pm PT October 11 to 9pm PT December 1). No purchase is required; the Note posts to the Nordy Club account 7-10 business days after approval, so months is only a placeholder. Current and previous Nordstrom credit cardmembers and Nordstrom employees are not eligible.
rules:
  - id: nordstrom
    match: { merchants: [nordstrom] }
    rate: 1
    note: Card's own share only. Cardmembers start at Influencer status and earn 2 points per dollar at Nordstrom and Nordstrom.com, 1 of which any member earns paying any way. Paid through Apple Pay, Google Pay or PayPal it's 1 point per dollar, so nothing extra.
  - id: nordstrom-ambassador
    match: { merchants: [nordstrom] }
    rate: 2
    requires: { membership: nordy-club-ambassador }
    note: Ambassador and Icon status earn 3 points per dollar with the card, 2 more than any member. Ambassador takes $5,000 a calendar year of card and Nordstrom spending.
  - id: nordstrom-rack
    match: { merchants: [nordstrom-rack] }
    rate: 5
    note: No points at Nordstrom Rack. Instead an instant 5% discount in Rack stores and on NordstromRack.com, counted here as 5 points per dollar because a point is worth 1¢ in Notes. Not through Apple Pay, PayPal or Afterpay, and not on gift cards.
  - id: gas-ev
    match: { categories: [gas, ev_charging] }
    rate: 2
    note: Merchants coded as fuel service stations, automated fuel dispensers or EV charging.
  - id: grocery
    match: { categories: [grocery.supermarket, convenience_store] }
    rate: 2
    note: Supermarkets, grocers, convenience stores and specialty food markets, by merchant category code.
  - id: specialty-food
    match: { mccs: [5422, 5441, 5451, 5462, 5921] }
    rate: 2
    note: Liquor stores, meat lockers, candy and nut stores, dairy stores and bakeries count as grocery.
  - id: dining
    match: { categories: [dining] }
    rate: 2
    note: Includes fast food, bars, caterers and third-party delivery. Restaurants inside Nordstrom earn as Nordstrom purchases.
  - id: streaming
    match: { categories: [streaming, tv_internet] }
    rate: 2
    note: Cable, satellite and other TV, radio and streaming services billed by subscription.
todo:
  - No points at Last Chance clearance stores either.
  - Not modeled are bonus points events, Personal Double Points Days and alterations reimbursement Notes.
