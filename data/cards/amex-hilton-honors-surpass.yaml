id: amex-hilton-honors-surpass
name: Hilton Honors American Express Surpass Card
short_name: Hilton Honors Surpass
issuer: amex
network: amex
currency: hilton-honors
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/hilton-honors-surpass/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/hilton-honors-surpass-credit-card/25330-10-0#offer-terms
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
base_rate: 3
annual_fee: 150
foreign_transaction_fee: 0
welcome_offer:
  points: 130000
  spend: 3000
  months: 6
  valid_to: 2027-01-13
  note: 'Plus one Free Night Reward (a standard room, expiring 12 months after it is issued), which earnrate does not value. Amex: "You may not be eligible to receive a welcome offer if you have or have had this Card, the Hilton Honors Amex Ascend Card or previous versions of these Cards," and may also decline based on your history with balance transfers, as a Card Member, and the number of cards you have opened and closed. Offers may vary between advertisements.'
rules:
  - id: hilton-purchases
    match: { merchants: [hilton] }
    rate: 12
    note: Charged directly with a hotel or resort in the Hilton portfolio. Bookings count only through a Hilton-operated reservation channel, not online travel sites; incidentals (hotel restaurants, spas) count when charged to the room and paid with the card at checkout.
  - id: us-restaurants
    match: { categories: [dining] }
    exclude: { merchants: [dodger-stadium, bellagio], mccs: [5813] }
    rate: 6
    geography: us_only
    note: U.S. restaurants, including takeout and delivery. Not restaurants abroad (even U.S.-owned chains), nightclubs or bars, and possibly not restaurants inside hotels, casinos or event venues.
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 6
    geography: us_only
    note: Not superstores or warehouse clubs.
  - id: us-gas
    match: { categories: [gas] }
    exclude: { categories: [gas.grocery_store, gas.superstore] }
    rate: 6
    geography: us_only
    note: U.S. gas stations; not gas at superstores or warehouse clubs.
  - id: us-online-retail
    match:
      categories:
        [
          online_retail,
          superstore,
          drugstore,
          department_store,
          clothing,
          electronics,
          sporting_goods,
          home_improvement,
          furniture,
        ]
    rate: 4
    channel: online
    geography: us_only
    note: U.S. merchants selling physical goods, paid on their own website or app. Not restaurants, supermarkets, gas, car dealers, travel, entertainment or services. Online marketplaces with multiple retailers and third-party payment accounts don't count, nor do orders paid in store, in-store mobile wallet, phone or mail orders, or buy-now-pay-later. Amex's rewards-info page names Amazon.com and Walmart.com as online retailers, but these terms also exclude online marketplaces with multiple retailers, so Amazon Marketplace sellers may not earn 4x.
