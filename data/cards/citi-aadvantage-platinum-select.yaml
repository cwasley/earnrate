id: citi-aadvantage-platinum-select
name: Citi / AAdvantage Platinum Select World Elite Mastercard
issuer: citi
network: mastercard
currency: aadvantage-miles
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://www.citi.com/credit-cards/citi-aadvantage-platinum-elite-credit-card
base_rate: 1
annual_fee: 99
first_year_fee: 0
welcome_offer:
  points: 80000
  spend: 3500
  months: 4
  note: 'Citi labels it a limited time offer but states no end date. Not available if you received a new account bonus for a Citi / AAdvantage Platinum Select account in the past 48 months, or converted another Citi card on which you earned a new account bonus in the last 48 months into one.'
rules:
  - id: american-airlines
    match: { merchants: [american-airlines] }
    rate: 2
    note: Items billed by American Airlines as the merchant of record, including Admirals Club food and drink. Car rentals booked on aadvantagecars.com and hotels booked on aadvantagehotels.com don't count.
  - id: restaurants
    match: { categories: [dining] }
    rate: 2
    note: Includes cafes, bars, lounges, fast food and takeout. Not restaurants inside supercenters, warehouse clubs, discount or department stores, bowling alleys, golf courses, country clubs, convenience stores or movie theaters, nor caterers or meal kit delivery.
  - id: gas-stations
    match: { categories: [gas] }
    exclude: { categories: [gas.superstore] }
    rate: 2
    note: Warehouse-club gas counts only when the club codes it as a gas station, so superstore and warehouse-club gas is excluded here to stay conservative. Discount, department and convenience stores don't count.
# Not modeled: free first checked bag, preferred boarding, companion certificate. Loyalty Points toward status aren't card earnings.
