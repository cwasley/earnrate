id: chase-ink-business-preferred
name: Ink Business Preferred
issuer: chase
network: visa
currency: UR
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://creditcards.chase.com/business-credit-cards/ink/business-preferred
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
base_rate: 1
business: true
annual_fee: 95
welcome_offer:
  points: 100000
  spend: 8000
  months: 3
  note: 'Chase: "The new cardmember bonus may not be available to you if you have ever had this card." Chase may also consider factors about your business.'
caps:
  - id: three-x-combined
    amount: 150000
    period: cardmember_year
    then_rate: 1
rules:
  - id: shipping
    match: { categories: [shipping] }
    rate: 3
    cap: three-x-combined
    note: Couriers, postal and freight shipping, mailbox stores. Not shipping charges on something you buy, or office supply stores that also mail packages.
  - id: social-search-advertising
    match: { categories: [online_advertising] }
    rate: 3
    cap: three-x-combined
    note: Bought directly from a social media site or search engine, not through an ad agency. Non-ad purchases from those sites don't count.
  - id: internet-cable-phone
    match: { categories: [tv_internet, phone] }
    rate: 3
    cap: three-x-combined
    note: Internet, cable, satellite TV and radio, cellular, wireless data and landline service. Not equipment.
  - id: travel
    match: { categories: [travel] }
    rate: 3
    cap: three-x-combined
  - id: transit-as-travel
    match: { categories: [transit] }
    rate: 3
    cap: three-x-combined
    note: Chase's travel category includes passenger trains, buses, taxis, ferries, tolls and parking. Rideshare codes as a taxi.
  - id: lyft
    match: { merchants: [lyft] }
    rate: 5
    valid_to: 2027-09-30
    note: Limited-time offer, for Lyft products bought in the Lyft app. Chase describes it as 2 extra points on top of the 3x travel rate, so Lyft spend likely counts toward the $150,000 cap.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
