id: bank-of-america-customized-cash-rewards
name: Bank of America Customized Cash Rewards Credit Card
issuer: bank-of-america
# Bank of America's terms carry only the Visa and Visa Signature trademark
# notice, so the network is Visa.
network: visa
currency: cash
last_verified: 2026-10-28
verified_by: collin
source_urls:
  - https://www.bankofamerica.com/credit-cards/products/cash-back-credit-card/
  - https://www.bankofamerica.com/credit-cards/products/cash-back-credit-card/cash-back-category-choices/
  - https://www.bankofamerica.com/credit-cards/terms-and-conditions/?campaignid=4079537&productoffercode=8H&locale=en_US
  - https://www.bankofamerica.com/bofa-rewards/increasing-bofa-rewards-with-credit-cards/
base_rate: 1
annual_fee: 0
welcome_offer:
  dollars: 200
  spend: 1000
  months: 3
  note: Online offer; the window is 90 days from account opening, modeled as 3 months. The offer may not be available elsewhere after leaving the page.
caps:
  - id: three-and-two-percent-combined
    amount: 2500
    period: quarter
    then_rate: 1
choices:
  # Gas is the default until changed. It can be changed once per calendar
  # month and otherwise carries over.
  - id: three-percent
    pick: 1
    period: until_changed
    default: [gas-ev-charging]
    options:
      gas-ev-charging: [gas, ev_charging]
      # Bank of America also excludes doctors and hospitals, government
      # services and taxes, insurance, schools and other non-retail services,
      # which have no earnrate category.
      online-shopping:
        { channel: online, exclude: [utilities, shipping, fitness] }
      dining: [dining]
      travel: [travel, transit]
      drug-stores: [drugstore]
      home-improvement-furnishings: [home_improvement, furniture]
rules:
  - id: three-percent
    match: { choice: three-percent }
    rate: 3
    cap: three-and-two-percent-combined
    note: Gas and EV charging, online shopping, dining, travel, drug stores, or home improvement and furnishings, whichever you picked. Travel includes parking, transit, rideshare and tolls. Online shopping is any purchase paid on a website or app, as reported by the merchant; ordered online but paid in store, in-store mobile wallet and phone or mail orders don't count, and doctors, government, insurance, membership organizations, schools, some utilities and other non-retail services are excluded. The first $2,500 a calendar quarter across the 3% and 2% categories, then 1%.
  - id: two-percent
    match: { categories: [grocery.supermarket, warehouse_club] }
    rate: 2
    cap: three-and-two-percent-combined
    note: Grocery stores, supermarkets, wholesale clubs, and meat and seafood, candy, dairy and bakery stores. Superstores and smaller stores that also sell groceries, like drug stores, are excluded. Shares the $2,500 quarterly cap with the 3% category.
  # BofA Rewards members earn a tier bonus on all cash back: 10% for Member,
  # 25% Preferred Plus, 50% Preferred Honors, 75% Premier.
  - id: three-percent-bofa-rewards-member
    match: { choice: three-percent }
    rate: 3.3
    cap: three-and-two-percent-combined
    requires: { membership: bofa-rewards-member }
    note: 3% plus the 10% BofA Rewards Member bonus.
  - id: two-percent-bofa-rewards-member
    match: { categories: [grocery.supermarket, warehouse_club] }
    rate: 2.2
    cap: three-and-two-percent-combined
    requires: { membership: bofa-rewards-member }
    note: 2% plus the 10% BofA Rewards Member bonus.
  - id: everything-else-bofa-rewards-member
    match: { any: true }
    rate: 1.1
    requires: { membership: bofa-rewards-member }
    note: 1% plus the 10% BofA Rewards Member bonus.
  - id: three-percent-bofa-rewards-preferred-plus
    match: { choice: three-percent }
    rate: 3.75
    cap: three-and-two-percent-combined
    requires: { membership: bofa-rewards-preferred-plus }
    note: 3% plus the 25% BofA Rewards Preferred Plus bonus.
  - id: two-percent-bofa-rewards-preferred-plus
    match: { categories: [grocery.supermarket, warehouse_club] }
    rate: 2.5
    cap: three-and-two-percent-combined
    requires: { membership: bofa-rewards-preferred-plus }
    note: 2% plus the 25% BofA Rewards Preferred Plus bonus.
  - id: everything-else-bofa-rewards-preferred-plus
    match: { any: true }
    rate: 1.25
    requires: { membership: bofa-rewards-preferred-plus }
    note: 1% plus the 25% BofA Rewards Preferred Plus bonus.
  - id: three-percent-bofa-rewards-preferred-honors
    match: { choice: three-percent }
    rate: 4.5
    cap: three-and-two-percent-combined
    requires: { membership: bofa-rewards-preferred-honors }
    note: 3% plus the 50% BofA Rewards Preferred Honors bonus.
  - id: two-percent-bofa-rewards-preferred-honors
    match: { categories: [grocery.supermarket, warehouse_club] }
    rate: 3
    cap: three-and-two-percent-combined
    requires: { membership: bofa-rewards-preferred-honors }
    note: 2% plus the 50% BofA Rewards Preferred Honors bonus.
  - id: everything-else-bofa-rewards-preferred-honors
    match: { any: true }
    rate: 1.5
    requires: { membership: bofa-rewards-preferred-honors }
    note: 1% plus the 50% BofA Rewards Preferred Honors bonus.
  - id: three-percent-bofa-rewards-premier
    match: { choice: three-percent }
    rate: 5.25
    cap: three-and-two-percent-combined
    requires: { membership: bofa-rewards-premier }
    note: 3% plus the 75% BofA Rewards Premier bonus.
  - id: two-percent-bofa-rewards-premier
    match: { categories: [grocery.supermarket, warehouse_club] }
    rate: 3.5
    cap: three-and-two-percent-combined
    requires: { membership: bofa-rewards-premier }
    note: 2% plus the 75% BofA Rewards Premier bonus.
  - id: everything-else-bofa-rewards-premier
    match: { any: true }
    rate: 1.75
    requires: { membership: bofa-rewards-premier }
    note: 1% plus the 75% BofA Rewards Premier bonus.
