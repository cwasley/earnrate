todo:
  - Bank of America's first-year 3% counts Net Purchases that "post to your account within 365 days of the account open date". earnrate goes by the purchase date and counts the opening day as day 1, so a purchase on the last day or two may be ranked at 3% when it would still earn 6%, or at 6% when it posts too late.
  - 'The BofA Rewards rules use proposed membership ids: bofa-rewards-member, bofa-rewards-preferred-plus, bofa-rewards-preferred-honors and bofa-rewards-premier. Cardholders who joined Preferred Rewards before May 26, 2026 may have an "extended card benefit" that Bank of America doesn''t define.'
  - "Online shopping counts any online purchase earnrate can't place in an excluded category, including unknown merchants. Bank of America also excludes doctors, government, insurance, schools and other non-retail services, which earnrate can't tell apart."
