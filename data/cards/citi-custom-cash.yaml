id: citi-custom-cash
name: Citi Custom Cash Card
color: '#3a7d8c'
issuer: citi
network: mastercard
currency: cash
last_verified: 2026-11-07
verified_by: claude
applications_closed: 2026-05-28
# Existing cardmembers keep the card and its rewards. The card page no longer
# states any earning terms, so the rates and definitions come from the card's
# current ThankYou terms (Sept 2026).
source_urls:
  - https://www.citi.com/credit-cards/citi-custom-cash-credit-card
  - https://www.thankyou.com/ccterms
# Paid as ThankYou Points, which redeem at 1¢ for cash back on this card, so a
# point here is 1%.
base_rate: 1
foreign_transaction_fee: null
# Points can be combined into one ThankYou account, which then runs on that
# account's terms: pooled with a Strata card, they transfer like Strata points.
pools_into:
  currency: TYP
  when_wallet_has: [citi-strata-premier, citi-strata-elite]
choices:
  # Citi picks the category itself: whichever eligible category has the most
  # spend in the billing cycle. Tell earnrate the one you expect to be top.
  - id: top-category
    pick: 1
    period: month
    automatic: true
    options:
      restaurants: [dining]
      gas-stations: [gas]
      grocery-stores: [grocery.supermarket, convenience_store]
      select-travel: [travel.flights, travel.hotels, travel.cruise]
      select-transit: [transit, travel.car_rental, ev_charging]
      select-streaming:
        merchants:
          [
            amazon-prime-video,
            apple-music,
            directv-stream,
            disney-plus,
            espn,
            fandango-at-home,
            fubotv,
            max,
            hulu,
            mlb-tv,
            nba-league-pass,
            netflix,
            pandora,
            paramount-plus,
            siriusxm,
            sling-tv,
            spotify,
            starz,
            tidal,
            youtube-premium,
            youtube-tv,
          ]
      drugstores: [drugstore]
      home-improvement-stores: [home_improvement]
      fitness-clubs: [fitness]
      live-entertainment: [entertainment]
caps:
  # Only one category earns 5% each billing cycle, so both 5% rules share it.
  - id: top-category
    amount: 500
    period: month
    then_rate: 1
rules:
  # Restaurant exclusions only apply when restaurants are the top category:
  # Dodger Stadium tickets still count as live entertainment, and the
  # Bellagio's rooms as select travel.
  - id: top-category-restaurants
    match: { choice: top-category, categories: [dining] }
    exclude: { merchants: [doordash, uber-eats, dodger-stadium, bellagio] }
    rate: 5
    cap: top-category
    note: When restaurants are the top category. Includes cafes, bars, lounges and fast food. Excludes bakeries, caterers, restaurants inside another business (hotels, stores, stadiums, grocery stores, warehouse clubs) and third-party dining delivery services. The first $500 in the billing cycle, then 1%.
  - id: top-category
    match: { choice: top-category }
    # Gas at warehouse clubs and discount stores doesn't count as gas.
    exclude: { categories: [dining, gas.superstore] }
    rate: 5
    cap: top-category
    note: Citi applies 5% automatically to your highest-spend eligible category each billing cycle (its decision is final), on the first $500 spent, then 1%. Grocery includes supermarkets, meat/seafood and dairy stores, bakeries and convenience stores, but not superstores, warehouse clubs or candy stores; online grocery and grocery delivery count only if the merchant codes as a supermarket. Select travel is airlines, hotels, cruise lines and travel agencies, not timeshares or campgrounds. Select transit includes car rentals, rail, subways, taxis and car services, tolls, parking, buses and EV charging, not bike or scooter rentals. Streaming bundled with another product or billed by a third party doesn't count. Live entertainment excludes movie theaters, museums and tourist attractions.
  - id: citi-travel-hotels-cars-attractions
    match:
      {
        merchants:
          [
            citi-travel-hotels,
            citi-travel-car-rentals,
            citi-travel-attractions,
          ],
      }
    rate: 5
    note: 4 extra points per $1 on top of the 1% base, for hotels, car rentals and attractions booked with Citi Travel. Only the part paid with the card earns, and canceled bookings don't. Citi's terms don't say whether the extra 4 also stacks on the 5% when travel or transit is the top category.
todo:
  - 'Foreign transaction fee not on file: the card page is a "Not Available" stub since applications closed, and no readable Citi page states the fee.'
  - Network set to mastercard, but no current Citi page states it (the card page is now a "Not Available" stub). Check your card.
  - Travel agencies (MCC 4722) count toward select travel, but a choice option can only list categories or merchants, so they aren't in the option.
  - Citi Travel hotel bookings may also count toward select travel (Citi Travel is a travel agency). Possible 5% + 4% stacking is unconfirmed.
  - "Closed to new applicants since May 28, 2026, so there's no welcome offer. Its $0 annual fee appears only in the card page's embedded product data, not visible text, so it isn't recorded."
