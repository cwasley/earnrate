id: navy-federal-more-rewards-amex
name: Navy Federal More Rewards American Express Card
short_name: NFCU More Rewards Amex
color: '#1d3f73'
# Issued by Navy Federal on the American Express network; not an Amex card,
# so it earns Navy Federal points, not Membership Rewards.
issuer: navy-federal
network: amex
currency: navy-federal-rewards
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.navyfederal.org/loans-cards/credit-cards/more-rewards.html
  - https://www.navyfederal.org/loans-cards/credit-cards/faqs.html
  - https://www.navyfederal.org/membership/eligibility.html
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 20000
  spend: 2000
  months: 3
  valid_to: 2027-01-03
  note: The page says within 90 days of account opening (about 3 months). For accounts applied for from 07/01/2026 through 01/03/2027; one promotional offer per account opening.
requires_membership: navy-federal # eligibility-based, no yearly fee
rules:
  - id: restaurants-food-delivery
    match: { categories: [dining] }
    rate: 3
    note: Restaurants and food delivery, by the merchant's code. Restaurants inside another business (a hotel, casino, commissary, grocery store or event venue) may earn 1X.
  - id: supermarkets
    match: { categories: [grocery.supermarket] }
    rate: 3
    note: Supermarkets, by the merchant's code; superstores and warehouse clubs aren't supermarkets.
  - id: gas-transit
    match: { categories: [gas, transit] }
    exclude: { categories: [gas.grocery_store, gas.superstore] }
    rate: 3
    note: Gas stations, and transit including railway, ferries, taxis, limousines, bus lines, charters, tour buses, tolls, road and bridge fees, and parking. Gas at superstores, supermarkets and warehouse clubs may earn 1X.
