id: amex-business-gold
name: American Express Business Gold Card
issuer: amex
network: amex
currency: MR
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/business/business-credit-cards/american-express-business-gold-card-amex/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/business/prospect/businessgold-card/64573-9-0#offer-terms
base_rate: 1
business: true
annual_fee: 375
foreign_transaction_fee: 0
welcome_offer:
  points: 200000
  spend: 15000
  months: 3
  varies: true
  note: 'The public offer is "as high as" 200,000 points; Amex shows the exact amount (which may be lower, or no offer) after you apply and before you accept. Not available if you have or have had this Card or previous versions of it, and Amex may also decline based on your card history. One offer per Card Account.'
choices:
  # Amex picks these itself: the 2 of 6 categories with the most eligible
  # purchases each billing period. Tell earnrate the two you expect.
  - id: top-two
    pick: 2
    period: month
    options:
      us-advertising: [online_advertising]
      us-electronics-software-cloud: [electronics]
      us-restaurants: [dining]
      us-gas-stations: [gas]
      transit: [transit]
      us-wireless-phone: [phone]
caps:
  - id: top-two
    amount: 150000
    period: calendar_year
    then_rate: 1
rules:
  - id: top-two-us
    match:
      choice: top-two
      categories: [online_advertising, electronics, dining, gas, phone]
    exclude: { categories: [gas.grocery_store, gas.superstore] }
    rate: 4
    geography: us_only
    cap: top-two
    note: In the 2 of 6 categories with the most purchases each billing period, the first $150,000 a calendar year across both. U.S. online, TV and radio advertising; U.S. electronics stores and software and cloud providers; U.S. restaurants, including takeout and delivery; U.S. gas stations (not at superstores, supermarkets or warehouse clubs); and U.S. wireless phone service bought directly from the carrier (not Google Fi, resellers or authorized retailers).
  - id: top-two-transit
    match: { choice: top-two, categories: [transit] }
    rate: 4
    cap: top-two
    note: When transit is one of the top 2 categories. Trains, taxis, rideshare, ferries, tolls, parking, buses and subways. Shares the $150,000 yearly cap.
  - id: flights-prepaid-hotels-amex-travel
    match: { merchants: [amex-travel-flights, amex-travel-hotels] }
    rate: 3
    note: Scheduled flights booked online at AmexTravel.com or the Amex Travel app, and prepaid hotels booked through American Express Travel. Not non-prepaid hotels, or flights or flight+hotel packages booked by phone.
  - id: other-amex-travel
    match:
      {
        merchants:
          [amex-travel-car-rentals, amex-travel-cruises, airbnb-amex-travel],
      }
    rate: 2
    note: Prepaid car rentals, cruises and prepaid Airbnb stays booked through AmexTravel.com or the Amex Travel app.
# Not modeled: the $240 flexible business credit, the ChatGPT Business,
# Squarespace and Walmart+ credits, and the Venue Collection, which are
# statement credits rather than points.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
evidence:
