    url: https://www.americanexpress.com/en-us/credit-cards/apply/terms/business/prospect/businessgold-card/64573-9-0#offer-terms
    quote: 'will get at least one Membership Rewards® point for each dollar of eligible purchases'
  - rule: top-two-us
    url: https://www.americanexpress.com/us/credit-cards/business/business-credit-cards/american-express-business-gold-card-amex/
    quote: '4X points are earned on the first $150,000 in combined purchases each calendar year.'
  - rule: top-two-us
