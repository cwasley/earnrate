id: citi-aadvantage-executive
name: Citi / AAdvantage Executive World Legend Mastercard
short_name: AAdvantage Executive
color: '#1e1e22'
issuer: citi
network: mastercard
currency: aadvantage-miles
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.citi.com/credit-cards/citi-aadvantage-executive-world-legend-mastercard
base_rate: 1
annual_fee: 695
foreign_transaction_fee: 0
welcome_offer:
  points: 80000
  spend: 8000
  months: 3
  note: 'Not available if you received a new account bonus for a Citi / AAdvantage Executive account in the past 48 months, or converted another Citi card on which you earned a new account bonus in the last 48 months into one.'
rules:
  - id: aadvantage-hotels
    match: { merchants: [aadvantage-hotels] }
    rate: 12
    note: Hotels booked on aadvantagehotels.com. Only the part paid with the card earns. Not hotels booked through American Airlines Vacations or with "Reserve Now, Pay Later", nor incidentals or other charges at the hotel.
  - id: aadvantage-cars
    match: { merchants: [aadvantage-cars] }
    rate: 12
    note: Car rentals booked on aadvantagecars.com from a U.S., Canada or Mexico point of sale. Payless rentals and rentals booked through American Airlines Vacations don't count. Only the part paid with the card earns.
  - id: american-airlines
    match: { merchants: [american-airlines] }
    rate: 4
    note: Items billed by American Airlines as the merchant of record. Car rentals booked on aadvantagecars.com and hotels booked on aadvantagehotels.com don't count. Rises to 5x for the rest of the calendar year after $150,000 in total card spend that year.
# Not modeled: Admirals Club membership, the Lyft credit (after 3 rides a month), Loyalty Point bonuses.
todo:
  - 5x on American Airlines after $150,000 in calendar-year spend isn't modeled; the schema can't raise a rate after a spend threshold.
  - "The issuer's terms don't say whether purchases a credit pays for earn rewards. Its credits are modeled as earning the card's rate on the whole purchase, with the credit on top."
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: aa-vacations
    match: { merchants: [american-airlines-vacations] }
    amount: 250
    period: half_year
    note: 'American Airlines Vacations packages or experiences: up to $250 from January through June and $250 from July through December.'
  - id: avis-budget
    match: { merchants: [avis, budget] }
    amount: 120
    period: calendar_year
    note: 'Prepaid car rentals booked directly on avis.com or budget.com.'
  # Listed, never applied to a purchase: earnrate can't tell which
  # purchases they pay on.
  - id: inkind
    listed:
      name: inKind dining
      on: dining at restaurants in the inKind network, paid in the inKind app
    amount: 100
    period: half_year
    note: 'Add the card to the inKind app, then pay the check in the app with the card and the dining credit: $100 to use from January through June and $100 from July through December.'
  - id: inflight-admirals-club
    listed:
      name: inflight and Admirals Club
      on: inflight and eligible Admirals Club purchases
    amount: 100
    period: calendar_year
    note: 'Inflight purchases and eligible Admirals Club purchases paid with the card.'
