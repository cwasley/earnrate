id: barclays-wyndham-rewards-earner
name: Wyndham Rewards Earner Card
short_name: Wyndham Earner
issuer: barclays
network: visa # Visa Signature
currency: wyndham-rewards
last_verified: 2026-11-22
verified_by: claude
source_urls:
  - https://cards.barclaycardus.com/banking/cards/wyndham-rewards-earner-card/
  # The card page's "Terms and Conditions" link (rates, fees and Reward Rules).
  - https://www.barclaycardus.com/applycontent/TnCs.jsp?tc49156
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 45000
  spend: 2000
  months: 3
  repeat: { may: true }
  note: "Within 90 days of account opening. Timeshare down payments to Wyndham Vacation Resorts, Wyndham Resort Development, Shell Vacations and their affiliates don't count toward the spend. Meant for applicants who aren't and haven't been Wyndham Rewards Earner cardmembers."
rules:
  - id: hotels-by-wyndham
    match: { merchants: [wyndham] }
    rate: 5
    note: Spending on the folio at participating Hotels by Wyndham, Caesars Rewards hotels in the Trademark Collection by Wyndham, and the Club Wyndham, WorldMark, Margaritaville Vacation Club and Shell Vacations Club resorts in the Trademark Collection. Not Echo Suites, unfurnished suites at WaterWalk Extended Stay, or Hotels by Wyndham outside Wyndham Rewards.
  - id: dining
    match: { categories: [dining] }
    rate: 3
    note: Restaurants and fast food, by merchant category code. Paying with a mobile or digital wallet, a third-party payment account or a merchant's mobile card reader, or through an online marketplace, may not earn the bonus.
  - id: grocery
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club] }
    rate: 3
    note: Grocery stores by merchant category code, not Target or Walmart. Warehouse clubs, drugstores, discount stores and stores with only a few grocery items don't count. Paying with a mobile or digital wallet or a third-party payment account may not earn the bonus.
    named:
      not_earning: [target, walmart]
milestones:
  - id: anniversary-bonus
    spend: 15000
    period: cardmember_year
    points: 7500
    note: 7,500 bonus points after $15,000 in purchases each card anniversary year (timeshare down payments don't count). Barclays counts the year through the billing cycle after the anniversary month; allow 8-12 weeks after the anniversary for the points.
