todo:
  - "Gas and EV charging: the Reward Rules in the card's Terms and Conditions say 3 points per $1 on gas (automated fuel dispensers and service stations) and EV charging, but the card page lists 3 points only on Vacation Club, dining and grocery, and 1 point on everything else. Left at 1x until Collin decides which page to follow."
  - 'Not modeled: 3 points per $1 at Club Wyndham, WorldMark, Margaritaville Vacation Club and Shell Vacations Club resorts outside the Trademark Collection, on their maintenance fees and on timeshare loan payments to the Wyndham and Shell developers (earnrate has no merchants for them), and timeshare down payments earning nothing.'
  - 'The card page keeps an older offer in hidden markup (2 points on dining, grocery and gas); only the shown text is quoted.'
  - 'Perks that are not points per dollar: automatic Wyndham Rewards Gold status, 10% fewer points for free nights, a cardmember discount on the Wyndham Rewards rate and 15% off buying points.'
  - 'Barclays offers other Earner cards (Earner Plus, Earner Premier and Earner Business), not in earnrate yet.'
