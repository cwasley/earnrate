id: amex-blue-cash-everyday
name: American Express Blue Cash Everyday Card
issuer: amex
network: amex
currency: cash
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/blue-cash-everyday/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/blue-cash-everyday-credit-card/25330-10-0
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
base_rate: 1
annual_fee: 0
welcome_offer:
  dollars: 200
  spend: 2000
  months: 6
  varies: true
  not_with: [amex-blue-cash-preferred]
  note: 'Paid as Reward Dollars, redeemable for a statement credit or at Amazon.com checkout. The card page and offer terms say "as high as $200", with the exact amount shown before you accept; the card page has also shown "Earn $200". Not available if you have or have had this Card, the Cash Magnet Card, the Blue Cash Preferred Card (including the Morgan Stanley version) or previous versions of these Cards.'
rules:
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 3
    geography: us_only
    cap: { amount: 6000, period: calendar_year, then_rate: 1 }
    note: Superstores, convenience stores, warehouse clubs and meal-kit delivery services are not supermarkets.
  - id: us-online-retail
    match:
      categories:
        [
          online_retail,
          superstore,
          drugstore,
          department_store,
          clothing,
          electronics,
          sporting_goods,
          home_improvement,
          furniture,
        ]
    rate: 3
    channel: online
    geography: us_only
    cap: { amount: 6000, period: calendar_year, then_rate: 1 }
    note: U.S. merchants selling physical goods, paid on their website or app, such as Amazon.com, Walmart.com, Chewy.com, Wayfair.com and drugstore sites. Not restaurants, supermarkets, gas, car dealers, travel, entertainment or services, and not online grocery orders, food delivery, rideshare, streaming or wireless bills. Ordered online but paid in store, in-store mobile wallet, phone or mail orders, and buy-now-pay-later don't count.
  - id: us-gas
    match: { categories: [gas] }
    exclude: { categories: [gas.grocery_store, gas.superstore] }
    rate: 3
    geography: us_only
    cap: { amount: 6000, period: calendar_year, then_rate: 1 }
    note: Superstores, supermarkets and warehouse clubs that sell gas are not gas stations.
# Each 3% category has its own $6,000 calendar-year cap. Not modeled: the
# Disney streaming statement credit.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
