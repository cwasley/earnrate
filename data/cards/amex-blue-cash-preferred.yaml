id: amex-blue-cash-preferred
name: American Express Blue Cash Preferred Card
color: '#1d3f7a'
issuer: amex
network: amex
currency: cash
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/blue-cash-preferred/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/blue-cash-preferred-credit-card/25330-10-0#offer-terms
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
base_rate: 1
annual_fee: 95
first_year_fee: 0
foreign_transaction_fee: 2.7
welcome_offer:
  dollars: 300
  spend: 3000
  months: 6
  varies: true
  note: 'Paid as Reward Dollars, redeemable for a statement credit or at Amazon.com checkout. Up to $300: the offer terms say "as high as $300", with the exact amount shown after you apply and before you accept. The card page''s headline has shown both "Earn $300" and "As High As $300". Not available if you have or have had this Card, the Morgan Stanley Blue Cash Preferred or previous versions of these Cards.'
rules:
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 6
    geography: us_only
    cap: { amount: 6000, period: calendar_year, then_rate: 1 }
    note: Superstores, convenience stores, warehouse clubs and meal-kit delivery services are not supermarkets.
  - id: us-streaming
    match:
      {
        merchants:
          [
            amazon-music,
            amc-plus,
            apple-music,
            apple-tv,
            audible,
            britbox,
            directv-stream,
            discovery-plus,
            disney-plus,
            espn,
            fubotv,
            max,
            hulu,
            iheartradio,
            kindle-unlimited,
            luminary,
            mgm-plus,
            mlb-tv,
            nba-league-pass,
            netflix,
            pandora,
            paramount-plus,
            peacock,
            amazon-prime-video,
            sling-tv,
            siriusxm,
            spotify,
            starz,
            tidal,
            youtube-music,
            youtube-premium,
            youtube-tv,
          ],
      }
    rate: 6
    geography: us_only
    note: Only the services on Amex's Select U.S. Streaming list, like Netflix, Hulu, Disney+, Spotify and Audible. Subscriptions bundled with or billed by another company (cable, phone, a car maker) may not count.
  - id: transit
    match: { categories: [transit] }
    rate: 3
    note: Trains, taxis, rideshare, ferries, tolls, parking, buses and subways. Airfare, car rental, cruises and trams aren't transit.
  - id: us-gas
    match: { categories: [gas] }
    exclude: { categories: [gas.grocery_store, gas.superstore] }
    rate: 3
    geography: us_only
    note: Superstores, supermarkets and warehouse clubs that sell gas are not gas stations.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: disney-streaming
    match: { merchants: [disney-plus, hulu, espn] }
    amount: 10
    period: month
    enroll: true
    note: Subscriptions bought at DisneyPlus.com, Hulu.com or Stream.ESPN.com, bundles included; an annual plan gets one $10 credit, in the month it's bought. Not through an app store or a device, or with cable.
todo:
  - Amex's Select U.S. Streaming list also names AMC+, Britbox, iHeartRadio, Kindle Unlimited, Luminary and MGM+, which earnrate doesn't know as stores yet.
  - 'Amex''s rewards terms count eligible purchases as "purchases for goods and services minus returns and other credits", which may or may not take out benefit statement credits; it doesn''t say. The disney-streaming credit is modeled as earning the card''s rate on the whole purchase, with the credit on top.'
