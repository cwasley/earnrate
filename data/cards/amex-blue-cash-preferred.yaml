id: amex-blue-cash-preferred
name: American Express Blue Cash Preferred Card
issuer: amex
network: amex
currency: cash
last_verified: 2026-10-24
verified_by: collin
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/blue-cash-preferred/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/blue-cash-preferred-credit-card/25330-10-0#offer-terms
base_rate: 1
annual_fee: 95
first_year_fee: 0
welcome_offer:
  dollars: 300
  spend: 3000
  months: 6
  note: 'Paid as Reward Dollars, redeemable for a statement credit or at Amazon.com checkout. The card page says "Earn $300"; the offer terms say "as high as $300", with the exact amount shown before you accept. Not available if you have or have had this Card, the Morgan Stanley Blue Cash Preferred or previous versions of these Cards.'
rules:
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 6
    geography: us_only
    cap: { amount: 6000, period: calendar_year, then_rate: 1 }
    note: Superstores, convenience stores, warehouse clubs and meal-kit delivery services are not supermarkets.
  - id: us-streaming
    match: { categories: [streaming] }
    rate: 6
    geography: us_only
    note: Select providers only (list at americanexpress.com/rewards-info). Subscriptions bundled with or billed by another company (cable, phone, a car maker) may not count.
  - id: transit
    match: { categories: [transit] }
    rate: 3
    note: Trains, taxis, rideshare, ferries, tolls, parking, buses and subways. Airfare, car rental and cruises aren't transit.
  - id: us-gas
    match: { categories: [gas] }
    exclude: { categories: [gas.grocery_store, gas.superstore] }
    rate: 3
    geography: us_only
    note: Superstores, supermarkets and warehouse clubs that sell gas are not gas stations.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
