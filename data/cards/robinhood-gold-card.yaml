todo:
  - 'Robinhood''s rewards article says cardholders earn "up to 5x points on select purchases" through the Robinhood Credit Travel Portal, while the waitlist article says 5X on travel booked there. Which bookings earn 5X isn''t clear from either, so travel through the portal is modeled at 3x until the Rewards Program Rules (a PDF, cdn.robinhood.com/assets/robinhood/legal/Robinhood_Gold_Card_Rewards_Program_Rules.pdf) are read.'
  - 'The Rewards Program Rules are a PDF, so the source check reads only the card page, the rates and fees page and the support articles.'
  - 'Applications are by invitation from a waitlist, in a gradual rollout. Robinhood also says Gold membership is not required for eligible applicants through certain partner channels; earnrate counts the $50 annual Gold subscription for everyone.'
  - 'The foreign transaction fee depends on when the account opened: none before July 1, 2026, 3% on or after. Modeled at 3%, what a new cardholder pays.'
  - 'Points are worth 1¢ as cash back into a Robinhood brokerage account or as gift cards; statement credits, gas discounts and Amazon purchases with points are worth less.'
  - 'Mystery box rewards (4% to 15% back on purchases for a while) are chance prizes, not modeled.'
