id: amex-delta-skymiles-blue
name: Delta SkyMiles Blue American Express Card
short_name: Delta SkyMiles Blue
color: '#3d6fa8'
issuer: amex
network: amex
currency: delta-skymiles
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/delta-skymiles-blue-american-express-card/
  - https://www.americanexpress.com/us/credit-cards/card-application/apply/prospect/terms/delta-skymiles-blue-american-express-card/25330-10-0#offer-terms
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 10000
  spend: 1000
  months: 6
  not_with:
    [
      amex-delta-skymiles-gold,
      amex-delta-skymiles-platinum,
      amex-delta-skymiles-reserve,
    ]
  note: 'No end date given. Amex: "You may not be eligible to receive a welcome offer if you have or have had this Card, the Delta SkyMiles® Options Credit Card, the Delta SkyMiles® Gold American Express Card, the Delta SkyMiles® Platinum American Express Card, the Delta SkyMiles® Reserve American Express Card or previous versions of these Cards." Amex may also decline based on your card history.'
rules:
  - id: restaurants
    match: { categories: [dining] }
    exclude: { merchants: [dodger-stadium, bellagio], mccs: [5813] }
    rate: 2
    note: Worldwide, including takeout; third-party delivery counts only in the U.S. Not at restaurants inside hotels, casinos or event venues, or at bars, nightclubs, cafeterias and convenience stores.
  - id: delta
    match: { merchants: [delta, delta-vacations, delta-stays] }
    rate: 2
    note: Charged directly with Delta as merchant of record (delta.com, the Fly Delta app, phone, ticket counters), including Basic Economy fares, upgrades, seats, Sky Club membership, Delta-operated in-flight food and drinks, Delta Vacations packages and new Delta Stays bookings. Not Delta gift cards, deltashop.com, the Delta Flight Museum or in-flight Wi-Fi.
