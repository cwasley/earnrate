id: chase-prime-visa
name: Prime Visa
color: '#24384f'
issuer: chase
network: visa
currency: cash
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/cash-back-credit-cards/amazon-prime-rewards
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC59329.html
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  dollars: 200
  spend: 0
  months: 1
  note: 'Labeled a limited-time offer (up from $150), with no end date given. A $200 Amazon Gift Card loaded into your Amazon account on approval, not cash back; there''s no spend requirement, so spend 0 and months 1 stand in for "on approval". For Prime members; without Prime it''s $60. Chase: available "if you do not currently have an Amazon Visa or Prime Visa credit card", and the gift card "is only awarded to new cardmembers and at the time of card approval."'
rules:
  - id: amazon
    match: { merchants: [amazon] }
    rate: 5
    requires: { membership: amazon-prime }
    note: Includes Amazon Fresh orders and third-party sellers on Amazon.com. Not on Amazon Pay purchases at other sites, Amazon's international sites, or Amazon.com purchases made with Equal Pay financing.
  - id: amazon-fresh
    match: { merchants: [amazon-fresh] }
    rate: 5
    requires: { membership: amazon-prime }
    note: Amazon Fresh's physical stores closed or became Whole Foods in 2026, so this is mostly online orders.
  - id: whole-foods
    match: { merchants: [whole-foods] }
    rate: 5
    geography: us_only
    requires: { membership: amazon-prime }
    note: Online or in-store in the U.S., but not through Instacart or other third-party sites.
  - id: audible
    match: { merchants: [audible] }
    rate: 5
    requires: { membership: amazon-prime }
  - id: amazon-without-prime
    match: { merchants: [amazon, amazon-fresh, audible] }
    rate: 3
    note: Without an eligible Prime membership these earn 3% instead of 5%.
  - id: whole-foods-without-prime
    match: { merchants: [whole-foods] }
    rate: 3
    geography: us_only
    note: Without an eligible Prime membership, Whole Foods earns 3% instead of 5%, in the U.S. only.
  - id: chase-travel
    match: { merchants: [chase-travel] }
    rate: 5
    requires: { membership: amazon-prime }
    note: Not on bookings made directly with airlines, hotels, car rental companies or cruise lines.
  - id: chase-travel-without-prime
    match: { merchants: [chase-travel] }
    rate: 3
  - id: gas
    match: { categories: [gas] }
    rate: 2
  - id: restaurants
    match: { categories: [dining] }
    rate: 2
    note: Dine in or takeout.
  - id: local-transit
    match: { categories: [transit] }
    rate: 2
    note: Local transit and commuting, including rideshare, tolls and parking. Not bike or scooter rentals or car sharing.
todo:
  - 6% on Amazon.com orders with "select delivery methods" (stated on amazon.com/dp/BT00LN946S, not on Chase's page) isn't modeled. It depends on the shipping option picked at checkout.
  - Prime Card Bonus (10%+ on rotating Amazon items) isn't modeled. It's per item and limited-time.
  - "Amazon's benefits page (amazon.com/primevisa/benefits, read 2026-11-01; it blocks automated reading) also gives 5% (3% without Prime) at Shopbop, Amazon Pharmacy, One Medical, PillPack, and Twitch and Woot through Amazon Pay. Those aren't modeled; Zappos, Ring, Blink, eero, AbeBooks and Buy with Prime are excluded."
