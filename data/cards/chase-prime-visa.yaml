id: chase-prime-visa
name: Prime Visa
issuer: chase
network: visa
currency: cash
last_verified: 2026-10-24
verified_by: collin
source_urls:
  - https://creditcards.chase.com/cash-back-credit-cards/amazon-prime-rewards
base_rate: 1
annual_fee: 0
welcome_offer:
  dollars: 150
  spend: 0
  months: 1
  note: 'A $150 Amazon Gift Card loaded into your Amazon account on approval, not cash back; there''s no spend requirement, so spend 0 and months 1 stand in for "on approval". For Prime members. Chase: available "if you do not currently have an Amazon Visa or Prime Visa credit card", and the gift card "is only awarded to new cardmembers and at the time of card approval."'
rules:
  - id: amazon
    match: { merchants: [amazon] }
    rate: 5
    requires: { membership: amazon-prime }
    note: Includes Amazon Fresh orders and third-party sellers on Amazon.com. Not on Amazon Pay purchases at other sites, or on Amazon's international sites.
  - id: amazon-fresh
    match: { merchants: [amazon-fresh] }
    rate: 5
    requires: { membership: amazon-prime }
    note: Amazon Fresh's physical stores closed or became Whole Foods in 2026, so this is mostly online orders.
  - id: whole-foods
    match: { merchants: [whole-foods] }
    rate: 5
    requires: { membership: amazon-prime }
    note: Online or in-store.
  - id: audible
    match: { merchants: [audible] }
    rate: 5
    requires: { membership: amazon-prime }
  - id: amazon-without-prime
    match: { merchants: [amazon, amazon-fresh, whole-foods, audible] }
    rate: 3
    note: Without an eligible Prime membership these earn 3% instead of 5%.
  - id: chase-travel
    match: { merchants: [chase-travel] }
    rate: 5
    requires: { membership: amazon-prime }
    note: Not on bookings made directly with airlines, hotels, car rental companies or cruise lines.
  - id: chase-travel-without-prime
    match: { merchants: [chase-travel] }
    rate: 3
  - id: gas
    match: { categories: [gas] }
    rate: 2
  - id: restaurants
    match: { categories: [dining] }
    rate: 2
    note: Dine in or takeout.
  - id: local-transit
    match: { categories: [transit] }
    rate: 2
    note: Local transit and commuting, including rideshare.
todo:
  - 6% on Amazon.com orders with "select delivery methods" (stated on amazon.com/dp/BT00LN946S, not on Chase's page) isn't modeled. It depends on the shipping option picked at checkout.
  - Prime Card Bonus (10%+ on rotating Amazon items) isn't modeled. It's per item and limited-time.
