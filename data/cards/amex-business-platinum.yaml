id: amex-business-platinum
name: The Business Platinum Card from American Express
short_name: Amex Business Platinum
color: '#b9bcc0'
issuer: amex
network: amex
currency: MR
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/business/business-credit-cards/american-express-business-platinum-credit-card-amex/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/business/prospect/business-platinum-charge-card/64281-9-0#offer-terms
base_rate: 1
business: true
annual_fee: 895
foreign_transaction_fee: 0
welcome_offer:
  points: 300000
  spend: 20000
  months: 3
  varies: true
  note: 'The public offer is "as high as" 300,000 points; Amex shows the exact amount (which may be lower, or no offer) after you apply and before you accept. Not available if you have or have had this Card or previous versions of it, and Amex may also decline based on your card history.'
caps:
  - id: key-business-categories
    amount: 2000000
    period: calendar_year
    then_rate: 1
rules:
  - id: flights-prepaid-hotels-amex-travel
    match:
      {
        merchants:
          [amex-travel-flights, amex-travel-hotels, airbnb-amex-travel],
      }
    rate: 5
    note: Scheduled flights booked through AmexTravel.com or the Amex Travel app (not by phone), prepaid hotels booked through American Express Travel, and prepaid Airbnb stays booked through AmexTravel.com. Not charter or private flights, or flights in tours, cruises or packages.
  - id: other-amex-travel
    match: { merchants: [amex-travel-car-rentals, amex-travel-cruises] }
    rate: 2
    note: Prepaid car rentals and cruises booked through AmexTravel.com or the Amex Travel app.
  - id: us-hardware-suppliers
    match: { categories: [home_improvement] }
    rate: 2
    geography: us_only
    cap: key-business-categories
    note: U.S. construction material and hardware suppliers. The first $2 million a calendar year across the 2X categories, then 1X.
  - id: us-electronics-software-cloud
    match: { categories: [electronics] }
    rate: 2
    geography: us_only
    cap: key-business-categories
    note: U.S. electronic goods retailers and software and cloud system providers. Shares the $2 million yearly cap.
  - id: us-shipping
    match: { categories: [shipping] }
    rate: 2
    geography: us_only
    cap: key-business-categories
    note: U.S. shipping providers. Shares the $2 million yearly cap.
  - id: large-purchases
    match: { any: true }
    rate: 2
    min_amount: 5000
    cap: key-business-categories
    note: A single eligible purchase of $5,000 or more, anywhere. It doesn't count if the merchant splits a purchase into charges under $5,000. A large purchase in a 2X category earns 2X once, and 5X travel wins over it. Shares the $2 million yearly cap.
# Not modeled: the Airbnb Experiences credit (after an Airbnb Luxe booking),
# Adobe and the extra Dell credit (after a spending total), the 35% Pay with
# Points airline bonus and lounge access.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: hilton
    match: { merchants: [hilton] }
    amount: 50
    period: quarter
    enroll: true
    note: 'Bookings and incidental charges directly with a property in the Hilton portfolio. Enrolling signs you up for Hilton for Business, which needs a Hilton Honors account.'
  - id: clear-plus
    match: { merchants: [clear] }
    amount: 219
    period: calendar_year
    note: 'An annual CLEAR+ membership.'
  - id: chatgpt-business
    match: { merchants: [chatgpt] }
    amount: 300
    period: calendar_year
    enroll: true
    note: 'ChatGPT Business bought directly from OpenAI in the U.S.'
  - id: wireless
    match: { categories: [phone] }
    amount: 10
    period: month
    enroll: true
    note: 'Monthly wireless phone service bought directly from a U.S. provider, not hardware. From February 17, 2027, only Verizon, AT&T, T-Mobile, Frontier, Comcast, Charter, Spectrum Mobile, UScellular, Optimum, Ultra Mobile and Mint Mobile.'
  - id: indeed
    match: { merchants: [indeed] }
    amount: 90
    period: quarter
    enroll: true
    note: 'Bought directly on Indeed.com in the U.S.'
  - id: dell
    match: { merchants: [dell] }
    amount: 150
    period: calendar_year
    enroll: true
    note: "Bought directly from Dell Technologies in the U.S. The extra $1,000 after $5,000 of Dell purchases in a year isn't modeled."
  # Listed, never applied to a purchase: earnrate can't tell which
  # purchases they pay on.
  - id: airline-fee
    listed:
      name: airline fee
      on: incidental fees charged by the one airline you select
    amount: 200
    period: calendar_year
    enroll: true
    note: 'Enrolling is selecting one airline: Alaska, American, Delta, JetBlue, Southwest or United, the same one as for the 35% Airline Bonus. You can change it once a year, in January. Incidental fees charged by that airline separately from the ticket. Not tickets, upgrades, miles, gift cards, duty free, award tickets or fees from partner airlines.'
  - id: hotel
    listed:
      name: hotel
      on: prepaid Fine Hotels + Resorts, The Hotel Collection and Airbnb Luxe bookings through Amex Travel
    amount: 300
    period: half_year
    note: 'New prepaid ("Pay Now") bookings through AmexTravel.com, the Amex Travel app or by phone; Airbnb Luxe only online or in the app, with your Airbnb account linked to Amex. The Hotel Collection and Airbnb Luxe need a stay of two nights or more, and Fine Hotels + Resorts does too from January 1, 2027. Not property fees or charges by the property.'
