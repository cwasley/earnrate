id: pnc-cash-rewards-visa
name: PNC Cash Rewards Visa Credit Card
short_name: PNC Cash Rewards
issuer: pnc
network: visa
currency: cash
last_verified: 2026-11-22
verified_by: claude
source_urls:
  - https://www.pnc.com/en/personal-banking/banking/credit-cards/pnc-cash-rewards-visa-credit-card.html
base_rate: 1
annual_fee: 0
foreign_transaction_fee: null
welcome_offer:
  dollars: 250
  spend: 1000
  months: 3
  repeat: { after_months: 24, from: bonus }
  note: Within the first 3 months after account opening. One new account opening bonus per customer per product in any 24 months.
caps:
  - id: bonus-combined
    amount: 8000
    period: cardmember_year
    then_rate: 1
rules:
  - id: gas
    match: { categories: [gas] }
    exclude: { categories: [gas.superstore, gas.grocery_store] }
    rate: 4
    cap: bonus-combined
    note: Merchants coded as gas stations, in the store or at the pump. Fuel at superstores, supermarkets, warehouse clubs and truck stops earns 1%. Shares an $8,000 cap a year (from the account's anniversary) with dining and grocery stores.
  - id: dining
    match: { categories: [dining] }
    rate: 3
    cap: bonus-combined
    note: Full-service restaurants, cafes, cafeterias and fast food, by merchant category code. Shares the $8,000 yearly cap with gas and grocery stores.
  - id: grocery
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club] }
    rate: 2
    cap: bonus-combined
    note: Merchants coded as grocery stores. Groceries at superstores, drugstores, warehouse clubs and convenience stores earn 1%. Shares the $8,000 yearly cap with gas and dining.
