# Not modeled on purpose: the Venue Collection benefit (10% back on food and
# drink at select stadiums and arenas, with enrollment) is a statement credit
# with a yearly limit, not cash back on every purchase there. Nor the intro APR.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
