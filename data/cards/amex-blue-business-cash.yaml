base_rate: 1
business: true
annual_fee: 0
foreign_transaction_fee: 2.7
welcome_offer:
  dollars: 500
  spend: 5000
  months: 3
  varies: true
  repeat: { may: true }
  note: 'The public offer is "as high as" a $500 statement credit; Amex shows the exact amount after you apply and before you accept. May not be available if you have or have had this Card or previous versions of it, and Amex may also decline based on your card history. One offer per Card Account.'
rules:
  - id: everyday-purchases
    match: { any: true }
    rate: 2
    cap: { amount: 50000, period: calendar_year, then_rate: 1 }
