id: bilt-palladium
name: Bilt Palladium Card
color: '#8a8d91'
# Issued by Column N.A. and serviced by Cardless; Bilt runs the rewards.
# Full earning terms are in the Bilt Card Offer Terms PDF, which the source
# checker can't read, so they're not in source_urls.
issuer: column
network: mastercard # World Legend Mastercard, per the card page's FAQ
currency: BILT
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.bilt.com/card/palladium
  - https://www.bilt.com/card
base_rate: 2
annual_fee: 495
foreign_transaction_fee: 0
welcome_offer:
  points: 50000
  spend: 4000
  months: 3
  note: 'Within 90 days of account opening, on purchases other than rent or mortgage. Also Bilt Gold status and $300 in Bilt Cash on approval, which earnrate does not value. For new Bilt Card 2.0 cardholders.'
rules:
  - id: bilt-travel-hotels
    match: { merchants: [bilt-travel-hotels] }
    rate: 4
    note: 2X card earn plus 2 Bilt Travel Portal bonus points on hotels booked at biltrewards.com/travel.
  - id: bilt-travel-flights
    match: { merchants: [bilt-travel-flights] }
    rate: 3
    note: 2X card earn plus 1 Bilt Travel Portal bonus point on flights booked at biltrewards.com/travel.
  - id: lyft
    match: { merchants: [lyft] }
    rate: 4
    requires: { activation: true }
    note: 2X card earn plus 2X Bilt bonus on eligible rides after linking Bilt and Lyft accounts in the Bilt app. Uncapped.
# Not modeled on purpose: $200 annual Bilt Cash and Priority Pass.
todo:
  - Rent and mortgage paid through Bilt earn 0.5X-1.25X depending on the cycle's everyday spend as a share of the housing payment (25%/50%/75%/100% give 0.5X/0.75X/1X/1.25X; below 25% a flat 250 points). earnrate has no spend-ratio rule, so answers for rent and mortgage give only the category's note, which states it.
  - Bilt Neighborhood Dining restaurants add a per-restaurant bonus (usually +2-3X, up to 5X total). It varies by restaurant, so it isn't modeled.
  - Point Accelerator (spend $200 Bilt Cash for +1X on the next $5,000, up to five times a year) isn't modeled.
  - "The issuer's terms don't say whether purchases a credit pays for earn rewards. Its credits are modeled as earning the card's rate on the whole purchase, with the credit on top."
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: hotel-credit
    match: { merchants: [bilt-travel-hotels] }
    amount: 200
    period: half_year
    note: 'Hotel stays of 2 nights or more booked through Bilt Travel: $200 from January through June and $200 from July through December.'
