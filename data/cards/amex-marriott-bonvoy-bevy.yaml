id: amex-marriott-bonvoy-bevy
name: Marriott Bonvoy Bevy American Express Card
short_name: Marriott Bonvoy Bevy
issuer: amex
network: amex
currency: marriott-bonvoy
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/marriott-bonvoy-bevy/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/marriott-bonvoy-bevy-card/25330-10-0#offer-terms
base_rate: 2
annual_fee: 250
foreign_transaction_fee: 0
welcome_offer:
  points: 85000
  spend: 5000
  months: 6
  not_with:
    [
      amex-marriott-bonvoy-brilliant,
      chase-marriott-bonvoy-boundless,
      chase-marriott-bonvoy-bold,
    ]
  note: 'No end date given. Not available if you have or have had this Card, the Marriott Bonvoy Brilliant Card or previous versions; Amex may also decline based on your card history. Also not available to anyone who had a Ritz-Carlton card from J.P. Morgan or a Marriott card from Chase (including Bountiful, Boundless and Bold) in the last 30 days, opened Bountiful, Boundless or Bold in the last 90 days, or got a new cardmember or upgrade bonus on one of those in the last 24 months.'
caps:
  - {
      id: dining-and-supermarkets,
      amount: 15000,
      period: calendar_year,
      then_rate: 2,
    }
rules:
  - id: marriott-hotels
    match: { merchants: [marriott] }
    rate: 6
    note: Charged directly with participating Marriott Bonvoy hotels, standalone Marriott retail stores and Marriott online stores (including Marriott gift cards online). Marriott's own member and elite points for stays aren't card earnings.
  - id: restaurants
    match: { categories: [dining] }
    rate: 4
    cap: dining-and-supermarkets
    note: Restaurants worldwide, including takeout and delivery in the U.S., on the first $15,000 a calendar year combined with U.S. supermarkets. Not nightclubs or convenience stores; a restaurant inside a hotel, casino or event venue may code as that place instead.
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 4
    geography: us_only
    cap: dining-and-supermarkets
    note: On the first $15,000 a calendar year combined with restaurants. Superstores, convenience stores, warehouse clubs and meal-kit delivery services are not supermarkets.
milestones:
  - id: free-night-15k
    spend: 15000
    period: calendar_year
    rewards:
      - Free Night Award (up to 50,000 points a night)
    note: One a calendar year. Deposited 8-12 weeks after you reach the total; it expires a year after it's issued. Basic Card Member only.
