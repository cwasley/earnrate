id: bilt-blue
name: Bilt Blue Card
color: '#2f5fa0'
# Issued by Column N.A. and serviced by Cardless; Bilt runs the rewards.
# Full earning terms are in the Bilt Card Offer Terms PDF, which the source
# checker can't read, so they're not in source_urls.
issuer: column
network: mastercard # World Elite Mastercard, per the card page's FAQ
currency: BILT
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.bilt.com/card/blue
  - https://www.bilt.com/card
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
rules:
  - id: bilt-travel-hotels
    match: { merchants: [bilt-travel-hotels] }
    rate: 3
    note: 1X card earn plus 2 Bilt Travel Portal bonus points on hotels booked at biltrewards.com/travel.
  - id: bilt-travel-flights
    match: { merchants: [bilt-travel-flights] }
    rate: 2
    note: 1X card earn plus 1 Bilt Travel Portal bonus point on flights booked at biltrewards.com/travel.
  - id: lyft
    match: { merchants: [lyft] }
    rate: 3
    requires: { activation: true }
    note: 1X card earn plus 2X Bilt bonus on eligible rides after linking Bilt and Lyft accounts in the Bilt app. Uncapped.
todo:
  - Rent and mortgage paid through Bilt earn 0.5X-1.25X depending on the cycle's everyday spend as a share of the housing payment (25%/50%/75%/100% give 0.5X/0.75X/1X/1.25X; below 25% a flat 250 points). earnrate has no spend-ratio rule, so the rent and mortgage category's note states it and the card ranks there at its usual rate.
  - Bilt Neighborhood Dining restaurants add a per-restaurant bonus (up to 4X total). It varies by restaurant, so it isn't modeled.
  - 'Welcome offer not modeled: the page offers $100 in Bilt Cash, a second currency (not BILT points or cash), with no spend required.'
