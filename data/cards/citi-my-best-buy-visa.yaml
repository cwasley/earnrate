id: citi-my-best-buy-visa
name: My Best Buy Visa Card
issuer: citi
network: visa
currency: best-buy-rewards
last_verified: 2026-10-24
verified_by: collin
source_urls:
  - https://www.citi.com/credit-cards/citi-best-buy-credit-cards
# Rates are points per dollar. A point is worth 2¢ in Best Buy rewards, so 2.5
# points per dollar is the advertised 5%.
base_rate: 0.5
annual_fee: 59
rules:
  - id: best-buy
    match: { merchants: [best-buy, pacific-kitchen-home] }
    rate: 2.5
    note: Only when paying with Standard Credit, not a financing plan. My Best Buy Plus/Total members also earn the membership's own rewards, counted separately.
  - id: gas
    match: { categories: [gas] }
    rate: 1.5
  - id: restaurants-and-grocery
    match: { categories: [dining, grocery] }
    rate: 1
    note: Restaurants, bars and grocery stores.
