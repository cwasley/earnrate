id: bank-of-america-premium-rewards
name: Bank of America Premium Rewards Credit Card
issuer: bank-of-america
# The page names the Visa Signature Luxury Hotel Collection and concierge as
# card benefits, and the terms carry the Visa trademark notice.
network: visa
currency: bofa-premium-rewards
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.bankofamerica.com/credit-cards/products/premium-rewards-credit-card/
  - https://www.bankofamerica.com/credit-cards/terms-and-conditions/?campaignid=4079485&productoffercode=UN&locale=en_US
  - https://www.bankofamerica.com/bofa-rewards/increasing-bofa-rewards-with-credit-cards/
base_rate: 1.5
annual_fee: 95
foreign_transaction_fee: 0
welcome_offer:
  points: 60000
  spend: 4000
  months: 3
  note: Online offer; the window is 90 days from account opening, modeled as 3 months. The offer may not be available elsewhere after leaving the page. The card may not be available to anyone who has or had it in the past 24 months.
rules:
  - id: travel-dining
    match: { categories: [travel, transit, dining] }
    rate: 2
    note: Restaurants (fast food included) and bars; airlines, hotels and motels, timeshares, campgrounds, car and RV rentals, cruises, travel agencies and tour operators, trains, buses, taxis, limousines, ferries, parking, and tolls. Not in-flight or duty-free airport purchases, or purchases through third-party payment accounts, mobile card readers or unsupported digital wallets.
  # BofA Rewards members earn a tier bonus on all points: 10% for Member,
  # 25% Preferred Plus, 50% Preferred Honors, 75% Premier.
  - id: travel-dining-bofa-rewards-member
    match: { categories: [travel, transit, dining] }
    rate: 2.2
    requires: { membership: bofa-rewards-member }
    note: 2x plus the 10% BofA Rewards Member bonus.
  - id: everything-bofa-rewards-member
    match: { any: true }
    rate: 1.65
    requires: { membership: bofa-rewards-member }
    note: 1.5x plus the 10% BofA Rewards Member bonus.
  - id: travel-dining-bofa-rewards-preferred-plus
    match: { categories: [travel, transit, dining] }
    rate: 2.5
    requires: { membership: bofa-rewards-preferred-plus }
    note: 2x plus the 25% BofA Rewards Preferred Plus bonus.
  - id: everything-bofa-rewards-preferred-plus
    match: { any: true }
    rate: 1.875
    requires: { membership: bofa-rewards-preferred-plus }
    note: 1.5x plus the 25% BofA Rewards Preferred Plus bonus.
  - id: travel-dining-bofa-rewards-preferred-honors
    match: { categories: [travel, transit, dining] }
    rate: 3
    requires: { membership: bofa-rewards-preferred-honors }
    note: 2x plus the 50% BofA Rewards Preferred Honors bonus.
  - id: everything-bofa-rewards-preferred-honors
    match: { any: true }
    rate: 2.25
    requires: { membership: bofa-rewards-preferred-honors }
    note: 1.5x plus the 50% BofA Rewards Preferred Honors bonus.
  - id: travel-dining-bofa-rewards-premier
    match: { categories: [travel, transit, dining] }
    rate: 3.5
    requires: { membership: bofa-rewards-premier }
    note: 2x plus the 75% BofA Rewards Premier bonus.
  - id: everything-bofa-rewards-premier
    match: { any: true }
    rate: 2.625
    requires: { membership: bofa-rewards-premier }
    note: 1.5x plus the 75% BofA Rewards Premier bonus.
# Not modeled: the $100 airline incidental and $100 TSA PreCheck or Global
# Entry statement credits.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
