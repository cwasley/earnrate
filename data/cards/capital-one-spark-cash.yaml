id: capital-one-spark-cash
name: Capital One Spark Cash
short_name: Spark Cash
color: '#4a4d52'
issuer: capital-one
network: mastercard # World Elite Mastercard for Business (Spark), per capitalone.com/credit-cards/benefits-guide
currency: cash
business: true
last_verified: 2026-11-22
verified_by: claude
source_urls:
  - https://www.capitalone.com/small-business/credit-cards/spark-cash/
  # The card page's "View important rates and disclosures" (pricing and
  # rewards FAQ); the number is the page's offer id and changes with it.
  - https://disclosures.capitalone.com/disclosure.41743.en-US.html
  # Capital One's business cash back cards page: its "Benefits for Capital
  # One business card holders" is the only place that states the foreign
  # transaction fee.
  - https://www.capitalone.com/small-business/credit-cards/cash-back/
base_rate: 2
annual_fee: 95
first_year_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  dollars: 1000
  spend: 10000
  months: 3
  repeat:
    {
      also: [capital-one-spark-cash-plus, capital-one-venture-x-business],
      may: true,
    }
  note: Only through the card page; existing or previous Capital One Business card holders may not be eligible.
rules:
  - id: business-travel
    match:
      {
        merchants:
          [
            capital-one-business-travel-hotels,
            capital-one-business-travel-vacation-rentals,
            capital-one-business-travel-car-rentals,
          ],
      }
    rate: 5
    note: Only when booked through Capital One Business Travel. Hotel incidentals, upgrades and other purchases outside Capital One Business Travel earn the base 2%.
  - id: capital-one-entertainment
    match: { merchants: [capital-one-entertainment] }
    rate: 5
    note: Tickets bought on the Capital One Entertainment ticketing platform only. Cardholder-exclusive pre-sales and tickets bought directly from Capital One Hall or Capital One Arena are excluded.
todo:
  - The card page and rates disclosure don't state a foreign transaction fee. The 0 comes from Capital One's business cash back cards page, whose benefits for Capital One business card holders include "Pay zero foreign transaction fees".
  - The card page's top line says 5% on "hotels and rental cars" through Capital One Business Travel; its FAQ and the rates disclosure add vacation rentals, which are included.
