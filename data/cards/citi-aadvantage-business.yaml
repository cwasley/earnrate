id: citi-aadvantage-business
name: Citi / AAdvantage Business World Elite Mastercard
issuer: citi
network: mastercard
currency: aadvantage-miles
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://www.citi.com/credit-cards/citi-aadvantage-business-credit-card
# Miles post to the company's AAdvantage Business account, not a personal
# AAdvantage account.
base_rate: 1
business: true
annual_fee: 99
first_year_fee: 0
welcome_offer:
  points: 65000
  spend: 4000
  months: 4
  note: "Miles post to the business's AAdvantage Business account. Not available if you received a new account bonus for a Citi / AAdvantage Business account in the past 48 months, or converted another Citi card on which you earned a new account bonus in the last 48 months into one."
rules:
  - id: american-airlines
    match: { merchants: [american-airlines] }
    rate: 2
    note: Items billed by American Airlines as the merchant of record. Car rentals, hotel reservations, status boosts or renewals, and AA Cargo don't count.
  - id: car-rentals
    match: { categories: [travel.car_rental] }
    rate: 2
    note: Car and truck rental merchants. Not RV or motor home rentals, nor rentals bought through travel agencies, tour operators or third-party travel sites.
  - id: gas-stations
    match: { categories: [gas] }
    exclude: { categories: [gas.superstore] }
    rate: 2
    note: Warehouse-club gas counts only when the club codes it as a gas station, so superstore and warehouse-club gas is excluded here to stay conservative. Discount, department and convenience stores don't count.
  - id: telecom-cable-satellite
    match: { categories: [phone, tv_internet] }
    rate: 2
    note: Telecom merchants (phone service and equipment such as cell phones) and cable and satellite TV, internet, phone and radio providers.
# Not modeled: free checked bag, companion certificate after $30,000 spend. Loyalty Points toward status aren't card earnings.
todo:
