id: citi-aadvantage-business
name: Citi / AAdvantage Business World Elite Mastercard
short_name: AAdvantage Business
color: '#3a4a5a'
issuer: citi
network: mastercard
currency: aadvantage-miles
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.citi.com/credit-cards/citi-aadvantage-business-credit-card
# Miles post to the company's AAdvantage Business account, not a personal
# AAdvantage account.
base_rate: 1
business: true
annual_fee: 99
first_year_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 75000
  spend: 5000
  months: 5
  note: "Miles post to the business's AAdvantage Business account. Not available if you received a new account bonus for a Citi / AAdvantage Business account in the past 48 months, or converted another Citi card on which you earned a new account bonus in the last 48 months into one. Citi's terms also exclude anyone who got a new account bonus for a CitiBusiness / AAdvantage Platinum Select account in the past 48 months."
rules:
  - id: american-airlines
    match: { merchants: [american-airlines] }
    rate: 2
    note: Items billed by American Airlines as the merchant of record. Car rentals booked on aadvantagecars.com and hotels booked on aadvantagehotels.com don't count.
  - id: car-rentals
    match: { categories: [travel.car_rental] }
    rate: 2
    note: Car, truck and van rental merchants. Not RV or motor home rentals, nor rentals bought through travel agencies, tour operators or third-party travel sites, nor car rental redemptions through Rocketmiles.
  - id: gas-stations
    match: { categories: [gas] }
    exclude: { categories: [gas.superstore] }
    rate: 2
    note: Warehouse-club gas counts only when the club codes it as a gas station, so superstore and warehouse-club gas is excluded here to stay conservative. Discount, department and convenience stores don't count.
  - id: telecom-cable-satellite
    match: { categories: [phone, tv_internet] }
    rate: 2
    note: Telecom merchants (phone service and equipment such as cell phones) and cable and satellite TV, internet, phone and radio providers.
milestones:
  - id: spend-30k
    spend: 30000
    period: cardmember_year
    rewards:
      - an American Airlines Companion Certificate
    note: "Citi's cardmembership year runs from the billing cycle after the anniversary month, so it can be a few weeks off the anniversary date. Issued after the card renews: the companion pays $99 plus taxes and fees on a domestic Main Cabin round trip."
# Not modeled: free checked bag. Loyalty Points toward status aren't card earnings.
