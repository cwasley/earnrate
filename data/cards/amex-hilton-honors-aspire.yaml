id: amex-hilton-honors-aspire
name: Hilton Honors American Express Aspire Card
short_name: Hilton Honors Aspire
color: '#22283a'
issuer: amex
network: amex
currency: hilton-honors
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/hilton-honors-aspire/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/hilton-honors-aspire-credit-card/25330-10-0#offer-terms
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
  - https://www.americanexpress.com/us/content/rewards-info/travel.html
base_rate: 3
annual_fee: 550
foreign_transaction_fee: 0
welcome_offer:
  points: 200000
  spend: 6000
  months: 6
  valid_to: 2027-01-13
  note: 'Amex: "You may not be eligible to receive a welcome offer if you have or have had this Card or previous versions of these Cards," and may also decline based on your history with balance transfers, as a Card Member, and the number of cards you have opened and closed. Offers may vary between advertisements.'
rules:
  - id: hilton-purchases
    match: { merchants: [hilton] }
    rate: 14
    note: Charged directly with a hotel or resort in the Hilton portfolio. Bookings count only through a Hilton-operated reservation channel, not online travel sites; incidentals (hotel restaurants, spas) count when charged to the room and paid with the card at checkout.
  - id: us-restaurants
    match: { categories: [dining] }
    exclude: { merchants: [dodger-stadium, bellagio], mccs: [5813] }
    rate: 7
    geography: us_only
    note: U.S. restaurants, including takeout and delivery. Not restaurants abroad (even U.S.-owned chains), nightclubs or bars, and possibly not restaurants inside hotels, casinos or event venues.
  - id: flights
    match: { categories: [travel.flights] }
    rate: 7
    note: Scheduled flights charged directly with the airline or through Amex Travel. Charter and private jet flights are excluded.
  - id: flights-amex-travel
    match: { merchants: [amex-travel-flights] }
    rate: 7
  - id: select-car-rentals
    match:
      merchants:
        [
          alamo,
          avis,
          budget,
          dollar-car-rental,
          enterprise,
          ez-rent-a-car,
          fox-rent-a-car,
          hertz,
          national-car-rental,
          payless-car-rental,
          sixt,
          thrifty,
        ]
    rate: 7
    note: Bought directly from one of Amex's select major car rental companies, at U.S. or international locations. Not through a third party such as an online travel agency, and not as part of a vacation package.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: flight-credit
    match: { categories: [travel.flights] }
    amount: 50
    period: quarter
    note: 'Airfare bought directly from an airline or on amextravel.com. Not charter or private flights, or flights in a vacation package.'
  - id: clear-plus
    match: { merchants: [clear] }
    amount: 219
    period: calendar_year
    note: 'An annual CLEAR+ membership.'
# Hilton sets no point cap, so it counts only at what the cardholder says
# it's worth to them.
free_nights:
  - id: anniversary-night
    note: 'In the first year of Card Membership and each year after renewal, for one standard room, double occupancy, at Hilton hotels other than those Hilton lists; taxes and resort fees included. Basic Card Member only; it expires a year after it is issued.'
