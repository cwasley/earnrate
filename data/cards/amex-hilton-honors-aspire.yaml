milestones:
  - id: spend-30k
    spend: 30000
    period: calendar_year
    rewards:
      - Free Night Reward
    note: Basic Card Member only, though Additional Card purchases count. A standard room for one night, expiring a year after it is issued. Amex says 8-12 weeks to arrive by email.
  - id: spend-60k
    spend: 60000
    period: calendar_year
    rewards:
      - A second Free Night Reward
    note: Another $30,000 on top of the first, $60,000 in the calendar year in all.
todo:
  - The $400 Hilton Resort credit (up to $200 each half year) isn't modeled. It counts only at the participating Hilton Resorts Hilton lists, which earnrate can't tell apart from other Hilton properties.
  - The $100 property credit on two-night Waldorf Astoria and Conrad stays booked through the Aspire card site or phone line is an on-property credit, not modeled.
  - Complimentary Hilton Honors Diamond status and National Car Rental Emerald Club Executive status aren't modeled.
  - 'Amex''s rewards terms count eligible purchases as "purchases for goods and services minus returns and other credits" and don''t say whether that takes out benefit statement credits. Its credits are modeled as earning the card''s rate on the whole purchase, with the credit on top.'
