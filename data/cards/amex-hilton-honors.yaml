id: amex-hilton-honors
name: Hilton Honors American Express Card
short_name: Amex Hilton Honors
issuer: amex
network: amex
currency: hilton-honors
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/hilton-honors/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/hilton-honors-credit-card/25330-10-0#offer-terms
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
base_rate: 3
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 70000
  spend: 2000
  months: 6
  valid_to: 2027-01-13
  note: 'Plus one Free Night Reward (a standard room, expiring 12 months after it is issued), which earnrate does not value. Amex: "You may not be eligible to receive a welcome offer if you have or have had this Card or previous versions of these Cards," and may also decline based on your history with balance transfers, as a Card Member, and the number of cards you have opened and closed. Offers may vary between advertisements.'
rules:
  - id: hilton-purchases
    match: { merchants: [hilton] }
    rate: 7
    note: Charged directly with a hotel or resort in the Hilton portfolio. Bookings count only through a Hilton-operated reservation channel, not online travel sites; incidentals (hotel restaurants, spas) count when charged to the room and paid with the card at checkout.
  - id: us-restaurants
    match: { categories: [dining] }
    exclude: { merchants: [dodger-stadium, bellagio], mccs: [5813] }
    rate: 5
    geography: us_only
    note: U.S. restaurants, including takeout and delivery. Not restaurants abroad (even U.S.-owned chains), nightclubs or bars, and possibly not restaurants inside hotels, casinos or event venues.
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 5
    geography: us_only
    note: Groceries at superstores, warehouse clubs and convenience stores, and meal-kit delivery services, earn the 3x base rate.
  - id: us-gas
    match: { categories: [gas] }
    exclude: { categories: [gas.grocery_store, gas.superstore] }
    rate: 5
    geography: us_only
    note: Gas at supermarkets, superstores and warehouse clubs earns the 3x base rate.
milestones:
  - id: spend-20k
    spend: 20000
    period: calendar_year
    rewards:
      - Hilton Honors Gold status
    note: Basic Card Member only, though Additional Card purchases count. Calendar year regardless of when the account opened. Gold lasts through the end of the next calendar year. Amex says about 10-12 weeks to take effect.
