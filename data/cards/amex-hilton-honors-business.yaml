id: amex-hilton-honors-business
name: Hilton Honors American Express Business Card
short_name: Hilton Honors Business
color: '#2b3340'
issuer: amex
network: amex
currency: hilton-honors
business: true
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/business/business-credit-cards/hilton-honors/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/business/prospect/hilton-honors-american-express-business-credit-card/45094-9-0#offer-terms
base_rate: 3
annual_fee: 195
foreign_transaction_fee: 0
welcome_offer:
  points: 150000
  spend: 8000
  months: 6
  valid_to: 2027-01-13
  note: 'Plus one Free Night Reward, which earnrate does not value. Amex: "You may not be eligible to receive a welcome offer if you have or have had this Card or previous versions of this Card," and may also decline based on your history with balance transfers, as a Card Member, and the number of cards you have opened and closed. Offers may vary between advertisements.'
rules:
  - id: hilton-purchases
    match: { merchants: [hilton] }
    rate: 12
    note: Lodging booked directly through a Hilton-operated reservation channel, and purchases at a Hilton hotel (its restaurants, spas and other on-site places) charged to the room and paid with the card at checkout. Not bookings through online travel sites or other third parties.
  - id: everyday-purchases
    match: { any: true }
    exclude: { merchants: [hilton] }
    rate: 5
    cap: { amount: 100000, period: calendar_year, then_rate: 3 }
    note: Every eligible purchase that isn't a Hilton purchase, on the first $100,000 a calendar year; 3x after that.
milestones:
  - id: spend-40k
    spend: 40000
    period: calendar_year
    rewards:
      - Hilton Honors Diamond status
    note: Basic Card Member only, though Additional Card purchases count. Calendar year regardless of when the account opened. Diamond lasts through the end of the next calendar year.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: hilton
    match: { merchants: [hilton] }
    amount: 60
    period: quarter
    note: 'Bookings made directly with Hilton, and incidental charges put on the room, at any property in the Hilton portfolio. Not through a travel website.'
