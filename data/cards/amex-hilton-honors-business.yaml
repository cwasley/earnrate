todo:
  - Complimentary Hilton Honors Gold status and National Car Rental Emerald Club Executive status (with enrollment) aren't modeled.
  - The welcome offer's Free Night Reward isn't valued; a welcome offer holds only points.
  - 'Amex''s rewards terms count eligible purchases as "purchases for goods and services minus returns and other credits" and don''t say whether that takes out benefit statement credits. Its credits are modeled as earning the card''s rate on the whole purchase, with the credit on top.'
