id: capital-one-venture-x-business
name: Capital One Venture X Business
short_name: Venture X Business
color: '#2b2d31'
issuer: capital-one
network: mastercard # World Elite Mastercard for Business, per capitalone.com/credit-cards/benefits-guide
currency: C1
business: true
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.capitalone.com/small-business/credit-cards/venture-x-business/
  # The card page's "View important rates and disclosures" (pricing and
  # rewards FAQ); the number is the page's offer id and changes with it.
  - https://disclosures.capitalone.com/disclosure.42243.en-US.html
base_rate: 2
annual_fee: 395
foreign_transaction_fee: 0
welcome_offer:
  points: 150000
  spend: 40000
  months: 4
  note: 'The first tier of a limited-time two-tier offer: 150,000 miles after $40,000 in the first 4 months, plus another 150,000 miles and a $1,000 Capital One Business Travel credit after $120,000 in the same 4 months. Only through the card page; it may not be available to existing or previous Capital One Business cardholders.'
rules:
  - id: business-travel-hotels-and-car-rentals
    match:
      {
        merchants:
          [
            capital-one-business-travel-hotels,
            capital-one-business-travel-car-rentals,
          ],
      }
    rate: 10
    note: Only when booked through Capital One Business Travel. Purchases paid with the travel credits earn no miles, and hotel incidentals or upgrades paid outside Capital One Business Travel earn the base 2X.
  - id: business-travel-flights-and-vacation-rentals
    match:
      {
        merchants:
          [
            capital-one-business-travel-flights,
            capital-one-business-travel-vacation-rentals,
          ],
      }
    rate: 5
    note: Only when booked through Capital One Business Travel.
  - id: capital-one-entertainment
    match: { merchants: [capital-one-entertainment] }
    rate: 5
    note: Tickets bought on the Capital One Entertainment ticketing platform only. Cardholder-exclusive pre-sales and tickets bought directly from Capital One Hall or Capital One Arena are excluded.
