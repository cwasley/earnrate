  - 'Verizon Dollars are forfeited if the Verizon wireless or Fios account closes, if the cardholder stops being its Account Owner or Manager, after 90 days if the card closes, or after 24 months with no card or rewards activity. Once Verizon service ends, the card earns nothing.'
  - 'Card benefits not modeled: Auto Pay discounts of up to $10 a month per line when paying the Verizon bill with the card, 2 free TravelPass days a year, and 0% device financing over 36 months.'
  - "Verizon Loyalty's separate 3% in Verizon Dollars on the Verizon bill comes with being a customer, not with the card, so it isn't counted."
