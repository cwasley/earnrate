id: verizon-visa-card
name: Verizon Visa Card
color: '#1c1c1c'
# Issued by Synchrony Bank as a Visa Signature. Rewards are Verizon Dollars,
# which redeem at $1 for a $1 statement credit on the card, or toward Verizon
# bills, devices and accessories, so a Verizon Dollar is 1¢ per cent earned
# here. Earning and redeeming need an active Verizon account.
issuer: synchrony
network: visa
currency: cash
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://www.verizon.com/financial-services/verizon-visa-card/
  - https://www.verizon.com/support/verizon-visa-card-rewards-legal/
  - https://www.verizon.com/support/verizon-visa-card-faqs/
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
requires_membership: verizon-account
welcome_offer:
  dollars: 150
  spend: 0
  months: 3
  valid_to: 2027-01-13
  note: 'A $150 statement credit after one purchase within 90 days of opening, for applicants approved 8/12/26 to 1/13/27; spend 0 stands in for "make one purchase". One offer per account; the credit posts 1-2 billing cycles after the purchase.'
rules:
  - id: gas-ev-charging
    match: { categories: [gas, ev_charging] }
    rate: 4
    note: Merchants coded as service stations or automated fuel dispensers, and EV charging stations. Not aviation or other non-automotive fuel. EV charging billed by a parking lot or garage can code as parking and earn 1%.
  - id: grocery-stores
    match: { categories: [grocery.supermarket] }
    rate: 4
    note: Grocery stores and supermarkets, by merchant category code. Groceries at Walmart, Target and other big-box stores may not count.
  - id: restaurants
    match: { categories: [dining] }
    rate: 4
    note: Restaurants, drinking places and fast food, including takeout and delivery. A cafe inside another store can code as that store and earn 1%.
  - id: caterers
    match: { mccs: [5811] }
    rate: 4
    note: Caterers count as restaurants.
  - id: verizon-purchases
    match: { merchants: [verizon-store] }
    rate: 4
    note: Devices and accessories bought at a Verizon store, Verizon online, by phone with Verizon or at an exclusive Verizon Authorized Retailer. Not Verizon wireless or Fios bill payments, or items charged to those bills, which earn 1%. Not Verizon services sold at big-box stores like Walmart or Best Buy.
todo:
