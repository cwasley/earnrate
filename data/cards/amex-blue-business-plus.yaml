id: amex-blue-business-plus
name: American Express Blue Business Plus Credit Card
issuer: amex
network: amex
currency: MR
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/business/business-credit-cards/american-express-blue-business-plus-credit-card-amex/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/business/prospect/bluebusinessplus-credit-card/45094-9-0
base_rate: 1
business: true
annual_fee: 0
foreign_transaction_fee: 2.7
welcome_offer:
  points: 50000
  spend: 5000
  months: 3
  varies: true
  note: 'The public offer is "as high as" 50,000 points; Amex shows the exact amount after you apply and before you accept. Not available if you have or have had this Card or previous versions of it, and Amex may also decline based on your card history. One offer per Card Account.'
rules:
  - id: amex-travel
    match:
      merchants:
        [
          amex-travel,
          amex-travel-hotels,
          amex-travel-flights,
          airbnb-amex-travel,
          amex-travel-car-rentals,
          amex-travel-cruises,
        ]
    rate: 2
    note: Scheduled flights, prepaid hotels, prepaid car rentals, cruises and prepaid Airbnb stays booked on AmexTravel.com or the Amex Travel app. Non-prepaid hotels and car rentals earn 1X. They don't count toward the $50,000 cap.
  - id: everyday-purchases
    match: { any: true }
    rate: 2
    cap: { amount: 50000, period: calendar_year, then_rate: 1 }
    note: Every eligible purchase, with no category restrictions, up to $50,000 a calendar year.
# Not modeled: the intro APR.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
evidence:
