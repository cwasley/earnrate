id: amex-blue-business-plus
name: American Express Blue Business Plus Credit Card
issuer: amex
network: amex
currency: MR
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://www.americanexpress.com/us/credit-cards/business/business-credit-cards/american-express-blue-business-plus-credit-card-amex/
base_rate: 1
business: true
annual_fee: 0
welcome_offer:
  points: 50000
  spend: 5000
  months: 3
  note: 'The public offer is "as high as" 50,000 points; Amex shows the exact amount after you apply. "Welcome offers vary and you may not be eligible for an offer." The card-specific eligibility rules are in the offer terms, which the headless browser can''t load.'
rules:
  - id: amex-travel
    match:
      merchants:
        [
          amex-travel,
          amex-travel-hotels,
          amex-travel-flights,
          airbnb-amex-travel,
          amex-travel-car-rentals,
          amex-travel-cruises,
        ]
    rate: 2
    note: Purchases on AmexTravel.com or the Amex Travel app. They don't count toward the $50,000 cap.
  - id: everyday-purchases
    match: { any: true }
    rate: 2
    cap: { amount: 50000, period: calendar_year, then_rate: 1 }
    note: Every eligible purchase, with no category restrictions, up to $50,000 a calendar year.
# Not modeled: the intro APR.
