id: citi-aadvantage-mileup
name: American Airlines AAdvantage MileUp Card
issuer: citi
# The card page's ID Theft Protection terms have cardholders enroll "with your
# Citibank Mastercard", and its footer carries the Mastercard trademark notice.
network: mastercard
currency: aadvantage-miles
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.citi.com/credit-cards/aadvantage-mile-up-credit-card
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 3
welcome_offer:
  points: 15000
  spend: 500
  months: 3
  note: 'Plus a $100 statement credit for the same $500 spend. Not available if you received a new account bonus for an AAdvantage MileUp account in the past 48 months, or converted another Citi card on which you earned a new account bonus in the last 48 months into a MileUp.'
rules:
  - id: american-airlines
    match: { merchants: [american-airlines] }
    rate: 2
    note: Items billed by American Airlines as the merchant of record. Car rentals booked on aadvantagecars.com and hotels booked on aadvantagehotels.com don't count.
  - id: grocery-stores
    match: { categories: [grocery, convenience_store] }
    exclude: { categories: [superstore, warehouse_club] }
    rate: 2
    note: Supermarkets, meat and dairy stores, convenience stores, markets, specialty food vendors, bakeries and grocery delivery services. Not superstores, warehouse clubs, candy stores, cafes, bars or fast food.
# Not modeled: 25% off inflight food and drink. Miles also earn Loyalty Points toward status, which aren't card earnings.
