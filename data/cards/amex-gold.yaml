id: amex-gold
name: American Express Gold Card
color: '#d4af6a'
issuer: amex
network: amex
currency: MR
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/gold-card/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/gold-card/25330-10-0#offer-terms
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
base_rate: 1
annual_fee: 325
foreign_transaction_fee: 0
welcome_offer:
  points: 100000
  spend: 8000
  months: 6
  varies: true
  not_with: [amex-platinum]
  note: 'The public offer is "as high as" 100,000 points; Amex shows the exact amount (which may be lower, or no offer) after you apply and before you accept. Not available if you have or have had this Card, the Premier Rewards Gold Card, the Platinum Card (including the Schwab and Morgan Stanley versions) or previous versions of these Cards; Amex may also decline based on your card history.'
rules:
  - id: restaurants
    match: { categories: [dining] }
    rate: 4
    cap: { amount: 50000, period: calendar_year, then_rate: 1 }
    exclude: { merchants: [dodger-stadium, bellagio], mccs: [5813] }
    note: Worldwide, fast food included. Not at restaurants inside hotels, casinos or event venues, at events or for event tickets, or at bars, nightclubs, breweries, bakeries, cafeterias, caterers, theatre clubs or meeting venues. Third-party delivery counts only in the U.S.
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 4
    geography: us_only
    cap: { amount: 25000, period: calendar_year, then_rate: 1 }
    note: Superstores, convenience stores, warehouse clubs and meal-kit delivery services are not supermarkets.
    named:
      earning:
        [
          aldi,
          gelsons,
          hy-vee,
          kings-food-markets,
          meijer,
          shoprite,
          smart-and-final,
          stop-and-shop,
          trader-joes,
          vons,
          whole-foods,
          winn-dixie,
        ]
      not_earning: [target, walmart, bjs-wholesale-club, seven-eleven]
  - id: flights
    match: { categories: [travel.flights] }
    rate: 3
    note: Scheduled flights charged directly with the airline or through Amex Travel. Charter and private jet flights are excluded.
  - id: flights-amex-travel
    match: { merchants: [amex-travel-flights] }
    rate: 3
  - id: prepaid-hotels-amex-travel
    match: { merchants: [amex-travel-hotels] }
    rate: 5
    note: Prepaid hotels only.
  - id: prepaid-car-rental-amex-travel
    match: { merchants: [amex-travel-car-rentals] }
    rate: 2
    note: Prepaid car rentals only.
  - id: cruises-amex-travel
    match: { merchants: [amex-travel-cruises] }
    rate: 2
    note: Booked and paid through AmexTravel.com.
  - id: airbnb-amex-travel
    match: { merchants: [airbnb-amex-travel] }
    rate: 2
    note: Prepaid Airbnb stays booked through Amex Travel. Add-on fees such as pet or pool fees don't count.
# Not modeled on purpose: the Venue Collection benefit (10% back at select
# stadiums and arenas, with enrollment) is a statement credit, not points.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: dunkin
    match: { merchants: [dunkin] }
    amount: 7
    period: month
    enroll: true
    note: "At U.S. Dunkin' locations, bought directly: not through a delivery app or caterer, or at a Dunkin' inside an airport or gas station. Not gift cards."
  - id: uber-cash
    match: { merchants: [uber, uber-eats] }
    amount: 10
    period: month
    note: 'Uber Cash, added to your Uber account each month once the card is in it. Only on U.S. rides and orders paid with an Amex card; not for a card added through Apple Pay or PayPal.'
  - id: dining
    match:
      {
        merchants:
          [grubhub, buffalo-wild-wings, five-guys, cheesecake-factory, wonder],
      }
    amount: 10
    period: month
    enroll: true
    note: 'U.S. orders from Grubhub (and Seamless), Buffalo Wild Wings, Five Guys, The Cheesecake Factory and Wonder.'
  - id: resy
    match: { merchants: [resy] }
    amount: 50
    period: half_year
    enroll: true
    note: 'U.S. restaurants that take Resy reservations, and purchases on Resy.com, in the Resy app or through Resy Pay.'
todo:
  - 'Amex''s rewards terms count eligible purchases as "purchases for goods and services minus returns and other credits" and don''t say whether that takes out benefit statement credits. Its credits are modeled as earning the card''s rate on the whole purchase, with the credit on top.'
