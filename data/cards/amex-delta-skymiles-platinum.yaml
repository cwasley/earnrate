id: amex-delta-skymiles-platinum
name: Delta SkyMiles Platinum American Express Card
short_name: Delta SkyMiles Platinum
color: '#a9abae'
issuer: amex
network: amex
currency: delta-skymiles
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://www.americanexpress.com/us/credit-cards/card/delta-skymiles-platinum-american-express-card/
  - https://www.americanexpress.com/en-us/credit-cards/apply/terms/personal/delta-skymiles-platinum-american-express-card/25330-10-0#offer-terms
  - https://www.americanexpress.com/us/content/rewards-info/retail.html
base_rate: 1
annual_fee: 350
foreign_transaction_fee: 0
welcome_offer:
  points: 90000
  spend: 4000
  months: 6
  valid_to: 2026-11-04
  varies: true
  not_with: [amex-delta-skymiles-reserve]
  note: 'The public offer is "as high as" 90,000 bonus miles plus a $300 statement credit, both after the same $4,000 in purchases; Amex shows the exact miles (which may be lower, or no offer) after you apply and before you accept. Amex: "You may not be eligible to receive a welcome offer if you have or have had this Card, the Delta SkyMiles® Reserve American Express Card or previous versions of these Cards." Amex may also decline based on your card history.'
rules:
  - id: delta
    match: { merchants: [delta, delta-vacations, delta-stays] }
    rate: 3
    note: Charged directly with Delta as merchant of record (delta.com, the Fly Delta app, phone, ticket counters), including Basic Economy fares, upgrades, seats, Sky Club membership, Delta-operated in-flight food and drinks, Delta Vacations packages and new Delta Stays bookings. Not Delta gift cards, deltashop.com, the Delta Flight Museum or in-flight Wi-Fi.
  - id: hotels
    match: { categories: [travel.hotels] }
    rate: 3
    note: Worldwide, paid directly to the hotel, including paying at check-in or check-out for a stay reserved through a third party. Not hotels prepaid through an online travel agency or in a vacation package. Shops, spas and restaurants inside a hotel don't count unless charged to the room and paid at checkout.
  - id: restaurants
    match: { categories: [dining] }
    exclude: { merchants: [dodger-stadium, bellagio], mccs: [5813] }
    rate: 2
    note: Worldwide, including takeout; third-party delivery counts only in the U.S. Not at restaurants inside hotels, casinos or event venues, or at bars, nightclubs, cafeterias and convenience stores.
  - id: us-supermarkets
    match: { categories: [grocery.supermarket] }
    exclude: { categories: [superstore, warehouse_club, convenience_store] }
    rate: 2
    geography: us_only
    note: Superstores, convenience stores, warehouse clubs and meal-kit delivery services are not supermarkets.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: resy
    match: { merchants: [resy] }
    amount: 10
    period: month
    enroll: true
    note: 'U.S. restaurants that take Resy reservations, and purchases on Resy.com, in the Resy app or through Resy Pay.'
  - id: rideshare
    match: { merchants: [uber, lyft, curb, alto] }
    amount: 10
    period: month
    enroll: true
    note: 'U.S. rides with Uber, Lyft, Curb or Alto.'
  - id: delta-stays
    match: { merchants: [delta-stays] }
    amount: 150
    period: calendar_year
    note: 'A new prepaid hotel or vacation rental booked on Delta Stays (delta.com/stays). Not resort, property or cancellation fees.'
