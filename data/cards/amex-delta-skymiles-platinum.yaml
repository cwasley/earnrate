todo:
  - The welcome offer's $300 statement credit (same $4,000 spend as the miles) isn't counted, since an offer is either miles or dollars.
  - The welcome offer ends 11/04/2026; re-check the card page for the next one.
  - MQD Boost ($1 Medallion Qualification Dollar per $20 of purchases each calendar year) can't be expressed, since it's a second per-dollar currency, not miles and not a one-time spend total.
  - Not tied to spending, so not modeled as milestones the $2,500 MQD Headstart each Medallion Qualification Year and the Companion Certificate each year after renewal.
  - Not modeled (statement credits and perks, not miles per dollar) 20% back on Delta in-flight food and drinks, and TakeOff 15 (15% off Delta award flights).
  - 'Amex''s rewards terms count eligible purchases as "purchases for goods and services minus returns and other credits" and don''t say whether that takes out benefit statement credits. Its credits are modeled as earning the card''s rate on the whole purchase, with the credit on top.'
