id: bank-of-america-atmos-rewards-summit
name: Atmos Rewards Summit Visa Infinite Credit Card
issuer: bank-of-america
network: visa
currency: atmos-points
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.bankofamerica.com/credit-cards/products/alaska-airlines-infinite-credit-card/
  - https://www.bankofamerica.com/credit-cards/terms-and-conditions/?campaignid=4081112&productoffercode=S2&locale=en_US
base_rate: 1
annual_fee: 395
foreign_transaction_fee: 0
welcome_offer:
  points: 80000
  spend: 4000
  months: 3
  note: Limited-time online offer, no end date stated; it may not be available elsewhere after leaving the page. The window is 90 days from account opening. The offer also includes a 25,000-point Global Companion Award.
rules:
  - id: alaska-and-hawaiian
    match: { merchants: [alaska-airlines, hawaiian-airlines] }
    rate: 3
    note: Card points only; points and status from flying aren't card earnings.
  - id: dining
    match: { categories: [dining] }
    rate: 3
  - id: foreign-purchases
    match: { any: true }
    rate: 3
    geography: foreign_only
    note: Purchases outside the U.S. and its territories, or in a foreign currency, including one made online from home. earnrate treats a purchase as foreign when it's made outside the U.S.
  - id: alaska-and-hawaiian-with-boa-account
    match: { merchants: [alaska-airlines, hawaiian-airlines] }
    rate: 3.3
    requires: { membership: bank-of-america-account }
    note: 3x plus the 10% rewards bonus for holding an eligible Bank of America account.
  - id: dining-with-boa-account
    match: { categories: [dining] }
    rate: 3.3
    requires: { membership: bank-of-america-account }
    note: 3x plus the 10% rewards bonus for holding an eligible Bank of America account.
  - id: foreign-purchases-with-boa-account
    match: { any: true }
    rate: 3.3
    geography: foreign_only
    requires: { membership: bank-of-america-account }
    note: 3x plus the 10% rewards bonus for holding an eligible Bank of America account.
  - id: everything-else-with-boa-account
    match: { any: true }
    rate: 1.1
    requires: { membership: bank-of-america-account }
    note: The 1x base rate plus the 10% rewards bonus for holding an eligible Bank of America account.
milestones:
  - id: spend-60k
    spend: 60000
    period: cardmember_year
    rewards:
      - a 100,000-point Global Companion Award
    note: "Up to 100,000 points off a companion's award ticket when you book with points; it credits within 1-2 billing cycles and must be used within 12 months. Separate from the 25,000-point award every anniversary."
