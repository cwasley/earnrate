id: chase-united-club
name: United Club Card
color: '#1c2533'
issuer: chase
network: visa
currency: united-miles
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/united/united-club
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC62957.html
base_rate: 1
annual_fee: 695
foreign_transaction_fee: 0
welcome_offer:
  points: 90000
  spend: 5000
  months: 3
  note: "Up to 100,000 in total: plus 10,000 bonus miles after adding an authorized user in the first 3 months. Not available to current cardmembers of any United Club credit card, or previous cardmembers of any United Club credit card who received a new Cardmember bonus for this card within the last 24 months. Chase doesn't say whether that includes the business card, and the page's summary only rules out holders of this card."
rules:
  - id: united
    match: { merchants: [united] }
    rate: 5
    note: Tickets, seat upgrades, Economy Plus, inflight food, drinks and Wi-Fi, bag fees and other United fees bought from United. Not United Cruises, MileagePlus X, DIRECTV or Merchandise Awards, or United tickets bought through discount travel sites or third-party packages. The advertised 11x on flights includes 6x MileagePlus flight miles, which aren't card earnings.
  - id: renowned-hotels
    match: { merchants: [renowned-hotels-chase-travel] }
    rate: 5
    note: Prepaid hotel stays booked through Renowned Hotels and Resorts for United Cardmembers on Chase Travel. Bookings through FROSCH, Valerie Wilson Travel or Frosch International Travel don't earn 5x.
  - id: travel
    match: { categories: [travel] }
    rate: 2
    note: Includes airfare, trains, cruise lines, hotels, car rentals and resorts. Chase's travel category leaves out in-flight and on-board cruise purchases, sightseeing and attractions, merchants inside hotels and airports, and sellers of gift cards, points or miles.
  - id: transit-as-travel
    match: { categories: [transit] }
    rate: 2
    note: Chase's travel category on this card includes local transit, taxis, rideshare and tolls.
  - id: dining
    match: { categories: [dining] }
    rate: 2
    note: Includes takeout and eligible delivery services.
milestones:
  - id: spend-20k
    spend: 20000
    period: calendar_year
    rewards:
      - a 10,000-mile award flight discount
    note: "Up to two a calendar year. It posts to MileagePlus within 6-8 weeks and expires 12 months after it's issued."
  - id: spend-40k
    spend: 40000
    period: calendar_year
    rewards:
      - a second 10,000-mile award flight discount
    note: "The most a calendar year: two discounts, on up to $40,000 of purchases. It posts to MileagePlus within 6-8 weeks and expires 12 months after it's issued."
  - id: spend-50k
    spend: 50000
    period: calendar_year
    rewards:
      - United Club All Access membership
    note: 'Premier Gold status unlocks it too. It lasts the rest of that calendar year and all of the next.'
todo:
  - United Card Events from Chase also earn 5x; no merchant exists for them, so they aren't modeled.
