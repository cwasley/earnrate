id: wells-fargo-autograph
name: Wells Fargo Autograph Card
issuer: wells-fargo
network: visa
currency: WFR
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.wellsfargo.com/autograph-visa-credit-card/
  - https://www.wellsfargo.com/credit-cards/autograph-visa/streaming/
  - https://www.wellsfargo.com/credit-cards/autograph-visa/terms/
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 20000
  spend: 1000
  months: 3
  note: The page calls it a $200 cash redemption value. You may not be eligible for bonus offers if you have this card or opened one within the last 48 months, even if it's closed.
rules:
  - id: dining
    match: { categories: [dining] }
    exclude: { merchants: [doordash, uber-eats] }
    rate: 3
    note: Restaurants, bars (drinking places), fast food and caterers, by Visa merchant code. Wells Fargo says bakeries, food at grocery stores and third-party delivery services may not earn 3X.
  - id: travel
    match: { categories: [travel] }
    rate: 3
    note: Airlines, hotels, timeshares, car rentals, cruise lines, travel agencies, discount travel sites and campgrounds, by Visa merchant code.
  - id: transit
    match: { categories: [transit] }
    exclude: { mccs: [4131] }
    rate: 3
    note: Passenger rail, taxis, limousines, ferries, tolls and parking. Intercity bus lines aren't on Wells Fargo's list.
  - id: gas
    match: { categories: [gas, ev_charging] }
    exclude: { categories: [gas.superstore, gas.grocery_store] }
    rate: 3
    note: Gas stations, automated fuel dispensers and EV charging stations, by Visa merchant code. Fuel or charging at superstores, warehouse clubs, grocery stores, car washes and auto repair shops may not earn 3X.
  - id: streaming
    match: { categories: [streaming, tv_internet] }
    rate: 3
    note: Cable and pay TV, digital goods (books, movies, music) and subscription services. Subscriptions bundled with another product or billed by a third party (an app store, a cable, phone or internet provider, an online retailer, a car) may not count. An internet-only bill may not code as pay TV.
  - id: phone
    match: { categories: [phone] }
    rate: 3
    note: Landline and cell phone providers. Phones, accessories, add-ons like insurance or extra data, and plans bundled or billed by a third party (an internet provider, a car) may not count.
# Not modeled: cell phone protection.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
