id: wells-fargo-autograph-journey
name: Wells Fargo Autograph Journey Card
short_name: Autograph Journey
color: '#2b2b2b'
issuer: wells-fargo
network: visa
currency: WFR
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
  - https://www.wellsfargo.com/credit-cards/autograph-journey-visa/terms/
base_rate: 1
annual_fee: 95
foreign_transaction_fee: 0
welcome_offer:
  points: 60000
  spend: 4000
  months: 3
  note: Offers may differ by marketing channel. Not available if you have the card or opened one in the last 48 months, even if it's closed.
rules:
  - id: hotels
    match: { categories: [travel.hotels] }
    rate: 5
    note: Merchants coded as hotels and motels.
  - id: airlines
    match: { categories: [travel.flights] }
    rate: 4
    note: Merchants coded as airlines and air carriers.
  - id: restaurants
    match: { categories: [dining] }
    rate: 3
    note: Restaurants, bars, fast food and caterers.
  - id: other-travel
    match: { categories: [travel] }
    rate: 3
    note: Car rentals, cruise lines, travel agencies, discount travel sites, timeshares and campgrounds.
# Not modeled: the $50 yearly statement credit after a $50 airline purchase.
