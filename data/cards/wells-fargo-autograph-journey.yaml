id: wells-fargo-autograph-journey
name: Wells Fargo Autograph Journey Card
short_name: Autograph Journey
color: '#2b2b2b'
issuer: wells-fargo
network: visa
currency: WFR
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
  - https://www.wellsfargo.com/credit-cards/autograph-journey-visa/terms/
base_rate: 1
annual_fee: 95
foreign_transaction_fee: 0
welcome_offer:
  points: 60000
  spend: 4000
  months: 3
  note: Offers may differ by marketing channel. Not available if you have the card or opened one in the last 48 months, even if it's closed.
rules:
  - id: hotels
    match: { categories: [travel.hotels] }
    rate: 5
    note: Merchants coded as hotels and motels.
  - id: airlines
    match: { categories: [travel.flights] }
    rate: 4
    note: Merchants coded as airlines and air carriers.
  - id: restaurants
    match: { categories: [dining] }
    rate: 3
    note: Restaurants, bars, fast food and caterers.
  - id: other-travel
    match: { categories: [travel] }
    rate: 3
    note: Car rentals, cruise lines, travel agencies, discount travel sites, timeshares and campgrounds.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: airline-credit
    match: { categories: [travel.flights] }
    amount: 50
    period: cardmember_year
    min_amount: 50
    note: "Applied automatically on the first purchase of $50 or more each year at a merchant coded as an airline (not charter or private jets). The first year runs from account opening; after that each year starts the first of the month after the annual fee is charged, modeled as the card's anniversary."
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
evidence:
  - rule: airline-credit
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'Plus a $50 annual statement credit with $50 minimum airline purchase'
  - rule: airline-credit
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'when your card is used for your first airline purchase of at least $50'
  - rule: base_rate
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: '1 rewards point will be earned per $1 spent on other net purchases'
  - rule: hotels
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'Five rewards points (1 base point plus 4 bonus points) are earned per $1 spent'
  - rule: hotels
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'with retailers whose merchant category code is classified as hotel/motel'
  - rule: airlines
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'Airlines: 4 points (1 base point plus 3 bonus points) for every $1 spent'
  - rule: restaurants
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'eating places and restaurants, drinking places, fast food restaurants, and caterers'
  - rule: other-travel
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'timeshare, or vehicle/auto rental, cruise lines, travel agencies, discount travel sites, campgrounds'
  - rule: annual_fee
    url: https://www.wellsfargo.com/credit-cards/autograph-journey-visa/terms/
    quote: 'Annual Fee $95'
  - rule: welcome_offer
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'when you spend $4,000 in purchases in the first 3 months'
  - rule: welcome_offer
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'Earn 60,000 bonus points'
  - rule: welcome_offer
    url: https://creditcards.wellsfargo.com/autograph-journey-visa-credit-card/
    quote: 'or opened one within the last 48 months from the date of the application'
  - rule: foreign_transaction_fee
    url: https://www.wellsfargo.com/credit-cards/autograph-journey-visa/terms/
    quote: 'Foreign Transaction None'
todo:
  - "The issuer's terms don't say whether purchases a credit pays for earn rewards. Its credits are modeled as earning the card's rate on the whole purchase, with the credit on top."
