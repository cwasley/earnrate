id: chase-ink-business-unlimited
name: Ink Business Unlimited
color: '#4a5560'
issuer: chase
# The pricing and terms say "By becoming a Visa Business Card cardmember".
network: visa
currency: cash
last_verified: 2026-11-04
verified_by: claude
source_urls:
  - https://creditcards.chase.com/business-credit-cards/ink/unlimited
  - https://www.chase.com/personal/credit-cards/education/rewards-benefits/how-to-combine-chase-credit-card-points-in-household
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC63749.html
base_rate: 1.5
business: true
annual_fee: 0
foreign_transaction_fee: 3
welcome_offer:
  dollars: 750
  spend: 6000
  months: 3
  note: 'Chase: "The new cardmember bonus may not be available to you if you have ever had this card or any other Chase for Business card without an annual fee." Chase may also consider factors about your business.'
# Its cash back is earned as Ultimate Rewards points, which Chase lets you
# move to another Ultimate Rewards card on your account.
pools_into:
  currency: UR
  when_wallet_has:
    [
      chase-sapphire-preferred,
      chase-sapphire-reserve,
      chase-ink-business-preferred,
    ]
rules:
  - id: lyft
    match: { merchants: [lyft] }
    rate: 5
    valid_to: 2027-09-30
    note: Limited-time offer, a total of 5% on Lyft rides through September 30, 2027.
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: instacart
    match: { merchants: [instacart] }
    amount: 20
    period: month
    enroll: true
    note: "Instacart credits in an Instacart Business account, which need an active Instacart+ membership: activate Chase's complimentary one with the card. Through December 31, 2027."
todo:
  - "The issuer's terms don't say whether purchases a credit pays for earn rewards. Its credits are modeled as earning the card's rate on the whole purchase, with the credit on top."
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
evidence:
  - rule: base_rate
    url: https://creditcards.chase.com/business-credit-cards/ink/unlimited
    quote: 'Earn unlimited 1.5% Cash Back rewards on every purchase made for your business.'
  - rule: lyft
    url: https://creditcards.chase.com/business-credit-cards/ink/unlimited
    quote: 'Earn a total of 5% cash back on Lyft rides through September 30, 2027'
  - rule: pools_into
    url: https://creditcards.chase.com/business-credit-cards/ink/unlimited
    quote: 'Redeem your rewards for cash back, gift cards, travel and more through Chase Ultimate Rewards'
  - rule: pools_into
    url: https://www.chase.com/personal/credit-cards/education/rewards-benefits/how-to-combine-chase-credit-card-points-in-household
    quote: 'You can combine points from one Chase card to another Chase card on your account'
  - rule: annual_fee
    url: https://creditcards.chase.com/business-credit-cards/ink/unlimited
    quote: 'ANNUAL FEE $0'
  - rule: annual_fee
    url: https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC63749.html
    quote: 'Annual Membership Fee None'
  - rule: welcome_offer
    url: https://creditcards.chase.com/business-credit-cards/ink/unlimited
    quote: 'after you spend $6,000 on purchases in the first 3 months after account opening'
  - rule: welcome_offer
    url: https://creditcards.chase.com/business-credit-cards/ink/unlimited
    quote: 'Earn $750 cash back'
  - rule: foreign_transaction_fee
    url: https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC63749.html
    quote: 'Foreign Transactions 3% of the amount of each transaction in U.S. dollars'
  - rule: instacart
    url: https://creditcards.chase.com/business-credit-cards/ink/unlimited
    quote: 'Instacart+ members get a $20 Instacart credit each month automatically loaded into their Instacart Business Account'
