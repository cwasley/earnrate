id: capital-one-savor
name: Capital One Savor Rewards Credit Card
short_name: Capital One Savor
color: '#7a4a32'
issuer: capital-one
# The card page never names the network in visible text; its embedded
# product data says MasterCard.
network: mastercard
currency: cash
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.capitalone.com/credit-cards/savor/
  # The card page's "Important disclosures" (pricing and rewards FAQ); the
  # number is the page's offer id and changes when Capital One changes it.
  - https://disclosures.capitalone.com/disclosure.42167.en-US.html
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  dollars: 200
  spend: 500
  months: 3
  note: One-time cash bonus, available by applying through the card page. Existing or previous cardmembers are not eligible if they received a new cardmember bonus for this product in the past 48 months.
rules:
  - id: capital-one-entertainment
    match: { merchants: [capital-one-entertainment] }
    rate: 8
    note: Tickets bought on the Capital One Entertainment ticketing platform only. Cardholder-exclusive pre-sales and tickets bought directly from Capital One Hall or Capital One Arena are excluded.
  - id: capital-one-travel-hotels-vacation-rentals-car-rentals
    match:
      {
        merchants:
          [
            capital-one-travel-hotels,
            capital-one-travel-vacation-rentals,
            capital-one-travel-car-rentals,
          ],
      }
    rate: 5
    note: Only when booked through Capital One Travel. Flights booked there, and hotel incidentals or upgrades paid outside Capital One Travel, earn the base 1%.
  - id: grocery-stores
    match: { categories: [grocery.supermarket] }
    exclude:
      {
        categories: [superstore, warehouse_club, convenience_store],
        merchants: [walmart, target],
      }
    rate: 3
    note: Supermarkets, meat lockers, freezers, dairy product stores and specialty markets. Groceries bought at gas stations, convenience stores, warehouse clubs, discount stores and superstores like Walmart and Target, or at grocery stores tied to them, earn 1%.
  - id: dining
    match: { categories: [dining] }
    rate: 3
    note: Restaurants, cafes, bars, lounges, fast-food chains and bakeries. Restaurants inside hotels or grocery stores, and some food trucks, may not code as dining.
  - id: entertainment
    match: { categories: [entertainment, movie_theaters] }
    rate: 3
    note: Tickets at movie theaters, professional and semi-professional sports promoters, theatrical and concert promoters, amusement parks, tourist attractions, aquariums, zoos, dance halls, record stores, pool halls and bowling alleys. Golf courses, country clubs, collegiate sporting events, charities that put on live entertainment, cable, streaming and membership services don't count, and neither do tickets bought through a third-party site or packages coded as travel or hotel.
  - id: streaming
    match: { categories: [streaming] }
    rate: 3
    note: Eligible music and video streaming services. Verizon FIOS On Demand, audiobook subscriptions and fitness programming are excluded; Capital One doesn't list the eligible services.
todo:
  - Online grocery and delivery (grocery.online, e.g. Instacart) isn't addressed on the card page or in the rewards FAQ. Only grocery.supermarket is modeled.
  - Which streaming services are eligible isn't listed on the card page or in the rewards FAQ, only some exclusions.
  - Amusement parks, tourist attractions, aquariums, zoos, record stores, pool halls and bowling alleys earn 3% as entertainment but have no earnrate category. Golf courses and collegiate sporting events are excluded but can't be told apart from the entertainment category.
  - Capital One says purchases through third-party payment accounts, mobile card readers or digital wallets may not get the bonus rate. Not modeled.
