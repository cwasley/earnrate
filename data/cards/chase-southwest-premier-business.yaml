source_urls:
  - https://creditcards.chase.com/southwest/premier-business-credit-card
  - https://creditcards.chase.com/business-credit-cards/southwest/premier-business
base_rate: 1
business: true
annual_fee: 149
welcome_offer:
  points: 80000
  spend: 3000
  months: 3
  note: 'Marked a limited-time offer, with 60,000 struck through; the page states no end date. Not available to current cardmembers of this business card, or previous cardmembers who received a new Cardmember bonus for this business card within the last 24 months.'
caps:
