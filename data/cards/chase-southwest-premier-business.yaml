    amount: 8000
    period: cardmember_year
    then_rate: 1
rules:
  - id: southwest
    match: { merchants: [southwest] }
    rate: 3
    note: Purchases made directly with Southwest, including flights, inflight, Southwest gift cards and Getaways by Southwest packages. Southwest Cruises, Southwest Charters and Southwest Cargo are excluded.
  - id: gas
    match: { categories: [gas] }
    rate: 2
    cap: gas-and-dining
    note: Shares an $8,000 per account anniversary year cap with restaurants.
  - id: dining
    match: { categories: [dining] }
    rate: 2
    cap: gas-and-dining
    note: Shares an $8,000 per account anniversary year cap with gas stations.
  - id: lyft
    match: { merchants: [lyft] }
    rate: 3
    valid_to: 2027-12-31
    note: Limited-time offer on rides, bikes, scooters and Lyft memberships bought in the Lyft app. Gift cards and Lyft car rentals are excluded.
