todo:
  - 'The BofA Rewards rules use proposed membership ids: bofa-rewards-member, bofa-rewards-preferred-plus, bofa-rewards-preferred-honors and bofa-rewards-premier. Cardholders who joined Preferred Rewards before May 26, 2026 may have an "extended card benefit" that Bank of America doesn''t define.'
  - 'Bank of America says the BofA Rewards bonus doesn''t apply to "the bonus earn for certain programs" without naming them, so whether it applies to the Travel Center''s extra 1.5 points is unclear. The tier rules apply it to all 3 points, as Bank of America''s own BofA Rewards table does (3.3% to 5.25% on Travel Center purchases).'
