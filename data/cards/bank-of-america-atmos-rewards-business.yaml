todo:
  - 'Flights booked through Atmos for Business (alaskaair.com/content/atmos-for-business) earn 10 points per $1. earnrate has no merchant for that booking site, so they count at the 3x Alaska rate.'
  - "BofA's rewards page lists Atmos Rewards cards as not eligible for the BofA Rewards tier bonus (in a popup the source check can't read), so the 10% account bonus stands alone."
