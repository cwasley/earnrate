    quote: 'Earn 1 point (base point) for every $1 of Net Purchases charged to the card'
  - rule: alaska-and-hawaiian
    url: https://business.bankofamerica.com/en/credit-cards/atmos-rewards
    quote: '3 points per $1 spent on other eligible Alaska Airlines and Hawaiian Airlines purchases'
  - rule: alaska-and-hawaiian
    url: https://www.bankofamerica.com/smallbusiness/credit-cards/terms-and-conditions/?campaignid=4082063&productoffercode=K8&locale=en_US
    quote: 'purchases made through a third-party merchant (e.g., travel agency, online merchant) will not earn 3 points per dollar'
  - rule: dining
    url: https://business.bankofamerica.com/en/credit-cards/atmos-rewards
