id: bank-of-america-atmos-rewards-business
name: Atmos Rewards Visa Signature Business Card
short_name: Atmos Rewards Business
color: '#2a4a6b'
issuer: bank-of-america
network: visa
currency: atmos-points
last_verified: 2026-11-22
verified_by: claude
source_urls:
  - https://business.bankofamerica.com/en/credit-cards/atmos-rewards
  # The card page's "Terms and conditions" link; the campaign id changes with
  # the offer.
  - https://www.bankofamerica.com/smallbusiness/credit-cards/terms-and-conditions/?campaignid=4082063&productoffercode=K8&locale=en_US
base_rate: 1
business: true
annual_fee: 195
foreign_transaction_fee: 0
welcome_offer:
  points: 90000
  spend: 6000
  months: 3
  note: Limited-time online offer, no end date stated. The window is 90 days from account opening, and the offer is limited to one per new company.
rules:
  - id: alaska-and-hawaiian
    match: { merchants: [alaska-airlines, hawaiian-airlines] }
    rate: 3
    note: Tickets, inflight and lounge purchases, cargo and vacation packages billed by Alaska or Hawaiian and booked directly with them, not through a travel agency or online merchant. Flights booked through Atmos for Business earn 10 points per $1 instead. Card points only; points and status from flying aren't card earnings.
  - id: dining
    match: { categories: [dining, caterers] }
    rate: 2
    note: Restaurants, fast food, caterers, and bars or taverns, by merchant category code.
  - id: alaska-and-hawaiian-with-boa-account
    match: { merchants: [alaska-airlines, hawaiian-airlines] }
    rate: 3.3
    requires: { membership: bank-of-america-small-business-account }
    note: 3x plus the 10% rewards bonus when the company has an eligible Bank of America small business account.
  - id: dining-with-boa-account
    match: { categories: [dining, caterers] }
    rate: 2.2
    requires: { membership: bank-of-america-small-business-account }
    note: 2x plus the 10% rewards bonus when the company has an eligible Bank of America small business account.
  - id: everything-else-with-boa-account
    match: { any: true }
    rate: 1.1
    requires: { membership: bank-of-america-small-business-account }
    note: The 1x base rate plus the 10% rewards bonus when the company has an eligible Bank of America small business account.
milestones:
  - id: spend-100k
    spend: 100000
    period: cardmember_year
    rewards:
      - a 50% Global Discount Code
      - 10,000 status points
    note: Spending in the card anniversary year counts; both arrive within 2 billing cycles after qualifying. Status points count toward elite status only.
  - id: spend-200k
    spend: 200000
    period: cardmember_year
    rewards:
      - a second 50% Global Discount Code
      - 10,000 more status points
    note: The second award in the same card anniversary year.
# Not modeled on purpose: the $120 TSA PreCheck or Global Entry credit every
# four years, four Alaska Lounge passes a year, and the 1 status point per $3.
evidence:
  - rule: base_rate
    url: https://business.bankofamerica.com/en/credit-cards/atmos-rewards
    quote: 'Earn 1 point per $1 spent on all other purchases'
  - rule: base_rate
