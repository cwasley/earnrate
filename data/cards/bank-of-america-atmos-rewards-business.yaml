id: bank-of-america-atmos-rewards-business
name: Atmos Rewards Visa Signature Business Card
issuer: bank-of-america
network: visa
currency: atmos-points
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://www.bankofamerica.com/smallbusiness/credit-cards/products/alaska-airlines-business-credit-card/
  - https://www.bankofamerica.com/smallbusiness/credit-cards/terms-and-conditions/?campaignid=4080500&productoffercode=CX&locale=en_US
base_rate: 1
business: true
annual_fee: 70
foreign_transaction_fee: 0
welcome_offer:
  points: 70000
  spend: 4000
  months: 3
  note: Limited-time online offer, no end date stated. Online only; it may not be available after leaving the page, at a financial center or by phone. The window is 90 days from account opening. The offer also includes a $99 Companion Fare (plus taxes and fees from $23). The spend and window are in the offer's info tooltip, not the visible page text.
rules:
  - id: alaska-and-hawaiian
    match: { merchants: [alaska-airlines, hawaiian-airlines] }
    rate: 3
    note: Card points only; points and status from flying aren't card earnings.
  - id: gas-ev-shipping-transit
    match: { categories: [gas, ev_charging, shipping, transit] }
    exclude: { mccs: [7523] }
    rate: 2
    note: Local transit includes rideshare, trains, buses, ferries and tolls; parking isn't on Bank of America's list. Shipping is motor freight carriers and courier services.
  - id: alaska-and-hawaiian-with-boa-account
    match: { merchants: [alaska-airlines, hawaiian-airlines] }
    rate: 3.3
    requires: { membership: bank-of-america-small-business-account }
    note: 3x plus the 10% rewards bonus when the company has an eligible Bank of America small business account.
  - id: gas-ev-shipping-transit-with-boa-account
    match: { categories: [gas, ev_charging, shipping, transit] }
    exclude: { mccs: [7523] }
    rate: 2.2
    requires: { membership: bank-of-america-small-business-account }
    note: 2x plus the 10% rewards bonus when the company has an eligible Bank of America small business account.
  - id: everything-else-with-boa-account
    match: { any: true }
    rate: 1.1
    requires: { membership: bank-of-america-small-business-account }
    note: The 1x base rate plus the 10% rewards bonus when the company has an eligible Bank of America small business account.
milestones:
  - id: spend-6k
    spend: 6000
    period: cardmember_year
    rewards:
      - a $99 Companion Fare
    note: 'Spending by the account anniversary counts; the code arrives within 2 billing cycles after it. $99 plus taxes and fees from $23, for a companion on a Saver or Main Cabin fare within North America on Alaska or Hawaiian. Use it within 12 months.'
