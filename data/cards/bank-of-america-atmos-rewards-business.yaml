todo:
  - 'annual_fee is the $70 per-company fee. Each card also costs $25 a year, which the schema has no field for.'
  - "BofA's rewards page lists Atmos Rewards cards as not eligible for the BofA Rewards tier bonus (in a popup the source check can't read), so the 10% account bonus stands alone."
