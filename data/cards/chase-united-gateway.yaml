id: chase-united-gateway
name: United Gateway Card
issuer: chase
network: visa
currency: united-miles
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/united/united-gateway
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
base_rate: 1
annual_fee: 0
welcome_offer:
  points: 40000
  spend: 1000
  months: 3
  note: 'Up to 50,000 in total: plus 10,000 bonus miles after adding an authorized user in the first 3 months. Not available to current cardmembers of this card, or previous cardmembers who received a new Cardmember bonus for this card within the last 24 months.'
rules:
  - id: united
    match: { merchants: [united] }
    rate: 2
    note: Tickets, seat upgrades, Economy Plus, inflight food, drinks and Wi-Fi, bag fees and other United fees bought from United. Not United Cruises, MileagePlus X, DIRECTV or Merchandise Awards, or United tickets bought through discount travel sites or third-party packages. The advertised 5x on flights includes 3x MileagePlus flight miles (6x after $10,000 of card spend in a calendar year), which aren't card earnings.
  - id: gas
    match: { categories: [gas] }
    rate: 2
    note: Not truck stops, marinas, or oil and propane distributors.
  - id: local-transit
    match: { categories: [transit] }
    rate: 2
    note: Local transit and commuting, including rideshare, taxis, trains, buses, ferries, tolls and parking. Not airlines, car rentals, bike or scooter rentals or car sharing.
todo:
  - United Card Events from Chase also earn 2x; no merchant exists for them, so they aren't modeled.
