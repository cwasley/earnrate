id: chase-united-explorer
name: United Explorer Card
issuer: chase
network: visa
currency: united-miles
last_verified: 2026-10-26
verified_by: collin
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/united/united-explorer
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
base_rate: 1
annual_fee: 150
first_year_fee: 0
welcome_offer:
  points: 70000
  spend: 3000
  months: 3
  note: 'Up to 80,000 in total: plus 10,000 bonus miles after adding an authorized user in the first 3 months. Not available to current cardmembers of this card, or previous cardmembers who received a new Cardmember bonus for this card within the last 24 months.'
rules:
  - id: united
    match: { merchants: [united] }
    rate: 3
    note: Tickets, seat upgrades, Economy Plus, inflight food, drinks and Wi-Fi, bag fees and other United fees bought from United. Not United Cruises, MileagePlus X, DIRECTV or Merchandise Awards, or United tickets bought through discount travel sites or third-party packages. The advertised 9x on flights includes 6x MileagePlus flight miles, which aren't card earnings.
  - id: dining
    match: { categories: [dining] }
    rate: 2
    note: Includes takeout and eligible delivery services.
  - id: hotels-direct
    match: { categories: [travel.hotels] }
    rate: 2
    note: Only hotel stays booked directly with the hotel. Not travel agencies, discount travel sites, vacation clubs, tour operators or packages; on-site purchases count only if they code as the hotel.
todo:
  - United Card Events from Chase also earn 3x; no merchant exists for them, so they aren't modeled.
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
