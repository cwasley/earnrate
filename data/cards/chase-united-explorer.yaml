id: chase-united-explorer
name: United Explorer Card
color: '#2b4f86'
issuer: chase
network: visa
currency: united-miles
last_verified: 2026-11-01
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/united/united-explorer
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC63218.html
base_rate: 1
annual_fee: 150
first_year_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 70000
  spend: 3000
  months: 3
  note: 'Up to 80,000 in total: plus 10,000 bonus miles after adding an authorized user in the first 3 months. Not available to current cardmembers of this card, or previous cardmembers who received a new Cardmember bonus for this card within the last 24 months.'
rules:
  - id: united
    match: { merchants: [united] }
    rate: 3
    note: Tickets, seat upgrades, Economy Plus, inflight food, drinks and Wi-Fi, bag fees and other United fees bought from United. Not United Cruises, MileagePlus X, DIRECTV or Merchandise Awards, or United tickets bought through discount travel sites or third-party packages. The advertised 9x on flights includes 6x MileagePlus flight miles, which aren't card earnings.
  - id: dining
    match: { categories: [dining] }
    rate: 2
    note: Includes takeout and eligible delivery services.
  - id: hotels-direct
    match: { categories: [travel.hotels] }
    rate: 2
    note: Only hotel stays booked directly with the hotel. Not travel agencies, discount travel sites, vacation clubs, tour operators or packages; on-site purchases count only if they code as the hotel.
milestones:
  - id: spend-10k
    spend: 10000
    period: calendar_year
    rewards:
      - '$100 United TravelBank cash'
    note: 'One a calendar year. It posts to MileagePlus within 6-8 weeks, and the booking must be made within 12 months of issue.'
  - id: spend-20k
    spend: 20000
    period: calendar_year
    rewards:
      - a 10,000-mile award flight discount
    note: "One a calendar year. It posts to MileagePlus within 6-8 weeks and expires 12 months after it's issued."
todo:
  - United Card Events from Chase also earn 3x; no merchant exists for them, so they aren't modeled.
  - "The issuer's terms don't say whether purchases a credit pays for earn rewards. Its credits are modeled as earning the card's rate on the whole purchase, with the credit on top."
# Merchant statement credits, on top of what the purchase earns.
credits:
  - id: instacart
    match: { merchants: [instacart] }
    amount: 10
    period: month
    enroll: true
    note: "Instacart credits, which need an active Instacart+ membership: activate Chase's complimentary one with the card. Through December 31, 2027."
  - id: rideshare
    match: { categories: [transit.rideshare] }
    amount: 5
    period: month
    enroll: true
    note: 'Rideshare rides. Opt in each year.'
  - id: jsx
    match: { merchants: [jsx] }
    amount: 100
    period: cardmember_year
    note: 'Flights booked directly with JSX.'
# Issuer text backing each rule; `yarn check-sources` checks it weekly.
