id: chase-marriott-bonvoy-bold
name: Marriott Bonvoy Bold Credit Card
issuer: chase
network: visa
currency: marriott-bonvoy
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/marriott-bonvoy/bold
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65105.html
base_rate: 1
annual_fee: 0
foreign_transaction_fee: 0
welcome_offer:
  points: 45000
  spend: 1000
  months: 3
  not_with: [chase-marriott-bonvoy-boundless]
  note: 'No end date given. Chase: "This credit card is not available to you if (1) you currently have any of the following cards or (2) you received a new cardmember bonus for any of the following cards within the last 24 months" (Marriott Bonvoy Premier, Rewards Premier, Boundless, Rewards Premier Plus, Bold). The bonus also isn''t available to holders of the Marriott Bonvoy American Express Card in the last 30 days, or anyone approved for the Marriott Bonvoy Business, Brilliant or Bevy American Express cards in the last 90 days or paid their bonus in the last 24 months.'
rules:
  - id: marriott-hotels
    match: { merchants: [marriott] }
    rate: 3
    note: Card points only, at hotels participating in Marriott Bonvoy. Chase advertises "up to 14X total", which adds up to 10X base points and 1X Silver Elite bonus that Marriott posts for stays; those aren't card earnings.
  - id: grocery
    match: { categories: [grocery.supermarket] }
    rate: 2
    note: Chase's grocery stores exclude warehouse clubs, discount stores, drugstores and gas at grocery-store stations; delivery services count only if they code as a grocery store.
  - id: internet-cable-phone
    match: { categories: [tv_internet, phone] }
    rate: 2
  - id: streaming
    match:
      {
        merchants:
          [
            apple-music,
            apple-tv,
            disney-plus,
            espn,
            fubotv,
            max,
            hulu,
            netflix,
            pandora,
            paramount-plus,
            peacock,
            showtime,
            siriusxm,
            sling-tv,
            spotify,
            youtube-premium,
            youtube-tv,
            fandango-at-home,
          ],
      }
    rate: 2
    note: Only the services on Chase's select streaming list, like Netflix, Hulu, Disney+ and Spotify.
  - id: rideshare
    match: { categories: [transit.rideshare] }
    rate: 2
    note: Taxis, limousines and rideshare. Not car rentals, car sharing or carpools.
  - id: food-delivery
    match:
      {
        merchants:
          [doordash, caviar, uber-eats, postmates, grubhub, delivery-com],
      }
    rate: 2
    note: Only orders placed directly through DoorDash, Caviar, Uber Eats, Postmates, Grubhub, Seamless or Delivery.com, on the website or app.
