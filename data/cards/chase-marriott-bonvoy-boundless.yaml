id: chase-marriott-bonvoy-boundless
name: Marriott Bonvoy Boundless Credit Card
short_name: Bonvoy Boundless
color: '#2e3742'
issuer: chase
network: visa
currency: marriott-bonvoy
last_verified: 2026-11-03
verified_by: claude
source_urls:
  - https://creditcards.chase.com/travel-credit-cards/marriott-bonvoy/boundless
  - https://www.chase.com/personal/credit-cards/rewards-category-faq
  - https://sites.chase.com/services/creatives/pricingandterms.html/content/dam/pricingandterms/LGC65195.html
base_rate: 2
annual_fee: 95
foreign_transaction_fee: 0
rules:
  - id: marriott-hotels
    match: { merchants: [marriott] }
    rate: 6
    note: Card points only, at hotels participating in Marriott Bonvoy. Chase advertises "up to 17X total", which adds up to 10X base points and 1X Silver Elite bonus that Marriott posts for stays; those aren't card earnings.
  - id: dining-grocery-gas
    match: { categories: [dining, grocery.supermarket, gas] }
    rate: 3
    cap: { amount: 6000, period: calendar_year, then_rate: 2 }
    note: On the first $6,000 of combined purchases a year. Chase's year runs from account opening (then each later year) through the December statement date, close to a calendar year. Dining includes takeout and eligible delivery services. Chase's grocery stores exclude warehouse clubs, discount stores, drugstores and gas at grocery-store stations; delivery services count only if they code as a grocery store.
milestones:
  - id: spend-35k
    spend: 35000
    period: calendar_year
    rewards:
      - Gold Elite status
    note: January 1 through December 31; purchases that post in the next year count toward that year. Chase says to allow up to 8 weeks for status to post. One Boundless account per Marriott Bonvoy member qualifies.
