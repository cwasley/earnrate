todo:
  - 'The welcome offer is 3 Free Night Awards (each up to 50,000 points a night) after $3,000 in purchases in the first 3 months, not points, so the schema can''t hold it. Chase: "This credit card is not available to you if (1) you currently have any of the following cards or (2) you received a new cardmember bonus for any of the following cards within the last 24 months" (Marriott Bonvoy Premier, Rewards Premier, Boundless, Rewards Premier Plus, Bold); the bonus also isn''t available to holders of the Marriott Bonvoy American Express Card in the last 30 days, or anyone approved for Brilliant or Bevy in the last 90 days or paid their bonus in the last 24 months.'
  - 1 Elite Night Credit for every $5,000 in purchases, with no limit, isn't modeled (milestones are once a period).
  - The yearly Free Night Award (up to 35,000 points) after each account anniversary, automatic Silver Elite status and 15 Elite Night Credits each calendar year aren't modeled; they don't depend on spending.
  - "The airline statement credit isn't modeled: $50 after $250 on purchases directly with airlines June 4 to Dec 31, 2026, and another $50 after $250 Jan 1 to June 30, 2027."
