# The banks behind the cards: the name shown for each, and other words people
# search with ("bofa", "amex"). Every card's `issuer` must be one of these.

- id: amex
  name: American Express
  search: [amex, american express]
- id: bank-of-america
  name: Bank of America
  search: [bofa, boa, bankofamerica]
- id: barclays
  name: Barclays
  search: [barclaycard, barclays us]
- id: capital-one
  name: Capital One
  search: [capitalone]
- id: chase
  name: Chase
- id: citi
  name: Citi
  search: [citibank]
- id: column
  # Column N.A. issues the Bilt card; people know it as Bilt.
  name: Bilt
  search: [bilt]
- id: discover
  name: Discover
  search: [discover it]
- id: sofi
  name: SoFi
- id: synchrony
  # Synchrony Bank issues the PayPal Cashback Mastercard.
  name: Synchrony
  search: [syf, synchrony bank]
- id: td-bank
  name: TD Bank
  search: [td]
- id: usbank
  name: U.S. Bank
  search: [us bank]
- id: wells-fargo
  name: Wells Fargo
  search: [wf, wellsfargo]
