# More warehouse clubs and discount stores. Chase's grocery category leaves out
# "warehouse clubs, discount stores and some smaller merchants such as
# drugstores" (chase.com/personal/credit-cards/rewards-category-faq).
- id: bjs-wholesale-club
  name: "BJ's Wholesale Club"
  aliases: [bjs, bjs wholesale, bjs wholesale club, bjs club]
  domains: [bjs.com]
  category: warehouse_club
  note: Codes as a warehouse club, which Amex, Chase and Capital One leave out of their grocery bonuses. For the restaurant chain, ask about BJ's Restaurant & Brewhouse.
# Listed here, beside BJ's Wholesale Club, so "BJ's" alone means the club
# and the restaurant still answers to its own names.
- id: bjs-restaurant
  name: "BJ's Restaurant & Brewhouse"
  aliases: [bjs restaurant, bjs restaurant and brewhouse, bjs brewhouse]
  category: dining
- id: bjs-gas
  name: "BJ's Gas"
  aliases: [bjs gas, bjs gas station]
  category: gas.superstore
  note: Issuers usually exclude warehouse-club gas from gas bonuses.
- id: dollar-general
  name: Dollar General
  domains: [dollargeneral.com]
  category: other
  note: Sells groceries but codes as a discount store, which issuers leave out of grocery bonuses.
- id: dollar-tree
  name: Dollar Tree
  domains: [dollartree.com]
  category: other
  note: Sells groceries but codes as a discount store, which issuers leave out of grocery bonuses.
- id: family-dollar
  name: Family Dollar
  domains: [familydollar.com]
  category: other
  note: Sells groceries but codes as a discount store, which issuers leave out of grocery bonuses.

