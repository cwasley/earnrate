# Supercenters that sell a full grocery line. U.S. Bank calls both grocery
# stores (cashplus.usbank.com/cash-plus/samplemerchants), but Amex leaves
# superstores out of U.S. supermarkets.
- id: meijer
  name: Meijer
  domains: [meijer.com]
  category: grocery.supermarket
  ambiguity:
    may_code_as: [superstore]
    note: Meijer is a supercenter that usually codes as a grocery store. Amex leaves superstores out of its supermarket category, so a purchase may not earn its supermarket rate.
- id: fred-meyer
  name: Fred Meyer
  domains: [fredmeyer.com]
  category: grocery.supermarket
  ambiguity:
    may_code_as: [superstore]
    note: "Fred Meyer is Kroger's supercenter and usually codes as a grocery store. Amex leaves superstores out of its supermarket category, so a purchase may not earn its supermarket rate."
