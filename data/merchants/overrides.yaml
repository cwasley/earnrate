# Fast-casual chains can post as fast food (MCC 5814) or as restaurants (5812).
# U.S. Bank's Cash+ sample lists put Smashburger under restaurants but Subway
# and Qdoba under fast food, so the counter-service burger and smoothie chains
# below could go either way.
- id: five-guys
  name: Five Guys
  aliases: [five guys burgers and fries]
  category: dining.fast_food
  ambiguity:
    may_code_as: [dining]
    note: Fast-casual chains can post as fast food (MCC 5814) or as a restaurant (5812); a statement shows which.
- id: shake-shack
  name: Shake Shack
  category: dining.fast_food
  ambiguity:
    may_code_as: [dining]
    note: Fast-casual chains can post as fast food (MCC 5814) or as a restaurant (5812); a statement shows which.
- id: tropical-smoothie-cafe
  name: Tropical Smoothie Cafe
  aliases: [tropical smoothie]
  category: dining.fast_food
  ambiguity:
    may_code_as: [dining]
    note: Fast-casual chains can post as fast food (MCC 5814) or as a restaurant (5812); a statement shows which.

# Delivery apps. U.S. Bank lists them under Restaurants and Chase's dining
# category counts them, but Chase's "dining purchased directly from a
# restaurant" category leaves out third-party delivery.
- id: grubhub
  name: Grubhub
  aliases: [grub hub, seamless]
  domains: [grubhub.com, seamless.com]
  category: dining
  note: A delivery app that codes as a restaurant for most issuers. Bonuses limited to buying directly from a restaurant don't count it.
- id: postmates
  name: Postmates
  domains: [postmates.com]
  category: dining
  note: A delivery app that codes as a restaurant for most issuers. Bonuses limited to buying directly from a restaurant don't count it.

# A dinner theater: food ordered at your seat may land on the same check.
- id: alamo-drafthouse
  name: Alamo Drafthouse Cinema
  aliases: [alamo drafthouse]
  domains: [drafthouse.com]
  category: movie_theaters
  ambiguity:
    may_code_as: [dining]
    note: Tickets code as a movie theater. Food and drinks ordered at your seat usually post on the theater's charge too, but a location's kitchen may bill separately as a restaurant.

# Parking codes as MCC 7523, which Amex and Chase count as transit but U.S.
# Bank's Cash+ ground transportation leaves out.
- id: parkmobile
  name: ParkMobile
  aliases: [park mobile]
  domains: [parkmobile.io]
  category: transit
  likely_mcc: 7523
  note: Parking codes as MCC 7523. Amex and Chase count parking as transit; U.S. Bank's ground transportation doesn't.
- id: spothero
  name: SpotHero
  aliases: [spot hero]
  domains: [spothero.com]
  category: transit
  likely_mcc: 7523
  note: Parking codes as MCC 7523. Amex and Chase count parking as transit; U.S. Bank's ground transportation doesn't.

# Booking.com charges prepaid stays itself, but "pay at the property" stays are
# charged by the hotel.
- id: booking-com
  name: Booking.com
  aliases: [booking com]
  domains: [booking.com]
  category: travel
  ambiguity:
    may_code_as: [travel.hotels]
    note: Prepaid bookings code as a travel agency. Stays you pay for at the property are charged by the hotel and code as a hotel.

# AT&T bills wireless and home internet separately.
- id: att
  name: AT&T
  aliases: [att, at and t, at&t wireless]
  domains: [att.com]
  category: phone
  ambiguity:
    may_code_as: [tv_internet]
    note: AT&T bills wireless and home internet separately. A wireless bill is cell phone service; an AT&T Internet or Fiber bill is TV and internet service.

