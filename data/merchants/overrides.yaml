- id: dollar-tree
  name: Dollar Tree
  domains: [dollartree.com]
  category: other
  note: Sells groceries but codes as a discount store, which issuers leave out of grocery bonuses.
- id: family-dollar
  name: Family Dollar
  domains: [familydollar.com]
  category: other
