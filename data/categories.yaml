# Issuer-agnostic spend categories. A rule that matches a parent (`travel`)
# also matches its children (`travel.flights`). Superstores and warehouse clubs
# are deliberately not under `grocery`: issuers exclude them from grocery bonuses.
# MCCs are typical codes, used as hints only.

- id: dining
  name: Restaurants
  aliases:
    [
      dining,
      restaurant,
      food,
      eating out,
      takeout,
      dinner,
      lunch,
      breakfast,
      brunch,
      food delivery,
    ]
  mccs: [5812, 5813, 5814]
- id: dining.fast_food
  name: Fast food
  preposition: on
  aliases:
    [fast food restaurants, coffee shop, coffee shops, coffee, cafe, cafes]
  mccs: [5814]

- id: grocery
  name: Grocery stores
  # Its old page, /best/grocery, redirects to the supermarkets page, which
  # ranks every card at least as high and is where "groceries" searches land.
  slug: grocery
  page: grocery.supermarket
