# No card earns a bonus here. The Bilt facts come from the Bilt cards' todo
# notes and bilt.com/card, which every Bilt card lists in source_urls.
- id: housing
  preposition: on
  name: Rent and mortgage
  aliases:
    [rent, rent payment, mortgage, mortgage payment, housing, housing payment]
  mccs: [6513]
  note: "Most landlords and lenders don't take cards directly, and paying through a payment service usually costs a fee that outweighs what a card earns. The Bilt cards pay rent and mortgages through Bilt with no transaction fee and earn up to 1.25X Bilt points on them; the rate goes up with how much else you spend on the card that billing cycle."
  unranked: true
  cards: [bilt-blue, bilt-obsidian, bilt-palladium]

