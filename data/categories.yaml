# Issuer-agnostic spend categories. A rule that matches a parent (`travel`)
# also matches its children (`travel.flights`). Superstores and warehouse clubs
# are deliberately not under `grocery`: issuers exclude them from grocery bonuses.
# MCCs are typical codes, used as hints only.

- id: dining
  name: Restaurants
  aliases:
    [
      dining,
      restaurant,
      food,
      eating out,
      takeout,
      dinner,
      lunch,
      breakfast,
      brunch,
      food delivery,
    ]
  mccs: [5812, 5813, 5814]
- id: dining.fast_food
  name: Fast food
  preposition: on
  aliases:
    [fast food restaurants, coffee shop, coffee shops, coffee, cafe, cafes]
  places: [Coffee shop]
  mccs: [5814]
- id: dining.bars
  name: Bars and nightclubs
  aliases: [bar, pub, tavern, nightclub, cocktail lounge]
  mccs: [5813]
# Not under dining: some issuers count caterers as restaurants and others
# leave them out, and most dining terms don't say.
- id: caterers
  name: Caterers
  aliases: [caterer, catering]
