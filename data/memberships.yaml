# Memberships that raise a card's rates (a rule's `requires.membership`) or
# that a card can't be had without (a card's `requires_membership`). The
# fee for one a card needs is quoted in that card's evidence.

- id: amazon-prime
  name: Amazon Prime
  ask: I have Amazon Prime
- id: costco
  name: Costco membership
  ask: I have a Costco membership
  # Gold Star, the basic tier. Executive ($130) pays some of its cost back
  # as Costco's own 2% reward, which earnrate doesn't model.
  annual_fee: 65
  members_shop_at: [costco, costco-gas, costco-travel]
- id: sams-club
  name: Sam's Club membership
  ask: I have a Sam's Club membership
  # Club, the basic tier ($60). Plus ($120) is its own entry below because it
  # raises the Sam's Club Mastercard's rate at Sam's Club.
  annual_fee: 60
  members_shop_at: [sams-club, sams-club-gas]
- id: sams-club-plus
  name: Sam's Club Plus membership
  ask: I have Sam's Club Plus
- id: bank-of-america-account
  name: Bank of America checking or savings
  ask: I bank with Bank of America
- id: bank-of-america-small-business-account
  name: Bank of America small business checking or savings
- id: bofa-rewards-member
  name: BofA Rewards Member
  group: bofa-preferred-rewards
- id: bofa-rewards-preferred-plus
  name: BofA Rewards Preferred Plus
  group: bofa-preferred-rewards
- id: bofa-rewards-preferred-honors
  name: BofA Rewards Preferred Honors
  group: bofa-preferred-rewards
- id: bofa-rewards-premier
  name: BofA Rewards Premier
  group: bofa-preferred-rewards
- id: nordy-club-ambassador
  name: Nordy Club Ambassador
# Credit union memberships are by eligibility (employer, family, area), not
# a yearly fee. Caltech EFCU's is a one-time $5 fee plus a $5 deposit.
- id: caltech-efcu
  name: Caltech Employees Federal Credit Union membership
  annual_fee: 0
