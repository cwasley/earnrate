# Memberships that raise a card's rates (a rule's `requires.membership`) or
# that a card can't be had without (a card's `requires_membership`). The
# fee for one a card needs is quoted in that card's evidence.

- id: amazon-prime
  name: Amazon Prime
  ask: I have Amazon Prime
- id: costco
  name: Costco membership
  ask: I have a Costco membership
  # Gold Star, the basic tier. Executive ($130) pays some of its cost back
  # as Costco's own 2% reward, which earnrate doesn't model.
  annual_fee: 65
  members_shop_at: [costco, costco-gas, costco-travel]
- id: sams-club
  name: Sam's Club membership
  ask: I have a Sam's Club membership
  # Club, the basic tier ($60). Plus ($120) is its own entry below because it
  # raises the Sam's Club Mastercard's rate at Sam's Club.
  annual_fee: 60
  members_shop_at: [sams-club, sams-club-gas]
- id: sams-club-plus
  name: Sam's Club Plus membership
  ask: I have Sam's Club Plus
- id: bank-of-america-account
  name: Bank of America checking or savings
  ask: I bank with Bank of America
- id: bank-of-america-small-business-account
  name: Bank of America small business checking or savings
- id: bofa-rewards-member
  name: BofA Rewards Member
  group: bofa-preferred-rewards
- id: bofa-rewards-preferred-plus
  name: BofA Rewards Preferred Plus
  group: bofa-preferred-rewards
- id: bofa-rewards-preferred-honors
  name: BofA Rewards Preferred Honors
  group: bofa-preferred-rewards
- id: bofa-rewards-premier
  name: BofA Rewards Premier
  group: bofa-preferred-rewards
- id: nordy-club-ambassador
  # Icon, the status above Ambassador, earns the same with the card.
  name: Nordy Club Ambassador or Icon status
# Credit union memberships are by eligibility (employer, family, area), not
# a yearly fee. Caltech EFCU's is a one-time $5 fee plus a $5 deposit; Navy
# Federal's (the armed forces, veterans, DoD civilians and their families) a
# $5 minimum savings balance.
- id: caltech-efcu
  name: Caltech Employees Federal Credit Union membership
  annual_fee: 0
- id: navy-federal
  name: Navy Federal Credit Union membership
  annual_fee: 0
# U.S. Bank Smartly Earning Bonus tiers, by the qualifying balance in Bank
# Smartly Checking and Safe Debit with a Bank Smartly Savings account.
- id: usbank-smartly-25
  name: U.S. Bank Smartly Earning Bonus, 25% tier
  group: usbank-smartly-earning-bonus
- id: usbank-smartly-50
  name: U.S. Bank Smartly Earning Bonus, 50% tier ($50,000 or more)
  group: usbank-smartly-earning-bonus
- id: usbank-smartly-100
  name: U.S. Bank Smartly Earning Bonus, 100% tier ($100,000 or more)
  group: usbank-smartly-earning-bonus
# The price isn't on file: rei.com refuses plain fetches and Capital One's
# card page doesn't state it. 0 is a placeholder.
- id: rei-co-op
  name: REI Co-op membership
  annual_fee: 0
# Account Owner or Manager on a consumer postpaid Verizon wireless account,
# or a Fios Account Owner. It's the service bill, not a fee of its own.
- id: verizon-account
  name: Verizon wireless or Fios account
  annual_fee: 0
# A PenFed checking account, or military service: raises the PenFed Power
# Cash Rewards card from 1.5% to 2%.
- id: penfed-honors-advantage
  name: PenFed Honors Advantage
